        const TILE = Math.min((canvas.width - PADDING * (SIZE + 1)) / SIZE, (canvas.height - 80 - PADDING * (SIZE + 1)) / SIZE);
        const OFFX = (canvas.width - (TILE * SIZE + PADDING * (SIZE - 1))) / 2;
        const OFFY = 70 + (canvas.height - 80 - (TILE * SIZE + PADDING * (SIZE - 1))) / 2;

        let grid = [];
        let score = 0;
        let best = 0;
        let gameOver = false;
        let won = false;
        let animating = false;
        let mergeEffects = [];

        const COLORS = {
          2: { bg: '#2a2a3e', fg: '#e0e0f0' },
          4: { bg: '#3a3a5e', fg: '#e0e0f0' },
          8: { bg: '#5e3a2e', fg: '#ffffff' },
          16: { bg: '#7e3a1e', fg: '#ffffff' },
          32: { bg: '#9e3a3e', fg: '#ffffff' },
          64: { bg: '#be3a5e', fg: '#ffffff' },
          128: { bg: '#de5a3e', fg: '#ffffff' },
          256: { bg: '#ee8a2e', fg: '#ffffff' },
          512: { bg: '#eec02e', fg: '#000000' },
          1024: { bg: '#eed02e', fg: '#000000' },
          2048: { bg: '#eef02e', fg: '#000000' },
          4096: { bg: '#a0f02e', fg: '#000000' },
          8192: { bg: '#40f0a0', fg: '#000000' }
        };

        function reset() {
          grid = [];
          for (let y = 0; y < SIZE; y++) {
            grid[y] = [];
            for (let x = 0; x < SIZE; x++) {
              grid[y][x] = 0;
            }
          }
          score = 0;
          gameOver = false;
          won = false;
          animating = false;
          mergeEffects = [];
          addRandomTile();
          addRandomTile();
          UI.hideGameOverlay();
          updateHUD();
        }

        function addRandomTile() {
          const empty = [];
          for (let y = 0; y < SIZE; y++) {
            for (let x = 0; x < SIZE; x++) {
              if (grid[y][x] === 0) empty.push({ x, y });
            }
          }
          if (empty.length === 0) return;
          const p = empty[randInt(0, empty.length - 1)];
          grid[p.y][p.x] = Math.random() < 0.9 ? 2 : 4;
        }

        function updateHUD() {
          UI.updateGameHUD('2048 Puzzle', score, Storage.getHighScore('2048'));
        }

        function canMove() {
          for (let y = 0; y < SIZE; y++) {
            for (let x = 0; x < SIZE; x++) {
              if (grid[y][x] === 0) return true;
              if (x < SIZE - 1 && grid[y][x] === grid[y][x + 1]) return true;
              if (y < SIZE - 1 && grid[y][x] === grid[y + 1][x]) return true;
            }
          }
          return false;
        }

        function move(dirX, dirY) {
          if (animating || gameOver) return;
          let moved = false;
          const merged = [];
          for (let y = 0; y < SIZE; y++) {
            merged[y] = [];
            for (let x = 0; x < SIZE; x++) merged[y][x] = false;
          }

          const traversals = [];
          for (let i = 0; i < SIZE; i++) traversals.push(i);
          const xOrder = dirX > 0 ? traversals.slice().reverse() : traversals;
          const yOrder = dirY > 0 ? traversals.slice().reverse() : traversals;

          for (const y of yOrder) {
            for (const x of xOrder) {
              if (grid[y][x] === 0) continue;
              let nx = x, ny = y;
              while (true) {
                const tx = nx + dirX;
                const ty = ny + dirY;
                if (tx < 0 || tx >= SIZE || ty < 0 || ty >= SIZE) break;
                if (grid[ty][tx] === 0) {
                  grid[ty][tx] = grid[ny][nx];
                  grid[ny][nx] = 0;
                  nx = tx; ny = ty;
                  moved = true;
                } else if (grid[ty][tx] === grid[ny][nx] && !merged[ty][tx]) {
                  const newVal = grid[ny][nx] * 2;
                  grid[ty][tx] = newVal;
                  grid[ny][nx] = 0;
                  score += newVal;
                  merged[ty][tx] = true;
                  moved = true;
                  mergeEffects.push({
                    x: tx, y: ty,
                    life: 0.4, maxLife: 0.4,
                    value: newVal
                  });
                  if (newVal === 2048 && !won) {
                    won = true;
                    AudioEngine.success();
                  }
                  break;
                } else {
                  break;
                }
              }
            }
          }

          if (moved) {
            addRandomTile();
            updateHUD();
            AudioEngine.tone(300, 0.06, 'sine', 0.04);
            if (!canMove()) {
              gameOver = true;
              Storage.setHighScore('2048', score);
              UI.updateGameHUD('2048 Puzzle', score, Storage.getHighScore('2048'));
              UI.showGameOverlay(
                won ? 'ПЕРЕМОГА!' : 'ГРУ ЗАВЕРШЕНО',
                won ? 'Ти досяг 2048!' : 'Більше немає ходів',
                'ГРАТИ ЗНОВУ',
                'Очки: <span>' + formatNumber(score) + '</span>'
              );
              AudioEngine.fail();
            }
          }
        }

        return {
          init() { reset(); },

          setupControls(container) {
            container.innerHTML = '';
            const bar = document.createElement('div');
            bar.style.cssText = 'display:flex;gap:10px;flex-wrap:wrap;justify-content:center;';

            const resetBtn = document.createElement('button');
            resetBtn.className = 'action-btn';
            resetBtn.style.cssText = 'width:auto;padding:10px 20px;border-radius:14px;font-size:13px;height:auto;min-height:54px;border-color:#ffcc00;color:#ffcc00;';
            resetBtn.textContent = '↻ НОВА ГРА';
            resetBtn.addEventListener('click', (e) => {
              e.preventDefault();
              reset();
              AudioEngine.click();
            });
            bar.appendChild(resetBtn);
            container.appendChild(bar);

            if (!this._keyHandler) {
              this._keyHandler = (e) => {
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyW', 'KeyA', 'KeyS', 'KeyD'].includes(e.code)) {
                  e.preventDefault();
                  if (e.code === 'ArrowUp' || e.code === 'KeyW') move(0, -1);
                  else if (e.code === 'ArrowDown' || e.code === 'KeyS') move(0, 1);
                  else if (e.code === 'ArrowLeft' || e.code === 'KeyA') move(-1, 0);
                  else if (e.code === 'ArrowRight' || e.code === 'KeyD') move(1, 0);
                }
              };
              document.addEventListener('keydown', this._keyHandler);

              let sx = 0, sy = 0;
              this._swipe = {
                start: (e) => {
                  if (e.touches.length === 1) {
                    sx = e.touches[0].clientX;
                    sy = e.touches[0].clientY;
                  }
                },
                move: (e) => {
                  e.preventDefault();
                  if (e.touches.length === 1) {
                    const dx = e.touches[0].clientX - sx;
                    const dy = e.touches[0].clientY - sy;
                    const th = 30;
                    if (Math.abs(dx) > th || Math.abs(dy) > th) {
                      if (Math.abs(dx) > Math.abs(dy)) {
                        move(dx > 0 ? 1 : -1, 0);
                      } else {
                        move(0, dy > 0 ? 1 : -1);
                      }
                      sx = e.touches[0].clientX;
                      sy = e.touches[0].clientY;
                    }
                  }
                },
                end: () => {}
              };
              canvas.addEventListener('touchstart', this._swipe.start, { passive: true });
              canvas.addEventListener('touchmove', this._swipe.move, { passive: false });
              canvas.addEventListener('touchend', this._swipe.end);
            }
          },

          onOverlayAction() { reset(); },

          update(dt) {
            for (let i = mergeEffects.length - 1; i >= 0; i--) {
              mergeEffects[i].life -= dt;
              if (mergeEffects[i].life <= 0) mergeEffects.splice(i, 1);
            }
          },

          render(c, dt) {
            const grad = c.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, '#1a1a0a');
            grad.addColorStop(1, '#0a0a05');
            c.fillStyle = grad;
            c.fillRect(0, 0, canvas.width, canvas.height);

            c.fillStyle = 'rgba(255, 200, 0, 0.05)';
            c.fillRect(OFFX - PADDING, OFFY - PADDING, TILE * SIZE + PADDING * (SIZE + 1), TILE * SIZE + PADDING * (SIZE + 1));
            c.strokeStyle = 'rgba(255, 200, 0, 0.15)';
            c.lineWidth = 2;
            c.strokeRect(OFFX - PADDING, OFFY - PADDING, TILE * SIZE + PADDING * (SIZE + 1), TILE * SIZE + PADDING * (SIZE + 1));

            for (let y = 0; y < SIZE; y++) {
              for (let x = 0; x < SIZE; x++) {
                const px = OFFX + x * (TILE + PADDING);
                const py = OFFY + y * (TILE + PADDING);
                c.fillStyle = 'rgba(30, 30, 50, 0.6)';
                c.fillRect(px, py, TILE, TILE);
                c.strokeStyle = 'rgba(255, 200, 0, 0.08)';
                c.lineWidth = 1;
                c.strokeRect(px + 0.5, py + 0.5, TILE - 1, TILE - 1);

                const val = grid[y][x];
                if (val > 0) {
                  const col = COLORS[val] || { bg: '#ffffff', fg: '#000000' };
                  const fontSize = val >= 1000 ? TILE * 0.32 : val >= 100 ? TILE * 0.4 : TILE * 0.48;
                  c.save();
                  c.shadowColor = col.bg;
                  c.shadowBlur = 12;
                  c.fillStyle = col.bg;
                  c.fillRect(px + 2, py + 2, TILE - 4, TILE - 4);
                  c.restore();
                  c.fillStyle = col.fg;
                  c.font = 'bold ' + fontSize + 'px "Segoe UI", sans-serif';
                  c.textAlign = 'center';
                  c.textBaseline = 'middle';
                  c.fillText(String(val), px + TILE / 2, py + TILE / 2);
                }
              }
            }

            for (const e of mergeEffects) {
              const alpha = e.life / e.maxLife;
              const px = OFFX + e.x * (TILE + PADDING) + TILE / 2;
              const py = OFFY + e.y * (TILE + PADDING) + TILE / 2;
              c.globalAlpha = alpha;
              c.fillStyle = '#ffffff';
              c.font = 'bold ' + (TILE * 0.5) + 'px "Segoe UI", sans-serif';
              c.textAlign = 'center';
              c.textBaseline = 'middle';
              c.shadowColor = '#ffffff';
              c.shadowBlur = 20;
              c.fillText('+' + e.value, px, py - (1 - alpha) * 30);
              c.shadowBlur = 0;
            }
            c.globalAlpha = 1;

            c.fillStyle = '#ffcc00';
            c.font = 'bold 16px "Segoe UI", sans-serif';
            c.textAlign = 'left';
            c.fillText('Очки: ' + score, 14, 28);
            c.fillText('Рекорд: ' + Storage.getHighScore('2048'), 14, 50);
          },

          destroy() {
            if (this._keyHandler) {
              document.removeEventListener('keydown', this._keyHandler);
              this._keyHandler = null;
            }
            if (this._swipe) {
              canvas.removeEventListener('touchstart', this._swipe.start);
              canvas.removeEventListener('touchmove', this._swipe.move);
              canvas.removeEventListener('touchend', this._swipe.end);
              this._swipe = null;
            }
          }
        };
      };

      /* ======================================================================
         GAME 10: BREAKOUT / ARKANOID
         ====================================================================== */
      GameFactory.breakout = function(canvas, ctx) {
        const W = canvas.width;
        const H = canvas.height;
        const PADDLE_W = 110;
        const PADDLE_H = 14;
        const BALL_R = 8;
        const BRICK_COLS = 10;
        const BRICK_ROWS = 6;
        const BRICK_W = (W - 40) / BRICK_COLS;
        const BRICK_H = 22;
        const BRICK_TOP = 70;

        let paddle = { x: W / 2, y: H - 40, w: PADDLE_W, h: PADDLE_H, vx: 0 };
        let balls = [];
        let bricks = [];
        let particles = [];
        let powerups = [];
        let score = 0;
        let lives = 3;
        let gameOver = false;
        let win = false;
        let keys = {};
        let touchX = null;
        let level = 1;

        const COLORS = ['#ff4060', '#ff8040', '#ffcc00', '#40ff80', '#40c0ff', '#c040ff'];

        function buildBricks() {
          bricks = [];
          for (let y = 0; y < BRICK_ROWS; y++) {
            for (let x = 0; x < BRICK_COLS; x++) {
              const hp = y < 2 ? 2 : 1;
              bricks.push({
                x: 20 + x * BRICK_W,
                y: BRICK_TOP + y * BRICK_H,
                w: BRICK_W - 4,
                h: BRICK_H - 4,
                hp,
                maxHp: hp,
                color: COLORS[y % COLORS.length],
                alive: true
              });
            }
          }
        }

        function resetBall() {
          balls = [{
            x: paddle.x,
            y: paddle.y - 20,
            vx: 220 * (Math.random() < 0.5 ? 1 : -1),
            vy: -320,
            r: BALL_R,
            stuck: true
          }];
        }

        function reset() {
          paddle = { x: W / 2, y: H - 40, w: PADDLE_W, h: PADDLE_H, vx: 0 };
          balls = [];
          particles = [];
          powerups = [];
          score = 0;
          lives = 3;
          gameOver = false;
          win = false;
          level = 1;
          buildBricks();
          resetBall();
          UI.hideGameOverlay();
          updateHUD();
        }

        function updateHUD() {
          UI.updateGameHUD('Breakout', score, Storage.getHighScore('breakout'));
        }

        function endGame(isWin) {
          if (gameOver || win) return;
          gameOver = !isWin;
          win = isWin;
          Storage.setHighScore('breakout', score);
          UI.updateGameHUD('Breakout', score, Storage.getHighScore('breakout'));
          UI.showGameOverlay(
            isWin ? 'ПЕРЕМОГА!' : 'ГРУ ЗАВЕРШЕНО',
            isWin ? 'Ти розбив усі блоки!' : 'М\'яч впав!',
            isWin ? 'ГРАТИ ЗНОВУ' : 'СПРОБУВАТИ ЗНОВУ',
            'Очки: <span>' + formatNumber(score) + '</span>'
          );
          if (isWin) AudioEngine.success(); else AudioEngine.fail();
        }

        function launchBall() {
          for (const b of balls) {
            if (b.stuck) {
              b.stuck = false;
              b.vx = 220 * (Math.random() < 0.5 ? 1 : -1);
              b.vy = -320;
            }
          }
        }

        return {
          init() { reset(); },

          setupControls(container) {
            container.innerHTML = '';
            const bar = document.createElement('div');
            bar.style.cssText = 'display:flex;gap:10px;flex-wrap:wrap;justify-content:center;';

            const launchBtn = document.createElement('button');
            launchBtn.className = 'action-btn';
            launchBtn.style.cssText = 'width:auto;padding:10px 24px;border-radius:14px;font-size:13px;height:auto;min-height:54px;border-color:#40ff80;color:#40ff80;';
            launchBtn.textContent = '🚀 ЗАПУСК';
            launchBtn.addEventListener('click', (e) => {
              e.preventDefault();
              launchBall();
              AudioEngine.click();
            });
            bar.appendChild(launchBtn);

            const resetBtn = document.createElement('button');
            resetBtn.className = 'action-btn';
            resetBtn.style.cssText = 'width:auto;padding:10px 20px;border-radius:14px;font-size:13px;height:auto;min-height:54px;border-color:#ffcc00;color:#ffcc00;';
            resetBtn.textContent = '↻ НОВА ГРА';
            resetBtn.addEventListener('click', (e) => {
              e.preventDefault();
              reset();
              AudioEngine.click();
            });
            bar.appendChild(resetBtn);
            container.appendChild(bar);

            if (!this._keyHandler) {
              this._keyHandler = (e) => {
                if (['ArrowLeft', 'ArrowRight', 'KeyA', 'KeyD', 'Space'].includes(e.code)) {
                  e.preventDefault();
                }
                if (e.code === 'Space') launchBall();
                keys[e.code] = true;
              };
              this._keyUpHandler = (e) => { keys[e.code] = false; };
              document.addEventListener('keydown', this._keyHandler);
              document.addEventListener('keyup', this._keyUpHandler);

              this._touchHandler = (e) => {
                e.preventDefault();
                const t = e.touches ? e.touches[0] : e;
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                touchX = (t.clientX - rect.left) * scaleX;
                if (e.type === 'touchstart' || e.type === 'mousedown') launchBall();
              };
              canvas.addEventListener('touchstart', this._touchHandler, { passive: false });
              canvas.addEventListener('touchmove', this._touchHandler, { passive: false });
              canvas.addEventListener('mousedown', this._touchHandler);
              canvas.addEventListener('mousemove', (e) => {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                touchX = (e.clientX - rect.left) * scaleX;
              });
            }
          },

          onOverlayAction() { reset(); },

          update(dt) {
            if (gameOver || win) return;

            let dx = 0;
            if (keys['ArrowLeft'] || keys['KeyA']) dx = -1;
            if (keys['ArrowRight'] || keys['KeyD']) dx = 1;
            if (dx !== 0) {
              paddle.x += dx * 520 * dt;
            }
            if (touchX !== null) {
              const target = touchX - paddle.w / 2;
              paddle.x = lerp(paddle.x, target, dt * 14);
            }
            paddle.x = clamp(paddle.x, 0, W - paddle.w);

            for (let i = balls.length - 1; i >= 0; i--) {
              const b = balls[i];
              if (b.stuck) {
                b.x = paddle.x + paddle.w / 2;
                b.y = paddle.y - b.r - 4;
                continue;
              }

              b.x += b.vx * dt;
              b.y += b.vy * dt;

              if (b.x - b.r < 0) { b.x = b.r; b.vx = Math.abs(b.vx); AudioEngine.tone(400, 0.05, 'square', 0.04); }
              if (b.x + b.r > W) { b.x = W - b.r; b.vx = -Math.abs(b.vx); AudioEngine.tone(400, 0.05, 'square', 0.04); }
              if (b.y - b.r < 0) { b.y = b.r; b.vy = Math.abs(b.vy); AudioEngine.tone(400, 0.05, 'square', 0.04); }

              if (b.y + b.r > H) {
                balls.splice(i, 1);
                AudioEngine.hit();
                continue;
              }

              if (b.y + b.r > paddle.y && b.y - b.r < paddle.y + paddle.h &&
                  b.x > paddle.x && b.x < paddle.x + paddle.w) {
                b.y = paddle.y - b.r;
                const hitPos = (b.x - paddle.x) / paddle.w - 0.5;
                const angle = hitPos * Math.PI * 0.6;
                const speed = Math.hypot(b.vx, b.vy);
                b.vx = Math.sin(angle) * speed;
                b.vy = -Math.abs(Math.cos(angle) * speed);
                AudioEngine.tone(600, 0.06, 'square', 0.05);
              }

              for (const br of bricks) {
                if (!br.alive) continue;
                if (b.x + b.r > br.x && b.x - b.r < br.x + br.w &&
                    b.y + b.r > br.y && b.y - b.r < br.y + br.h) {
                  const overlapX = Math.min(b.x + b.r - br.x, br.x + br.w - (b.x - b.r));
                  const overlapY = Math.min(b.y + b.r - br.y, br.y + br.h - (b.y - b.r));
                  if (overlapX < overlapY) {
                    b.vx = -b.vx;
                  } else {
                    b.vy = -b.vy;
                  }
                  br.hp--;
                  if (br.hp <= 0) {
                    br.alive = false;
                    score += 20;
                    updateHUD();
                    AudioEngine.coin();
                    for (let k = 0; k < 8; k++) {
                      particles.push({
                        x: br.x + br.w / 2,
                        y: br.y + br.h / 2,
                        vx: rand(-150, 150), vy: rand(-150, 150),
                        life: 0.5, maxLife: 0.5,
                        color: br.color, size: rand(2, 5)
                      });
                    }
                  } else {
                    AudioEngine.tone(500, 0.05, 'square', 0.04);
                  }
                  break;
                }
              }
            }

            if (balls.length === 0) {
              lives--;
              if (lives <= 0) {
                endGame(false);
                return;
              }
              resetBall();
            }

            if (bricks.every(br => !br.alive)) {
              endGame(true);
              return;
            }

            for (let i = particles.length - 1; i >= 0; i--) {
              const p = particles[i];
              p.x += p.vx * dt;
              p.y += p.vy * dt;
              p.vx *= 0.96;
              p.vy *= 0.96;
              p.life -= dt;
              if (p.life <= 0) particles.splice(i, 1);
            }
          },

          render(c, dt) {
            const grad = c.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, '#0a1a2e');
            grad.addColorStop(1, '#050810');
            c.fillStyle = grad;
            c.fillRect(0, 0, W, H);

            c.fillStyle = 'rgba(0, 200, 255, 0.06)';
            c.fillRect(0, H - 8, W, 8);

            for (const br of bricks) {
              if (!br.alive) continue;
              c.save();
              c.shadowColor = br.color;
              c.shadowBlur = br.hp > 1 ? 14 : 6;
              c.fillStyle = br.color;
              c.globalAlpha = br.hp > 1 ? 1 : 0.85;
              c.fillRect(br.x, br.y, br.w, br.h);
              c.strokeStyle = 'rgba(255, 255, 255, 0.4)';
              c.lineWidth = 1.5;
              c.strokeRect(br.x + 0.5, br.y + 0.5, br.w - 1, br.h - 1);
              if (br.hp > 1) {
                c.fillStyle = 'rgba(255, 255, 255, 0.3)';
                c.fillRect(br.x + 4, br.y + 4, br.w - 8, 3);
              }
              c.restore();
            }
            c.globalAlpha = 1;

            c.save();
            c.shadowColor = '#00f0ff';
            c.shadowBlur = 18;
            const pg = c.createLinearGradient(paddle.x, paddle.y, paddle.x, paddle.y + paddle.h);
            pg.addColorStop(0, '#00f0ff');
            pg.addColorStop(1, '#0080ff');
            c.fillStyle = pg;
            c.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
            c.strokeStyle = '#ffffff';
            c.lineWidth = 2;
            c.strokeRect(paddle.x, paddle.y, paddle.w, paddle.h);
            c.restore();

            for (const b of balls) {
              c.save();
              c.shadowColor = '#ffcc00';
              c.shadowBlur = 18;
              c.beginPath();
              c.arc(b.x, b.y, b.r, 0, Math.PI * 2);
              const bg = c.createRadialGradient(b.x - 3, b.y - 3, 1, b.x, b.y, b.r);
              bg.addColorStop(0, '#ffffff');
              bg.addColorStop(0.5, '#ffdd00');
              bg.addColorStop(1, '#ff8800');
              c.fillStyle = bg;
              c.fill();
              c.restore();
            }

            for (const p of particles) {
              const alpha = p.life / p.maxLife;
              c.globalAlpha = alpha;
              c.fillStyle = p.color;
              c.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
            }
            c.globalAlpha = 1;

            c.fillStyle = '#00f0ff';
            c.font = 'bold 16px "Segoe UI", sans-serif';
            c.textAlign = 'left';
            c.fillText('❤ ' + lives, 14, 28);
            c.fillText('Блоки: ' + bricks.filter(b => b.alive).length, 14, 50);
          },

          destroy() {
            if (this._keyHandler) {
              document.removeEventListener('keydown', this._keyHandler);
              document.removeEventListener('keyup', this._keyUpHandler);
              this._keyHandler = null;
              this._keyUpHandler = null;
            }
            if (this._touchHandler) {
              canvas.removeEventListener('touchstart', this._touchHandler);
              canvas.removeEventListener('touchmove', this._touchHandler);
              canvas.removeEventListener('mousedown', this._touchHandler);
              this._touchHandler = null;
            }
          }
        };
      };

      /* ======================================================================
         GAME 11: MEMORY CARDS
         ====================================================================== */
      GameFactory.memory_cards = function(canvas, ctx) {
        const COLS = 4;
        const ROWS = 4;
        const TILE = Math.min(canvas.width / (COLS + 1), (canvas.height - 80) / (ROWS + 1));
        const OFFX = (canvas.width - COLS * TILE) / 2;
        const OFFY = 70 + (canvas.height - 80 - ROWS * TILE) / 2;

        const EMOJIS = ['🍎', '🍌', '🍇', '🍓', '🍒', '🍑', '🍊', '🍋', '🍉', '🍍', '🥝', '🍒', '🥥', '🍇', '🍎', '🍌'];

        let cards = [];
        let firstCard = null;
        let secondCard = null;
        let lockTimer = 0;
        let score = 0;
        let moves = 0;
        let matched = 0;
        let gameOver = false;
        let win = false;

        function reset() {
          const chosen = EMOJIS.slice(0, (COLS * ROWS) / 2);
          const deck = [];
          for (const e of chosen) {
            deck.push({ emoji: e, matched: false, flipped: false, scale: 0 });
            deck.push({ emoji: e, matched: false, flipped: false, scale: 0 });
          }
          for (let i = deck.length - 1; i > 0; i--) {
            const j = randInt(0, i);
            [deck[i], deck[j]] = [deck[j], deck[i]];
          }
          cards = [];
          let idx = 0;
          for (let y = 0; y < ROWS; y++) {
            cards[y] = [];
            for (let x = 0; x < COLS; x++) {
              cards[y][x] = deck[idx++];
            }
          }
          firstCard = null;
          secondCard = null;
          lockTimer = 0;
          score = 0;
          moves = 0;
          matched = 0;
          gameOver = false;
          win = false;
          UI.hideGameOverlay();
          updateHUD();
        }

        function updateHUD() {
          UI.updateGameHUD('Memory Cards', score, Storage.getHighScore('memory_cards'));
        }

        function endGame() {
          if (gameOver || win) return;
          win = true;
          score = Math.max(0, 1000 - moves * 20);
          Storage.setHighScore('memory_cards', score);
          UI.updateGameHUD('Memory Cards', score, Storage.getHighScore('memory_cards'));
          UI.showGameOverlay(
            'ПЕРЕМОГА!',
            'Ти знайшов усі пари за ' + moves + ' ходів!',
            'ГРАТИ ЗНОВУ',
            'Очки: <span>' + formatNumber(score) + '</span>'
          );
          AudioEngine.success();
        }

        function flipCard(x, y) {
          if (lockTimer > 0 || gameOver || win) return;
          const card = cards[y][x];
          if (card.matched || card.flipped) return;

          card.flipped = true;
          AudioEngine.click();

          if (!firstCard) {
            firstCard = { x, y };
          } else if (!secondCard && (firstCard.x !== x || firstCard.y !== y)) {
            secondCard = { x, y };
            moves++;
            updateHUD();
            if (cards[firstCard.y][firstCard.x].emoji === cards[secondCard.y][secondCard.x].emoji) {
              cards[firstCard.y][firstCard.x].matched = true;
              cards[secondCard.y][secondCard.x].matched = true;
              matched++;
              score += 100;
              updateHUD();
              AudioEngine.coin();
              firstCard = null;
              secondCard = null;
              if (matched === (COLS * ROWS) / 2) {
                setTimeout(() => endGame(), 400);
              }
            } else {
              lockTimer = 0.8;
            }
          }
        }

        return {
          init() { reset(); },

          setupControls(container) {
            container.innerHTML = '';
            const bar = document.createElement('div');
            bar.style.cssText = 'display:flex;gap:10px;flex-wrap:wrap;justify-content:center;';

            const resetBtn = document.createElement('button');
            resetBtn.className = 'action-btn';
            resetBtn.style.cssText = 'width:auto;padding:10px 20px;border-radius:14px;font-size:13px;height:auto;min-height:54px;border-color:#ffcc00;color:#ffcc00;';
            resetBtn.textContent = '↻ НОВА ГРА';
            resetBtn.addEventListener('click', (e) => {
              e.preventDefault();
              reset();
              AudioEngine.click();
            });
            bar.appendChild(resetBtn);
            container.appendChild(bar);

            if (!this._clickHandler) {
              this._clickHandler = (e) => {
                e.preventDefault();
                const t = e.touches ? e.touches[0] : e;
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const cx = (t.clientX - rect.left) * scaleX;
                const cy = (t.clientY - rect.top) * scaleY;
                const gx = Math.floor((cx - OFFX) / TILE);
                const gy = Math.floor((cy - OFFY) / TILE);
                if (gx >= 0 && gx < COLS && gy >= 0 && gy < ROWS) {
                  flipCard(gx, gy);
                }
              };
              canvas.addEventListener('touchstart', this._clickHandler, { passive: false });
              canvas.addEventListener('mousedown', this._clickHandler);
            }
          },

          onOverlayAction() { reset(); },

          update(dt) {
            for (let y = 0; y < ROWS; y++) {
              for (let x = 0; x < COLS; x++) {
                cards[y][x].scale = lerp(cards[y][x].scale, 1, dt * 8);
              }
            }

            if (lockTimer > 0) {
              lockTimer -= dt;
              if (lockTimer <= 0 && firstCard && secondCard) {
                cards[firstCard.y][firstCard.x].flipped = false;
                cards[secondCard.y][secondCard.x].flipped = false;
                firstCard = null;
                secondCard = null;
              }
            }
          },

          render(c, dt) {
            const grad = c.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, '#2a0a2e');
            grad.addColorStop(1, '#0a0510');
            c.fillStyle = grad;
            c.fillRect(0, 0, canvas.width, canvas.height);

            for (let y = 0; y < ROWS; y++) {
              for (let x = 0; x < COLS; x++) {
                const card = cards[y][x];
                const px = OFFX + x * TILE;
                const py = OFFY + y * TILE;
                const pad = TILE * 0.06;
                const s = card.scale;

                c.save();
                c.translate(px + TILE / 2, py + TILE / 2);
                c.scale(s, s);

                if (card.matched) {
                  c.globalAlpha = 0.5;
                  c.shadowColor = '#40ff80';
                  c.shadowBlur = 15;
                  c.fillStyle = '#1a3a2a';
                  c.fillRect(-TILE / 2 + pad, -TILE / 2 + pad, TILE - pad * 2, TILE - pad * 2);
                  c.globalAlpha = 1;
                  c.font = 'bold ' + (TILE * 0.5) + 'px "Segoe UI", sans-serif';
                  c.textAlign = 'center';
                  c.textBaseline = 'middle';
                  c.fillText(card.emoji, 0, 0);
                } else if (card.flipped) {
                  c.shadowColor = '#ff80c0';
                  c.shadowBlur = 15;
                  c.fillStyle = '#2a1a3a';
                  c.fillRect(-TILE / 2 + pad, -TILE / 2 + pad, TILE - pad * 2, TILE - pad * 2);
                  c.strokeStyle = '#ff80c0';
                  c.lineWidth = 2;
                  c.strokeRect(-TILE / 2 + pad, -TILE / 2 + pad, TILE - pad * 2, TILE - pad * 2);
                  c.font = 'bold ' + (TILE * 0.5) + 'px "Segoe UI", sans-serif';
                  c.textAlign = 'center';
                  c.textBaseline = 'middle';
                  c.fillText(card.emoji, 0, 0);
                } else {
                  c.shadowColor = '#c040ff';
                  c.shadowBlur = 12;
                  const g2 = c.createLinearGradient(-TILE / 2, -TILE / 2, TILE / 2, TILE / 2);
                  g2.addColorStop(0, '#3a2a5e');
                  g2.addColorStop(1, '#2a1a4e');
                  c.fillStyle = g2;
                  c.fillRect(-TILE / 2 + pad, -TILE / 2 + pad, TILE - pad * 2, TILE - pad * 2);
                  c.strokeStyle = '#c040ff';
                  c.lineWidth = 2;
                  c.strokeRect(-TILE / 2 + pad, -TILE / 2 + pad, TILE - pad * 2, TILE - pad * 2);
                  c.fillStyle = 'rgba(192, 64, 255, 0.4)';
                  c.font = 'bold ' + (TILE * 0.4) + 'px "Segoe UI", sans-serif';
                  c.textAlign = 'center';
                  c.textBaseline = 'middle';
                  c.fillText('?', 0, 0);
                }
                c.restore();
              }
            }

            c.fillStyle = '#ff80c0';
            c.font = 'bold 16px "Segoe UI", sans-serif';
            c.textAlign = 'left';
            c.fillText('Ходи: ' + moves, 14, 28);
            c.fillText('Пари: ' + matched + '/' + ((COLS * ROWS) / 2), 14, 50);
          },

          destroy() {
            if (this._clickHandler) {
              canvas.removeEventListener('touchstart', this._clickHandler);
              canvas.removeEventListener('mousedown', this._clickHandler);
              this._clickHandler = null;
            }
          }
        };
      };

      /* ======================================================================
         GAME 12: TIC-TAC-TOE AI
         ====================================================================== */
      GameFactory.tic_tac_toe = function(canvas, ctx) {
        const W = canvas.width;
        const H = canvas.height;
        const SIZE = Math.min(W, H - 80) * 0.85;
        const OFFX = (W - SIZE) / 2;
        const OFFY = 70 + (H - 80 - SIZE) / 2;
        const CELL = SIZE / 3;

        let board = ['', '', '', '', '', '', '', '', ''];
        let playerTurn = true;
        let gameOver = false;
        let winLine = null;
        let score = 0;
        let aiThinking = false;
        let winStreak = 0;

        const LINES = [
          [0,1,2], [3,4,5], [6,7,8],
          [0,3,6], [1,4,7], [2,5,8],
          [0,4,8], [2,4,6]
        ];

        function reset() {
          board = ['', '', '', '', '', '', '', '', ''];
          playerTurn = true;
          gameOver = false;
          winLine = null;
          score = 0;
          aiThinking = false;
          UI.hideGameOverlay();
          updateHUD();
        }

        function updateHUD() {
          UI.updateGameHUD('Tic-Tac-Toe AI', score, Storage.getHighScore('tic_tac_toe'));
        }

        function checkWinner(b) {
          for (const line of LINES) {
            const [a, c, d] = line;
            if (b[a] && b[a] === b[c] && b[a] === b[d]) {
              return { winner: b[a], line };
            }
          }
          if (b.every(v => v)) return { winner: 'draw', line: null };
          return null;
        }

        function minimax(b, depth, isMax) {
          const result = checkWinner(b);
          if (result) {
            if (result.winner === 'O') return 10 - depth;
            if (result.winner === 'X') return depth - 10;
            return 0;
          }

          if (isMax) {
            let best = -Infinity;
            for (let i = 0; i < 9; i++) {
              if (b[i] === '') {
                b[i] = 'O';
                best = Math.max(best, minimax(b, depth + 1, false));
                b[i] = '';
              }
            }
            return best;
          } else {
            let best = Infinity;
            for (let i = 0; i < 9; i++) {
              if (b[i] === '') {
                b[i] = 'X';
                best = Math.min(best, minimax(b, depth + 1, true));
                b[i] = '';
              }
            }
            return best;
          }
        }

        function aiMove() {
          let bestScore = -Infinity;
          let bestMove = -1;
          for (let i = 0; i < 9; i++) {
            if (board[i] === '') {
              board[i] = 'O';
              const s = minimax(board, 0, false);
              board[i] = '';
              if (s > bestScore) {
                bestScore = s;
                bestMove = i;
              }
            }
          }
          if (bestMove !== -1) {
            board[bestMove] = 'O';
            AudioEngine.tone(400, 0.1, 'square', 0.05);
          }
          playerTurn = true;
          aiThinking = false;
          checkEnd();
        }

        function checkEnd() {
          const r = checkWinner(board);
          if (r) {
            gameOver = true;
            winLine = r.line;
            if (r.winner === 'X') {
              winStreak++;
              score += 100 + winStreak * 50;
              Storage.setHighScore('tic_tac_toe', score);
              UI.updateGameHUD('Tic-Tac-Toe AI', score, Storage.getHighScore('tic_tac_toe'));
              UI.showGameOverlay(
                'ПЕРЕМОГА!',
                'Ти обіграв AI! Серія: ' + winStreak,
                'ГРАТИ ЗНОВУ',
                'Очки: <span>' + formatNumber(score) + '</span>'
              );
              AudioEngine.success();
            } else if (r.winner === 'O') {
              winStreak = 0;
              UI.showGameOverlay(
                'ПОРАЗКА',
                'AI переміг цього разу',
                'СПРОБУВАТИ ЗНОВУ',
                'Очки: <span>' + formatNumber(score) + '</span>'
              );
              AudioEngine.fail();
            } else {
              winStreak = 0;
              UI.showGameOverlay(
                'НІЧИЯ',
                'Ніхто не переміг',
                'СПРОБУВАТИ ЗНОВУ',
                'Очки: <span>' + formatNumber(score) + '</span>'
              );
              AudioEngine.tone(300, 0.2, 'sine', 0.08);
            }
          }
        }

        function playerMove(idx) {
          if (gameOver || !playerTurn || board[idx] !== '' || aiThinking) return;
          board[idx] = 'X';
          AudioEngine.coin();
          playerTurn = false;
          const r = checkWinner(board);
          if (r) {
            checkEnd();
          } else {
            aiThinking = true;
            setTimeout(() => {
              if (!gameOver) aiMove();
            }, 300);
          }
        }

        return {
          init() { reset(); },

          setupControls(container) {
            container.innerHTML = '';
            const bar = document.createElement('div');
            bar.style.cssText = 'display:flex;gap:10px;flex-wrap:wrap;justify-content:center;';

            const resetBtn = document.createElement('button');
            resetBtn.className = 'action-btn';
            resetBtn.style.cssText = 'width:auto;padding:10px 20px;border-radius:14px;font-size:13px;height:auto;min-height:54px;border-color:#ffcc00;color:#ffcc00;';
            resetBtn.textContent = '↻ НОВА ГРА';
            resetBtn.addEventListener('click', (e) => {
              e.preventDefault();
              reset();
              AudioEngine.click();
            });
            bar.appendChild(resetBtn);
            container.appendChild(bar);

            if (!this._clickHandler) {
              this._clickHandler = (e) => {
                e.preventDefault();
                const t = e.touches ? e.touches[0] : e;
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const cx = (t.clientX - rect.left) * scaleX;
                const cy = (t.clientY - rect.top) * scaleY;
                const gx = Math.floor((cx - OFFX) / CELL);
                const gy = Math.floor((cy - OFFY) / CELL);
                if (gx >= 0 && gx < 3 && gy >= 0 && gy < 3) {
                  playerMove(gy * 3 + gx);
                }
              };
              canvas.addEventListener('touchstart', this._clickHandler, { passive: false });
              canvas.addEventListener('mousedown', this._clickHandler);
            }
          },

          onOverlayAction() { reset(); },

          update(dt) {},

          render(c, dt) {
            const grad = c.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, '#0a1a2e');
            grad.addColorStop(1, '#050810');
            c.fillStyle = grad;
            c.fillRect(0, 0, canvas.width, canvas.height);

            c.fillStyle = 'rgba(0, 200, 255, 0.04)';
            c.fillRect(OFFX - 10, OFFY - 10, SIZE + 20, SIZE + 20);
            c.strokeStyle = 'rgba(0, 200, 255, 0.2)';
            c.lineWidth = 2;
            c.strokeRect(OFFX - 10, OFFY - 10, SIZE + 20, SIZE + 20);

            c.strokeStyle = 'rgba(0, 200, 255, 0.4)';
            c.lineWidth = 3;
            for (let i = 1; i < 3; i++) {
              c.beginPath();
              c.moveTo(OFFX + i * CELL, OFFY);
              c.lineTo(OFFX + i * CELL, OFFY + SIZE);
              c.stroke();
              c.beginPath();
              c.moveTo(OFFX, OFFY + i * CELL);
              c.lineTo(OFFX + SIZE, OFFY + i * CELL);
              c.stroke();
            }

            for (let i = 0; i < 9; i++) {
              const x = OFFX + (i % 3) * CELL + CELL / 2;
              const y = OFFY + Math.floor(i / 3) * CELL + CELL / 2;
              if (board[i] === 'X') {
                c.save();
                c.shadowColor = '#00f0ff';
                c.shadowBlur = 20;
                c.strokeStyle = '#00f0ff';
                c.lineWidth = 6;
                c.lineCap = 'round';
                const s = CELL * 0.3;
                c.beginPath();
                c.moveTo(x - s, y - s);
                c.lineTo(x + s, y + s);
                c.stroke();
                c.beginPath();
                c.moveTo(x + s, y - s);
                c.lineTo(x - s, y + s);
                c.stroke();
                c.restore();
              } else if (board[i] === 'O') {
                c.save();
                c.shadowColor = '#ff40a0';
                c.shadowBlur = 20;
                c.strokeStyle = '#ff40a0';
                c.lineWidth = 6;
                c.beginPath();
                c.arc(x, y, CELL * 0.3, 0, Math.PI * 2);
                c.stroke();
                c.restore();
              }
            }

            if (winLine) {
              c.save();
              c.shadowColor = '#40ff80';
              c.shadowBlur = 25;
              c.strokeStyle = '#40ff80';
              c.lineWidth = 8;
              c.lineCap = 'round';
              const a = winLine[0];
              const b = winLine[2];
              const x1 = OFFX + (a % 3) * CELL + CELL / 2;
              const y1 = OFFY + Math.floor(a / 3) * CELL + CELL / 2;
              const x2 = OFFX + (b % 3) * CELL + CELL / 2;
              const y2 = OFFY + Math.floor(b / 3) * CELL + CELL / 2;
              c.beginPath();
              c.moveTo(x1, y1);
              c.lineTo(x2, y2);
              c.stroke();
              c.restore();
            }

            c.fillStyle = '#00f0ff';
            c.font = 'bold 16px "Segoe UI", sans-serif';
            c.textAlign = 'left';
            c.fillText('Ти: X  |  AI: O', 14, 28);
            c.fillText('Серія перемог: ' + winStreak, 14, 50);

            if (!playerTurn && !gameOver) {
              c.fillStyle = 'rgba(255, 64, 160, 0.8)';
              c.font = 'bold 14px "Segoe UI", sans-serif';
              c.textAlign = 'center';
              c.fillText('AI думає...', canvas.width / 2, canvas.height - 20);
            }
          },

          destroy() {
            if (this._clickHandler) {
              canvas.removeEventListener('touchstart', this._clickHandler);
              canvas.removeEventListener('mousedown', this._clickHandler);
              this._clickHandler = null;
            }
          }
        };
      };

      /* ======================================================================
         GAME 13: COLOR SORT
         ====================================================================== */
      GameFactory.color_sort = function(canvas, ctx) {
        const W = canvas.width;
        const H = canvas.height;
        const TUBE_W = Math.min(70, W / 8);
        const TUBE_H = Math.min(220, H * 0.55);
        const TUBE_GAP = 16;
        const BALL_R = TUBE_W * 0.35;

        const COLORS = ['#ff4060', '#4080ff', '#40ff80', '#ffcc00', '#c040ff', '#ff8040', '#00f0ff'];

        let tubes = [];
        let selectedTube = null;
        let score = 0;
        let moves = 0;
        let gameOver = false;
        let particles = [];
        let win = false;
        let animatingBalls = [];

        function createTubes() {
          tubes = [];
          const numColors = 5;
          const usedColors = COLORS.slice(0, numColors);
          const allBalls = [];
          for (const c of usedColors) {
            for (let i = 0; i < 4; i++) allBalls.push(c);
          }
          for (let i = allBalls.length - 1; i > 0; i--) {
            const j = randInt(0, i);
            [allBalls[i], allBalls[j]] = [allBalls[j], allBalls[i]];
          }

          for (let i = 0; i < numColors; i++) {
            tubes.push({
              balls: allBalls.slice(i * 4, i * 4 + 4),
              x: 0, y: 0
            });
          }
          tubes.push({ balls: [], x: 0, y: 0 });
          tubes.push({ balls: [], x: 0, y: 0 });

          for (let i = tubes.length - 1; i > 0; i--) {
            const j = randInt(0, i);
            [tubes[i], tubes[j]] = [tubes[j], tubes[i]];
          }
        }

        function layoutTubes() {
          const totalW = tubes.length * TUBE_W + (tubes.length - 1) * TUBE_GAP;
          const startX = (W - totalW) / 2;
          const baseY = H * 0.72;
          for (let i = 0; i < tubes.length; i++) {
            tubes[i].x = startX + i * (TUBE_W + TUBE_GAP);
            tubes[i].y = baseY - TUBE_H;
          }
        }

        function reset() {
          createTubes();
          layoutTubes();
          selectedTube = null;
          score = 0;
          moves = 0;
          gameOver = false;
          win = false;
          particles = [];
          animatingBalls = [];
          UI.hideGameOverlay();
          updateHUD();
        }

        function updateHUD() {
          UI.updateGameHUD('Color Sort', score, Storage.getHighScore('color_sort'));
        }

        function isSolved() {
          for (const t of tubes) {
            if (t.balls.length === 0) continue;
            if (t.balls.length !== 4) return false;
            if (!t.balls.every(b => b === t.balls[0])) return false;
          }
          return true;
        }

        function endGame() {
          if (gameOver || win) return;
          win = true;
          score = Math.max(0, 2000 - moves * 15);
          Storage.setHighScore('color_sort', score);
          UI.updateGameHUD('Color Sort', score, Storage.getHighScore('color_sort'));
          UI.showGameOverlay(
            'ПЕРЕМОГА!',
            'Ти відсортував усі рідини за ' + moves + ' ходів!',
            'ГРАТИ ЗНОВУ',
            'Очки: <span>' + formatNumber(score) + '</span>'
          );
          AudioEngine.success();
        }

        function pour(fromIdx, toIdx) {
          const from = tubes[fromIdx];
          const to = tubes[toIdx];
          if (from.balls.length === 0) return false;
          if (to.balls.length >= 4) return false;
          const color = from.balls[from.balls.length - 1];
          if (to.balls.length > 0 && to.balls[to.balls.length - 1] !== color) return false;

          let count = 0;
          for (let i = from.balls.length - 1; i >= 0; i--) {
            if (from.balls[i] === color) count++;
            else break;
          }
          count = Math.min(count, 4 - to.balls.length);

          for (let i = 0; i < count; i++) {
            from.balls.pop();
            to.balls.push(color);
          }
          moves++;
          AudioEngine.tone(500, 0.1, 'sine', 0.06);

          for (let i = 0; i < 6; i++) {
            particles.push({
              x: to.x + TUBE_W / 2 + rand(-10, 10),
              y: to.y + TUBE_H - 30,
              vx: rand(-50, 50), vy: rand(-100, -20),
              life: 0.4, maxLife: 0.4,
              color, size: 3
            });
          }

          return true;
        }

        return {
          init() { reset(); },

          setupControls(container) {
            container.innerHTML = '';
            const bar = document.createElement('div');
            bar.style.cssText = 'display:flex;gap:10px;flex-wrap:wrap;justify-content:center;';

            const resetBtn = document.createElement('button');
            resetBtn.className = 'action-btn';
            resetBtn.style.cssText = 'width:auto;padding:10px 20px;border-radius:14px;font-size:13px;height:auto;min-height:54px;border-color:#ffcc00;color:#ffcc00;';
            resetBtn.textContent = '↻ НОВА ГРА';
            resetBtn.addEventListener('click', (e) => {
              e.preventDefault();
              reset();
              AudioEngine.click();
            });
            bar.appendChild(resetBtn);
            container.appendChild(bar);

            if (!this._clickHandler) {
              this._clickHandler = (e) => {
                e.preventDefault();
                if (win) return;
                const t = e.touches ? e.touches[0] : e;
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const cx = (t.clientX - rect.left) * scaleX;
                const cy = (t.clientY - rect.top) * scaleY;

                for (let i = 0; i < tubes.length; i++) {
                  const tb = tubes[i];
                  if (cx >= tb.x && cx <= tb.x + TUBE_W && cy >= tb.y && cy <= tb.y + TUBE_H) {
                    if (selectedTube === null) {
                      if (tb.balls.length > 0) {
                        selectedTube = i;
                        AudioEngine.click();
                      }
                    } else if (selectedTube === i) {
                      selectedTube = null;
                    } else {
                      const success = pour(selectedTube, i);
                      if (success) {
                        score += 50;
                        updateHUD();
                      } else {
                        AudioEngine.fail();
                      }
                      selectedTube = null;
                      if (isSolved()) {
                        setTimeout(() => endGame(), 300);
                      }
                    }
                    return;
                  }
                }
                selectedTube = null;
              };
              canvas.addEventListener('touchstart', this._clickHandler, { passive: false });
              canvas.addEventListener('mousedown', this._clickHandler);
            }
          },

          onOverlayAction() { reset(); },

          update(dt) {
            for (let i = particles.length - 1; i >= 0; i--) {
              const p = particles[i];
              p.x += p.vx * dt;
              p.y += p.vy * dt;
              p.vy += 300 * dt;
              p.life -= dt;
              if (p.life <= 0) particles.splice(i, 1);
            }
          },

          render(c, dt) {
            const grad = c.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, '#1a0a1e');
            grad.addColorStop(1, '#0a0510');
            c.fillStyle = grad;
            c.fillRect(0, 0, canvas.width, canvas.height);

            c.fillStyle = 'rgba(255, 60, 100, 0.04)';
            c.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < tubes.length; i++) {
              const tb = tubes[i];
              const selected = selectedTube === i;

              c.save();
              c.shadowColor = selected ? '#ffcc00' : 'rgba(0, 200, 255, 0.3)';
              c.shadowBlur = selected ? 25 : 10;

              c.fillStyle = 'rgba(15, 20, 35, 0.9)';
              c.beginPath();
              c.moveTo(tb.x, tb.y + 10);
              c.lineTo(tb.x, tb.y + TUBE_H - 15);
              c.quadraticCurveTo(tb.x, tb.y + TUBE_H, tb.x + 15, tb.y + TUBE_H);
              c.lineTo(tb.x + TUBE_W - 15, tb.y + TUBE_H);
              c.quadraticCurveTo(tb.x + TUBE_W, tb.y + TUBE_H, tb.x + TUBE_W, tb.y + TUBE_H - 15);
              c.lineTo(tb.x + TUBE_W, tb.y + 10);
              c.closePath();
              c.fill();

              c.strokeStyle = selected ? '#ffcc00' : 'rgba(0, 200, 255, 0.5)';
              c.lineWidth = selected ? 3 : 2;
              c.stroke();

              c.restore();

              for (let j = 0; j < tb.balls.length; j++) {
                const ballY = tb.y + TUBE_H - 12 - j * (BALL_R * 2 + 2);
                const ballX = tb.x + TUBE_W / 2;
                c.save();
                c.shadowColor = tb.balls[j];
                c.shadowBlur = 12;
                c.beginPath();
                c.arc(ballX, ballY, BALL_R, 0, Math.PI * 2);
                const bg = c.createRadialGradient(ballX - BALL_R * 0.3, ballY - BALL_R * 0.3, 1, ballX, ballY, BALL_R);
                bg.addColorStop(0, '#ffffff');
                bg.addColorStop(0.4, tb.balls[j]);
                bg.addColorStop(1, tb.balls[j]);
                c.fillStyle = bg;
                c.fill();
                c.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                c.lineWidth = 1;
                c.stroke();
                c.restore();
              }

              if (selected) {
                c.fillStyle = '#ffcc00';
                c.font = 'bold 14px "Segoe UI", sans-serif';
                c.textAlign = 'center';
                c.fillText('▲', tb.x + TUBE_W / 2, tb.y - 8);
              }
            }

            for (const p of particles) {
              const alpha = p.life / p.maxLife;
              c.globalAlpha = alpha;
              c.fillStyle = p.color;
              c.beginPath();
              c.arc(p.x, p.y, p.size, 0, Math.PI * 2);
              c.fill();
            }
            c.globalAlpha = 1;

            c.fillStyle = '#ff4060';
            c.font = 'bold 16px "Segoe UI", sans-serif';
            c.textAlign = 'left';
            c.fillText('Ходи: ' + moves, 14, 28);
            c.fillText('Очки: ' + score, 14, 50);
          },

          destroy() {
            if (this._clickHandler) {
              canvas.removeEventListener('touchstart', this._clickHandler);
              canvas.removeEventListener('mousedown', this._clickHandler);
              this._clickHandler = null;
            }
          }
        };
      };

      /* ======================================================================
         GAME 14: PONG / AIR HOCKEY
         ====================================================================== */
      GameFactory.pong = function(canvas, ctx) {
        const W = canvas.width;
        const H = canvas.height;
        const PADDLE_W = 16;
        const PADDLE_H = 90;
        const BALL_R = 10;

        let playerPaddle = { x: 20, y: H / 2 - PADDLE_H / 2, w: PADDLE_W, h: PADDLE_H, vy: 0 };
        let aiPaddle = { x: W - 36, y: H / 2 - PADDLE_H / 2, w: PADDLE_W, h: PADDLE_H, vy: 0 };
        let ball = { x: W / 2, y: H / 2, vx: 320, vy: 180, r: BALL_R };
        let playerScore = 0;
        let aiScore = 0;
        let gameOver = false;
        let win = false;
        let particles = [];
        let keys = {};
        let touchY = null;
        let trail = [];

        function resetBall(dir) {
          ball.x = W / 2;
          ball.y = H / 2;
          ball.vx = 320 * (dir || 1);
          ball.vy = rand(-180, 180);
          trail = [];
        }

        function reset() {
          playerPaddle = { x: 20, y: H / 2 - PADDLE_H / 2, w: PADDLE_W, h: PADDLE_H, vy: 0 };
          aiPaddle = { x: W - 36, y: H / 2 - PADDLE_H / 2, w: PADDLE_W, h: PADDLE_H, vy: 0 };
          playerScore = 0;
          aiScore = 0;
          gameOver = false;
          win = false;
          particles = [];
          trail = [];
          resetBall(1);
          UI.hideGameOverlay();
          updateHUD();
        }

        function updateHUD() {
          UI.updateGameHUD('Pong / Air Hockey', playerScore * 100, Storage.getHighScore('pong'));
        }

        function endGame(isWin) {
          if (gameOver || win) return;
          gameOver = !isWin;
          win = isWin;
          const finalScore = playerScore * 100 - aiScore * 50;
          Storage.setHighScore('pong', Math.max(0, finalScore));
          UI.updateGameHUD('Pong', Math.max(0, finalScore), Storage.getHighScore('pong'));
          UI.showGameOverlay(
            isWin ? 'ПЕРЕМОГА!' : 'ПОРАЗКА',
            isWin ? 'Ти обіграв бота з рахунком ' + playerScore + ':' + aiScore : 'Бот переміг з рахунком ' + aiScore + ':' + playerScore,
            'ГРАТИ ЗНОВУ',
            'Очки: <span>' + formatNumber(Math.max(0, finalScore)) + '</span>'
          );
          if (isWin) AudioEngine.success(); else AudioEngine.fail();
        }

        return {
          init() { reset(); },

          setupControls(container) {
            container.innerHTML = '';
            const dpad = document.createElement('div');
            dpad.className = 'dpad';
            const dirs = [null, 'up', null, null, null, null, null, 'down', null];
            for (const d of dirs) {
              const btn = document.createElement('div');
              if (d === null) { btn.className = 'dpad-btn empty'; }
              else {
                btn.className = 'dpad-btn';
                btn.textContent = d === 'up' ? '▲' : '▼';
                const setDir = () => {
                  if (d === 'up') playerPaddle.vy = -1;
                  else playerPaddle.vy = 1;
                };
                const clearDir = () => { playerPaddle.vy = 0; };
                btn.addEventListener('touchstart', (e) => { e.preventDefault(); setDir(); btn.classList.add('active'); }, { passive: false });
                btn.addEventListener('touchend', (e) => { e.preventDefault(); clearDir(); btn.classList.remove('active'); }, { passive: false });
                btn.addEventListener('mousedown', (e) => { e.preventDefault(); setDir(); btn.classList.add('active'); });
                btn.addEventListener('mouseup', () => { clearDir(); btn.classList.remove('active'); });
                btn.addEventListener('mouseleave', () => { clearDir(); btn.classList.remove('active'); });
              }
              dpad.appendChild(btn);
            }
            container.appendChild(dpad);

            if (!this._keyHandler) {
              this._keyHandler = (e) => {
                if (['ArrowUp', 'ArrowDown', 'KeyW', 'KeyS'].includes(e.code)) {
                  e.preventDefault();
                }
                keys[e.code] = true;
              };
              this._keyUpHandler = (e) => { keys[e.code] = false; };
              document.addEventListener('keydown', this._keyHandler);
              document.addEventListener('keyup', this._keyUpHandler);

              this._touchHandler = (e) => {
                e.preventDefault();
                const t = e.touches ? e.touches[0] : e;
                const rect = canvas.getBoundingClientRect();
                const scaleY = canvas.height / rect.height;
                touchY = (t.clientY - rect.top) * scaleY;
              };
              canvas.addEventListener('touchstart', this._touchHandler, { passive: false });
              canvas.addEventListener('touchmove', this._touchHandler, { passive: false });
              canvas.addEventListener('mousedown', this._touchHandler);
              canvas.addEventListener('mousemove', (e) => {
                if (e.buttons) {
                  const rect = canvas.getBoundingClientRect();
                  const scaleY = canvas.height / rect.height;
                  touchY = (e.clientY - rect.top) * scaleY;
                }
              });
              canvas.addEventListener('mouseup', () => { touchY = null; });
            }
          },

          onOverlayAction() { reset(); },

          update(dt) {
            if (gameOver || win) return;

            if (keys['ArrowUp'] || keys['KeyW']) playerPaddle.vy = -1;
            else if (keys['ArrowDown'] || keys['KeyS']) playerPaddle.vy = 1;
            else if (playerPaddle.vy !== 0 && !touchY) playerPaddle.vy = 0;

            if (touchY !== null) {
              const target = touchY - playerPaddle.h / 2;
              playerPaddle.y = lerp(playerPaddle.y, target, dt * 18);
            } else if (playerPaddle.vy !== 0) {
              playerPaddle.y += playerPaddle.vy * 520 * dt;
            }
            playerPaddle.y = clamp(playerPaddle.y, 0, H - playerPaddle.h);

            const aiSpeed = 380;
            const aiTarget = ball.y - aiPaddle.h / 2;
            if (Math.abs(aiPaddle.y - aiTarget) > 8) {
              aiPaddle.y += Math.sign(aiTarget - aiPaddle.y) * aiSpeed * dt;
            }
            aiPaddle.y = clamp(aiPaddle.y, 0, H - aiPaddle.h);

            trail.push({ x: ball.x, y: ball.y, life: 0.3 });
            if (trail.length > 15) trail.shift();
            for (let i = trail.length - 1; i >= 0; i--) {
              trail[i].life -= dt;
              if (trail[i].life <= 0) trail.splice(i, 1);
            }

            ball.x += ball.vx * dt;
            ball.y += ball.vy * dt;

            if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); AudioEngine.tone(400, 0.05, 'square', 0.04); }
            if (ball.y + ball.r > H) { ball.y = H - ball.r; ball.vy = -Math.abs(ball.vy); AudioEngine.tone(400, 0.05, 'square', 0.04); }

            if (ball.x - ball.r < playerPaddle.x + playerPaddle.w &&
                ball.x + ball.r > playerPaddle.x &&
                ball.y + ball.r > playerPaddle.y &&
                ball.y - ball.r < playerPaddle.y + playerPaddle.h) {
              if (ball.vx < 0) {
                ball.x = playerPaddle.x + playerPaddle.w + ball.r;
                const hitPos = (ball.y - playerPaddle.y) / playerPaddle.h - 0.5;
                const speed = Math.hypot(ball.vx, ball.vy) * 1.05;
                const angle = hitPos * Math.PI * 0.5;
                ball.vx = Math.abs(Math.cos(angle) * speed);
                ball.vy = Math.sin(angle) * speed;
                AudioEngine.tone(600, 0.06, 'square', 0.05);
                for (let i = 0; i < 6; i++) {
                  particles.push({
                    x: ball.x, y: ball.y,
                    vx: rand(-100, 100), vy: rand(-100, 100),
                    life: 0.4, maxLife: 0.4,
                    color: '#00f0ff', size: 3
                  });
                }
              }
            }

            if (ball.x + ball.r > aiPaddle.x &&
                ball.x - ball.r < aiPaddle.x + aiPaddle.w &&
                ball.y + ball.r > aiPaddle.y &&
                ball.y - ball.r < aiPaddle.y + aiPaddle.h) {
              if (ball.vx > 0) {
                ball.x = aiPaddle.x - ball.r;
                const hitPos = (ball.y - aiPaddle.y) / aiPaddle.h - 0.5;
                const speed = Math.hypot(ball.vx, ball.vy) * 1.05;
                const angle = hitPos * Math.PI * 0.5;
                ball.vx = -Math.abs(Math.cos(angle) * speed);
                ball.vy = Math.sin(angle) * speed;
                AudioEngine.tone(500, 0.06, 'square', 0.05);
                for (let i = 0; i < 6; i++) {
                  particles.push({
                    x: ball.x, y: ball.y,
                    vx: rand(-100, 100), vy: rand(-100, 100),
                    life: 0.4, maxLife: 0.4,
                    color: '#ff40a0', size: 3
                  });
                }
              }
            }

            if (ball.x + ball.r < 0) {
              aiScore++;
              updateHUD();
              AudioEngine.hit();
              if (aiScore >= 5) { endGame(false); return; }
              resetBall(1);
            }
            if (ball.x - ball.r > W) {
              playerScore++;
              updateHUD();
              AudioEngine.coin();
              if (playerScore >= 5) { endGame(true); return; }
              resetBall(-1);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
              const p = particles[i];
              p.x += p.vx * dt;
              p.y += p.vy * dt;
              p.vx *= 0.96;
              p.vy *= 0.96;
              p.life -= dt;
              if (p.life <= 0) particles.splice(i, 1);
            }
          },

          render(c, dt) {
            const grad = c.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, '#0a1a2e');
            grad.addColorStop(1, '#050810');
            c.fillStyle = grad;
            c.fillRect(0, 0, W, H);

            c.strokeStyle = 'rgba(0, 200, 255, 0.15)';
            c.lineWidth = 2;
            c.setLineDash([10, 15]);
            c.beginPath();
            c.moveTo(W / 2, 0);
            c.lineTo(W / 2, H);
            c.stroke();
            c.setLineDash([]);

            c.strokeStyle = 'rgba(0, 200, 255, 0.3)';
            c.lineWidth = 2;
            c.beginPath();
            c.arc(W / 2, H / 2, 60, 0, Math.PI * 2);
            c.stroke();

            for (let i = 0; i < trail.length; i++) {
              const t = trail[i];
              const alpha = t.life / 0.3;
              c.globalAlpha = alpha * 0.4;
              c.fillStyle = '#00f0ff';
              c.beginPath();
              c.arc(t.x, t.y, ball.r * (0.5 + alpha * 0.5), 0, Math.PI * 2);
              c.fill();
            }
            c.globalAlpha = 1;

            c.save();
            c.shadowColor = '#00f0ff';
            c.shadowBlur = 20;
            const pg = c.createLinearGradient(playerPaddle.x, 0, playerPaddle.x + playerPaddle.w, 0);
            pg.addColorStop(0, '#0080ff');
            pg.addColorStop(1, '#00f0ff');
            c.fillStyle = pg;
            c.fillRect(playerPaddle.x, playerPaddle.y, playerPaddle.w, playerPaddle.h);
            c.strokeStyle = '#ffffff';
            c.lineWidth = 2;
            c.strokeRect(playerPaddle.x, playerPaddle.y, playerPaddle.w, playerPaddle.h);
            c.restore();

            c.save();
            c.shadowColor = '#ff40a0';
            c.shadowBlur = 20;
            const ag = c.createLinearGradient(aiPaddle.x, 0, aiPaddle.x + aiPaddle.w, 0);
            ag.addColorStop(0, '#ff40a0');
            ag.addColorStop(1, '#a020ff');
            c.fillStyle = ag;
            c.fillRect(aiPaddle.x, aiPaddle.y, aiPaddle.w, aiPaddle.h);
            c.strokeStyle = '#ffffff';
            c.lineWidth = 2;
            c.strokeRect(aiPaddle.x, aiPaddle.y, aiPaddle.w, aiPaddle.h);
            c.restore();

            c.save();
            c.shadowColor = '#ffffff';
            c.shadowBlur = 25;
            c.beginPath();
            c.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
            const bg = c.createRadialGradient(ball.x - 3, ball.y - 3, 1, ball.x, ball.y, ball.r);
            bg.addColorStop(0, '#ffffff');
            bg.addColorStop(0.7, '#00f0ff');
            bg.addColorStop(1, '#0080ff');
            c.fillStyle = bg;
            c.fill();
            c.restore();

            for (const p of particles) {
              const alpha = p.life / p.maxLife;
              c.globalAlpha = alpha;
              c.fillStyle = p.color;
              c.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
            }
            c.globalAlpha = 1;

            c.fillStyle = '#00f0ff';
            c.font = 'bold 36px "Segoe UI", sans-serif';
            c.textAlign = 'center';
            c.fillText(playerScore, W / 4, 60);
            c.fillStyle = '#ff40a0';
            c.fillText(aiScore, W * 3 / 4, 60);
          },

          destroy() {
            if (this._keyHandler) {
              document.removeEventListener('keydown', this._keyHandler);
              document.removeEventListener('keyup', this._keyUpHandler);
              this._keyHandler = null;
              this._keyUpHandler = null;
            }
            if (this._touchHandler) {
              canvas.removeEventListener('touchstart', this._touchHandler);
              canvas.removeEventListener('touchmove', this._touchHandler);
              canvas.removeEventListener('mousedown', this._touchHandler);
              this._touchHandler = null;
            }
          }
        };
      };

      /* ======================================================================
         GAME 15: FRUIT SLICE
         ====================================================================== */
      GameFactory.fruit_slice = function(canvas, ctx) {
        const W = canvas.width;
        const H = canvas.height;

        const FRUITS = [
          { emoji: '🍎', color: '#ff4060', points: 10 },
          { emoji: '🍌', color: '#ffcc00', points: 10 },
          { emoji: '🍇', color: '#c040ff', points: 15 },
          { emoji: '🍓', color: '#ff4060', points: 10 },
          { emoji: '🍊', color: '#ff8040', points: 10 },
          { emoji: '🍉', color: '#40ff80', points: 15 },
          { emoji: '🥝', color: '#80ff40', points: 15 },
          { emoji: '🍍', color: '#ffcc00', points: 20 }
        ];

        let fruits = [];
        let particles = [];
        let score = 0;
        let lives = 3;
        let gameOver = false;
        let spawnTimer = 0;
        let time = 0;
        let mouseDown = false;
        let lastMouse = { x: 0, y: 0 };
        let sliceTrail = [];

        function reset() {
          fruits = [];
          particles = [];
          score = 0;
          lives = 3;
          gameOver = false;
          spawnTimer = 0.5;
          time = 0;
          sliceTrail = [];
          UI.hideGameOverlay();
          updateHUD();
        }

        function updateHUD() {
          UI.updateGameHUD('Fruit Slice', score, Storage.getHighScore('fruit_slice'));
        }

        function endGame() {
          if (gameOver) return;
          gameOver = true;
          Storage.setHighScore('fruit_slice', score);
          UI.updateGameHUD('Fruit Slice', score, Storage.getHighScore('fruit_slice'));
          UI.showGameOverlay(
            'ГРУ ЗАВЕРШЕНО',
            'Ти промахнувся 3 рази!',
            'СПРОБУВАТИ ЗНОВУ',
            'Очки: <span>' + formatNumber(score) + '</span>'
          );
          AudioEngine.fail();
        }

        function spawnFruit() {
          const f = FRUITS[randInt(0, FRUITS.length - 1)];
          const x = rand(50, W - 50);
          const vy = -rand(500, 700);
          const vx = rand(-100, 100);
          fruits.push({
            x, y: H + 30,
            vx, vy,
            r: 30,
            emoji: f.emoji,
            color: f.color,
            points: f.points,
            sliced: false,
            rotation: 0,
            rotSpeed: rand(-5, 5)
          });
        }

        function sliceFruit(f) {
          if (f.sliced) return;
          f.sliced = true;
          score += f.points;
          updateHUD();
          AudioEngine.coin();
          for (let i = 0; i < 15; i++) {
            particles.push({
              x: f.x, y: f.y,
              vx: rand(-250, 250), vy: rand(-250, 250),
              life: 0.6, maxLife: 0.6,
              color: f.color, size: rand(3, 8)
            });
          }
        }

        function getPos(e) {
          const rect = canvas.getBoundingClientRect();
          const scaleX = canvas.width / rect.width;
          const scaleY = canvas.height / rect.height;
          const t = e.touches ? e.touches[0] : e;
          return {
            x: (t.clientX - rect.left) * scaleX,
            y: (t.clientY - rect.top) * scaleY
          };
        }

        function checkSlice(x1, y1, x2, y2) {
          const dx = x2 - x1;
          const dy = y2 - y1;
          const len = Math.hypot(dx, dy);
          if (len < 5) return;
          for (const f of fruits) {
            if (f.sliced) continue;
            const t = clamp(((f.x - x1) * dx + (f.y - y1) * dy) / (len * len), 0, 1);
            const px = x1 + dx * t;
            const py = y1 + dy * t;
            if (dist(px, py, f.x, f.y) < f.r + 5) {
              sliceFruit(f);
            }
          }
        }

        return {
          init() { reset(); },

          setupControls(container) {
            container.innerHTML = '';
            const bar = document.createElement('div');
            bar.style.cssText = 'display:flex;gap:10px;flex-wrap:wrap;justify-content:center;';

            const resetBtn = document.createElement('button');
            resetBtn.className = 'action-btn';
            resetBtn.style.cssText = 'width:auto;padding:10px 20px;border-radius:14px;font-size:13px;height:auto;min-height:54px;border-color:#ffcc00;color:#ffcc00;';
            resetBtn.textContent = '↻ НОВА ГРА';
            resetBtn.addEventListener('click', (e) => {
              e.preventDefault();
              reset();
              AudioEngine.click();
            });
            bar.appendChild(resetBtn);
            container.appendChild(bar);

            if (!this._handlers) {
              const onStart = (e) => {
                e.preventDefault();
                const p = getPos(e);
                mouseDown = true;
                lastMouse = p;
                sliceTrail = [{ x: p.x, y: p.y, life: 0.3 }];
              };
              const onMove = (e) => {
                e.preventDefault();
                const p = getPos(e);
                if (mouseDown) {
                  checkSlice(lastMouse.x, lastMouse.y, p.x, p.y);
                  lastMouse = p;
                  sliceTrail.push({ x: p.x, y: p.y, life: 0.3 });
                  if (sliceTrail.length > 20) sliceTrail.shift();
                }
              };
              const onEnd = () => {
                mouseDown = false;
              };
              canvas.addEventListener('touchstart', onStart, { passive: false });
              canvas.addEventListener('touchmove', onMove, { passive: false });
              canvas.addEventListener('touchend', onEnd);
              canvas.addEventListener('mousedown', onStart);
              canvas.addEventListener('mousemove', onMove);
              canvas.addEventListener('mouseup', onEnd);
              this._handlers = { onStart, onMove, onEnd };
            }
          },

          onOverlayAction() { reset(); },

          update(dt) {
            if (gameOver) return;

            time += dt;
            spawnTimer -= dt;
            if (spawnTimer <= 0) {
              spawnFruit();
              spawnTimer = Math.max(0.3, 0.9 - time * 0.01);
            }

            for (let i = fruits.length - 1; i >= 0; i--) {
              const f = fruits[i];
              f.x += f.vx * dt;
              f.y += f.vy * dt;
              f.vy += 900 * dt;
              f.rotation += f.rotSpeed * dt;

              if (f.x < f.r || f.x > W - f.r) f.vx *= -1;

              if (f.y > H + 60) {
                if (!f.sliced) {
                  lives--;
                  AudioEngine.hit();
                  if (lives <= 0) {
                    endGame();
                    return;
                  }
                }
                fruits.splice(i, 1);
              }
            }

            for (let i = sliceTrail.length - 1; i >= 0; i--) {
              sliceTrail[i].life -= dt;
              if (sliceTrail[i].life <= 0) sliceTrail.splice(i, 1);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
              const p = particles[i];
              p.x += p.vx * dt;
              p.y += p.vy * dt;
              p.vy += 600 * dt;
              p.life -= dt;
              if (p.life <= 0) particles.splice(i, 1);
            }
          },

          render(c, dt) {
            const grad = c.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, '#1a0510');
            grad.addColorStop(0.5, '#0a0210');
            grad.addColorStop(1, '#050108');
            c.fillStyle = grad;
            c.fillRect(0, 0, W, H);

            c.fillStyle = 'rgba(255, 64, 96, 0.03)';
            for (let i = 0; i < 6; i++) {
              c.beginPath();
              c.arc(W * 0.2 + i * 120, H * 0.3 + (i % 2) * 200, 80, 0, Math.PI * 2);
              c.fill();
            }

            for (const f of fruits) {
              if (f.sliced) continue;
              c.save();
              c.translate(f.x, f.y);
              c.rotate(f.rotation);
              c.shadowColor = f.color;
              c.shadowBlur = 20;
              c.font = (f.r * 2) + 'px "Segoe UI", sans-serif';
              c.textAlign = 'center';
              c.textBaseline = 'middle';
              c.fillText(f.emoji, 0, 0);
              c.restore();
            }

            for (const p of particles) {
              const alpha = p.life / p.maxLife;
              c.globalAlpha = alpha;
              c.fillStyle = p.color;
              c.beginPath();
              c.arc(p.x, p.y, p.size, 0, Math.PI * 2);
              c.fill();
            }
            c.globalAlpha = 1;

            if (sliceTrail.length > 1) {
              c.save();
              c.shadowColor = '#ffffff';
              c.shadowBlur = 20;
              c.strokeStyle = '#ffffff';
              c.lineWidth = 4;
              c.lineCap = 'round';
              c.lineJoin = 'round';
              c.beginPath();
              c.moveTo(sliceTrail[0].x, sliceTrail[0].y);
              for (let i = 1; i < sliceTrail.length; i++) {
                const alpha = sliceTrail[i].life / 0.3;
                c.globalAlpha = alpha;
                c.lineTo(sliceTrail[i].x, sliceTrail[i].y);
              }
              c.stroke();
              c.restore();
              c.globalAlpha = 1;
            }

            c.fillStyle = '#ff4060';
            c.font = 'bold 16px "Segoe UI", sans-serif';
            c.textAlign = 'left';
            c.fillText('❤ ' + lives, 14, 28);
            c.fillText('Очки: ' + score, 14, 50);

            if (gameOver) {
              c.fillStyle = 'rgba(255, 64, 96, 0.15)';
              c.fillRect(0, 0, W, H);
            }
          },

          destroy() {
            if (this._handlers) {
              canvas.removeEventListener('touchstart', this._handlers.onStart);
              canvas.removeEventListener('touchmove', this._handlers.onMove);
              canvas.removeEventListener('touchend', this._handlers.onEnd);
              canvas.removeEventListener('mousedown', this._handlers.onStart);
              canvas.removeEventListener('mousemove', this._handlers.onMove);
              canvas.removeEventListener('mouseup', this._handlers.onEnd);
              this._handlers = null;
            }
          }
        };
      };

      /* ======================================================================
         SERVICE WORKER (PWA)
         ====================================================================== */
      function registerServiceWorker() {
        if (!('serviceWorker' in navigator)) return;

        const swCode = [
          'const CACHE_NAME = "neon-arcade-hub-v1";',
          'const ASSETS = ["/", "/index.html"];',
          'self.addEventListener("install", (event) => {',
          '  event.waitUntil(',
          '    caches.open(CACHE_NAME).then((cache) => {',
          '      return cache.addAll(ASSETS);',
          '    })',
          '  );',
          '  self.skipWaiting();',
          '});',
          'self.addEventListener("activate", (event) => {',
          '  event.waitUntil(',
          '    caches.keys().then((keys) => {',
          '      return Promise.all(',
          '        keys.filter((key) => key !== CACHE_NAME).map((key) => caches.delete(key))',
          '      );',
          '    })',
          '  );',
          '  self.clients.claim();',
          '});',
          'self.addEventListener("fetch", (event) => {',
          '  event.respondWith(',
          '    caches.match(event.request).then((response) => {',
          '      return response || fetch(event.request);',
          '    })',
          '  );',
          '});'
        ].join('\n');

        try {
          const blob = new Blob([swCode], { type: 'application/javascript' });
          const url = URL.createObjectURL(blob);
          navigator.serviceWorker.register(url).then(() => {
            console.log('Service Worker зареєстровано успішно');
          }).catch((err) => {
            console.log('Помилка реєстрації Service Worker:', err);
          });
        } catch (e) {
          console.log('Service Worker не підтримується:', e);
        }
      }

      /* ======================================================================
         INITIALIZATION
         ====================================================================== */
      function init() {
        AudioEngine.init();

        UI.init();

        registerServiceWorker();

        window.addEventListener('resize', () => {
          if (GameManager.current) {
            GameManager.resize();
          }
        });

        window.addEventListener('orientationchange', () => {
          setTimeout(() => {
            if (GameManager.current) GameManager.resize();
          }, 200);
        });

        document.addEventListener('keydown', (e) => {
          if (e.code === 'Escape' && UI.currentScreen === 'game') {
            UI.exitToHub();
          }
        });

        setTimeout(() => {
          const loading = document.getElementById('loadingScreen');
          loading.classList.add('hidden');
          setTimeout(() => {
            loading.style.display = 'none';
          }, 500);
        }, 600);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
