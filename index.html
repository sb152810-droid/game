                type: placingTower,
                gx: g.x,
                gy: g.y
              };
              towers.push(tower);
              grid[g.y][g.x].tower = tower;
              AudioEngine.powerup();
            } else {
              AudioEngine.fail();
            }
            placingTower = null;
            updateHUD();
            return;
          }

          const t = grid[g.y][g.x].tower;
          if (t) {
            selectedTower = t;
          } else {
            selectedTower = null;
          }
        }

        return {
          init() {
            reset();
          },

          setupControls(container) {
            container.innerHTML = '';
            const bar = document.createElement('div');
            bar.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;';

            for (const key in TOWER_TYPES) {
              const t = TOWER_TYPES[key];
              const btn = document.createElement('button');
              btn.className = 'action-btn';
              btn.style.cssText = 'width:auto;padding:8px 14px;border-radius:14px;font-size:12px;flex-direction:column;gap:2px;height:auto;min-height:54px;';
              btn.innerHTML = '<span style="font-size:16px;">' + (key === 'basic' ? '🏹' : key === 'sniper' ? '🎯' : '⚡') + '</span><span>' + t.name + '</span><span style="color:#ffcc00;font-size:10px;">💰' + t.cost + '</span>';
              btn.addEventListener('click', (e) => {
                e.preventDefault();
                AudioEngine.click();
                placingTower = key;
                UI.showToast('Обери місце для ' + t.name, 1200);
              });
              btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                AudioEngine.click();
                placingTower = key;
                UI.showToast('Обери місце для ' + t.name, 1200);
              }, { passive: false });
              bar.appendChild(btn);
            }

            const waveBtn = document.createElement('button');
            waveBtn.className = 'action-btn';
            waveBtn.style.cssText = 'width:auto;padding:8px 18px;border-radius:14px;font-size:13px;height:auto;min-height:54px;border-color:#ffcc00;color:#ffcc00;';
            waveBtn.textContent = '▶ ХВИЛЯ';
            waveBtn.addEventListener('click', (e) => {
              e.preventDefault();
              if (!waveActive) {
                AudioEngine.click();
                waveActive = true;
                spawnWave();
              }
            });
            bar.appendChild(waveBtn);

            container.appendChild(bar);

            if (!this._tapHandler) {
              this._tapHandler = (e) => {
                e.preventDefault();
                const t = e.touches ? e.touches[0] : e;
                handleTap(t.clientX, t.clientY);
              };
              canvas.addEventListener('touchstart', this._tapHandler, { passive: false });
              canvas.addEventListener('mousedown', this._tapHandler);
            }
          },

          onOverlayAction() {
            reset();
          },

          update(dt) {
            if (gameOver || win) return;

            if (waveActive) {
              spawnTimer -= dt;
              if (spawnTimer <= 0 && enemies.length < 15) {
                spawnEnemy();
                spawnTimer = Math.max(0.3, 1.2 - wave * 0.08);
              }
              if (enemies.length === 0 && spawnTimer < -0.5) {
                waveActive = false;
                gold += 20 + wave * 5;
                updateHUD();
                UI.showToast('Хвилю ' + wave + ' пройдено! +' + (20 + wave * 5) + ' золота', 1500);
                AudioEngine.success();
              }
            }

            moveEnemies(dt);
            updateTowers(dt);
            updateBullets(dt);
            updateParticles(dt);
          },

          render(c, dt) {
            const grad = c.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, '#0a0f1e');
            grad.addColorStop(1, '#050810');
            c.fillStyle = grad;
            c.fillRect(0, 0, W, H);

            c.fillStyle = 'rgba(0, 200, 255, 0.08)';
            c.fillRect(0, 0, W, OFFY);
            c.fillStyle = '#80d0ff';
            c.font = 'bold 15px "Segoe UI", sans-serif';
            c.textAlign = 'left';
            c.fillText('❤ Життя: ' + lives, 14, 24);
            c.fillText('💰 Золото: ' + gold, 14, 44);
            c.fillText('🌊 Хвиля: ' + wave + '/10', 180, 24);
            c.fillText('⭐ ' + score, 180, 44);

            for (let y = 0; y < ROWS; y++) {
              for (let x = 0; x < COLS; x++) {
                const px = x * TILE;
                const py = y * TILE + OFFY;
                if (grid[y][x].path) {
                  c.fillStyle = 'rgba(255, 200, 80, 0.08)';
                  c.fillRect(px, py, TILE, TILE);
                  c.strokeStyle = 'rgba(255, 200, 80, 0.2)';
                  c.lineWidth = 1;
                  c.strokeRect(px + 0.5, py + 0.5, TILE - 1, TILE - 1);
                } else {
                  c.fillStyle = 'rgba(0, 200, 255, 0.04)';
                  c.fillRect(px, py, TILE, TILE);
                  c.strokeStyle = 'rgba(0, 200, 255, 0.08)';
                  c.lineWidth = 1;
                  c.strokeRect(px + 0.5, py + 0.5, TILE - 1, TILE - 1);
                }
              }
            }

            if (placingTower) {
              const type = TOWER_TYPES[placingTower];
              const rect = canvas.getBoundingClientRect();
              const scaleX = canvas.width / rect.width;
              const scaleY = canvas.height / rect.height;
              const cx = (mouseX - rect.left) * scaleX;
              const cy = (mouseY - rect.top) * scaleY;
              const gx = Math.floor(cx / TILE);
              const gy = Math.floor((cy - OFFY) / TILE);
              if (gx >= 0 && gx < COLS && gy >= 0 && gy < ROWS) {
                const px = gx * TILE + TILE / 2;
                const py = gy * TILE + OFFY + TILE / 2;
                c.beginPath();
                c.arc(px, py, type.range * TILE, 0, Math.PI * 2);
                c.fillStyle = 'rgba(0, 200, 255, 0.08)';
                c.fill();
                c.strokeStyle = 'rgba(0, 200, 255, 0.3)';
                c.lineWidth = 1;
                c.stroke();
              }
            }

            for (const t of towers) {
              const px = t.x * TILE;
              const py = t.y * TILE + OFFY;
              c.save();
              c.shadowColor = t.color;
              c.shadowBlur = 12;
              c.fillStyle = t.color;
              c.beginPath();
              c.arc(px, py, TILE * 0.3, 0, Math.PI * 2);
              c.fill();
              c.strokeStyle = '#ffffff';
              c.lineWidth = 1.5;
              c.stroke();
              c.fillStyle = '#ffffff';
              c.font = 'bold 11px "Segoe UI", sans-serif';
              c.textAlign = 'center';
              c.textBaseline = 'middle';
              c.fillText(t.type === 'basic' ? '🏹' : t.type === 'sniper' ? '🎯' : '⚡', px, py);
              c.restore();

              if (t === selectedTower) {
                c.beginPath();
                c.arc(px, py, t.range * TILE, 0, Math.PI * 2);
                c.fillStyle = 'rgba(0, 200, 255, 0.06)';
                c.fill();
                c.strokeStyle = 'rgba(0, 200, 255, 0.5)';
                c.lineWidth = 1.5;
                c.stroke();
              }
            }

            for (const e of enemies) {
              const px = e.x * TILE + TILE / 2;
              const py = e.y * TILE + OFFY + TILE / 2;
              c.save();
              c.shadowColor = e.color;
              c.shadowBlur = 10;
              c.fillStyle = e.color;
              c.beginPath();
              c.arc(px, py, TILE * 0.3, 0, Math.PI * 2);
              c.fill();
              c.strokeStyle = '#ffffff';
              c.lineWidth = 1.5;
              c.stroke();
              c.restore();

              const ratio = e.hp / e.maxHp;
              c.fillStyle = 'rgba(0,0,0,0.5)';
              c.fillRect(px - TILE * 0.35, py - TILE * 0.45, TILE * 0.7, 4);
              c.fillStyle = ratio > 0.5 ? '#40ff80' : ratio > 0.25 ? '#ffcc00' : '#ff4060';
              c.fillRect(px - TILE * 0.35, py - TILE * 0.45, TILE * 0.7 * ratio, 4);
            }

            for (const b of bullets) {
              c.save();
              c.shadowColor = b.color;
              c.shadowBlur = 10;
              c.fillStyle = b.color;
              c.beginPath();
              c.arc(b.x * TILE + TILE / 2, b.y * TILE + OFFY + TILE / 2, 4, 0, Math.PI * 2);
              c.fill();
              c.restore();
            }

            for (const p of particles) {
              const alpha = p.life / p.maxLife;
              c.globalAlpha = alpha;
              c.fillStyle = p.color;
              c.fillRect(p.x, p.y, p.size, p.size);
            }
            c.globalAlpha = 1;

            if (!waveActive && !gameOver && !win) {
              c.fillStyle = 'rgba(0, 200, 255, 0.8)';
              c.font = 'bold 14px "Segoe UI", sans-serif';
              c.textAlign = 'center';
              c.fillText('Натисни "ХВИЛЯ" щоб почати', W / 2, H - 10);
            }
          },

          destroy() {
            if (this._tapHandler) {
              canvas.removeEventListener('touchstart', this._tapHandler);
              canvas.removeEventListener('mousedown', this._tapHandler);
              this._tapHandler = null;
            }
          }
        };
      };

      /* ======================================================================
         GAME 4: INFINITE RUNNER
         ====================================================================== */
      GameFactory.infinite_runner = function(canvas, ctx) {
        const W = canvas.width;
        const H = canvas.height;
        const GROUND_Y = H - 90;
        const GRAVITY = 2200;
        const JUMP_FORCE = -750;

        let player = { x: 100, y: GROUND_Y, vy: 0, onGround: true, doubleJump: false };
        let obstacles = [];
        let coins = [];
        let particles = [];
        let clouds = [];
        let score = 0;
        let distance = 0;
        let speed = 320;
        let spawnTimer = 1;
        let coinTimer = 0.5;
        let gameOver = false;
        let keys = {};
        let touchJump = false;
        let jumpPressed = false;

        for (let i = 0; i < 8; i++) {
          clouds.push({ x: Math.random() * W, y: rand(40, 200), s: rand(0.5, 1.2), v: rand(15, 40) });
        }

        function reset() {
          player = { x: 100, y: GROUND_Y, vy: 0, onGround: true, doubleJump: false };
          obstacles = [];
          coins = [];
          particles = [];
          score = 0;
          distance = 0;
          speed = 320;
          spawnTimer = 1;
          coinTimer = 0.5;
          gameOver = false;
          jumpPressed = false;
          UI.hideGameOverlay();
          updateHUD();
        }

        function updateHUD() {
          UI.updateGameHUD('Infinite Runner', Math.floor(score), Storage.getHighScore('infinite_runner'));
        }

        function endGame() {
          if (gameOver) return;
          gameOver = true;
          Storage.setHighScore('infinite_runner', Math.floor(score));
          UI.updateGameHUD('Infinite Runner', Math.floor(score), Storage.getHighScore('infinite_runner'));
          UI.showGameOverlay(
            'ГРУ ЗАВЕРШЕНО',
            'Дистанція: ' + Math.floor(distance) + ' м',
            'СПРОБУВАТИ ЗНОВУ',
            'Очки: <span>' + formatNumber(Math.floor(score)) + '</span>'
          );
          AudioEngine.fail();
        }

        function spawnObstacle() {
          const type = Math.random() < 0.3 ? 'tall' : 'short';
          const w = type === 'tall' ? 30 : 40;
          const h = type === 'tall' ? 80 : 45;
          obstacles.push({
            x: W + 40,
            y: GROUND_Y - h,
            w, h, type,
            passed: false
          });
        }

        function spawnCoin() {
          const y = GROUND_Y - rand(40, 180);
          coins.push({
            x: W + 30, y,
            r: 10,
            collected: false,
            phase: Math.random() * Math.PI * 2
          });
        }

        function jump() {
          if (player.onGround) {
            player.vy = JUMP_FORCE;
            player.onGround = false;
            player.doubleJump = true;
            AudioEngine.jump();
            for (let i = 0; i < 8; i++) {
              particles.push({
                x: player.x, y: player.y,
                vx: rand(-100, 100), vy: rand(-50, 50),
                life: 0.4, maxLife: 0.4,
                color: '#00f0ff', size: 3
              });
            }
          } else if (player.doubleJump) {
            player.vy = JUMP_FORCE * 0.85;
            player.doubleJump = false;
            AudioEngine.tone(600, 0.1, 'sine', 0.08);
            for (let i = 0; i < 10; i++) {
              particles.push({
                x: player.x, y: player.y,
                vx: rand(-120, 120), vy: rand(-80, 80),
                life: 0.4, maxLife: 0.4,
                color: '#ffcc00', size: 3
              });
            }
          }
        }

        return {
          init() { reset(); },

          setupControls(container) {
            container.innerHTML = '';
            const actions = document.createElement('div');
            actions.className = 'action-buttons';
            const jumpBtn = document.createElement('div');
            jumpBtn.className = 'action-btn';
            jumpBtn.textContent = '⬆';
            jumpBtn.style.width = '80px';
            jumpBtn.style.height = '80px';
            jumpBtn.addEventListener('touchstart', (e) => {
              e.preventDefault();
              touchJump = true;
              jumpBtn.classList.add('active');
            }, { passive: false });
            jumpBtn.addEventListener('touchend', (e) => {
              e.preventDefault();
              touchJump = false;
              jumpBtn.classList.remove('active');
            }, { passive: false });
            jumpBtn.addEventListener('mousedown', (e) => {
              e.preventDefault();
              touchJump = true;
              jumpBtn.classList.add('active');
            });
            jumpBtn.addEventListener('mouseup', () => {
              touchJump = false;
              jumpBtn.classList.remove('active');
            });
            jumpBtn.addEventListener('mouseleave', () => {
              touchJump = false;
              jumpBtn.classList.remove('active');
            });
            actions.appendChild(jumpBtn);
            container.appendChild(actions);

            if (!this._keyHandler) {
              this._keyHandler = (e) => {
                if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) {
                  e.preventDefault();
                  if (!jumpPressed) {
                    jumpPressed = true;
                    jump();
                  }
                }
                keys[e.code] = true;
              };
              this._keyUpHandler = (e) => {
                if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) {
                  jumpPressed = false;
                }
                keys[e.code] = false;
              };
              document.addEventListener('keydown', this._keyHandler);
              document.addEventListener('keyup', this._keyUpHandler);

              this._tapHandler = (e) => {
                e.preventDefault();
                jump();
              };
              canvas.addEventListener('touchstart', this._tapHandler, { passive: false });
              canvas.addEventListener('mousedown', this._tapHandler);
            }
          },

          onOverlayAction() { reset(); },

          update(dt) {
            if (gameOver) return;

            if (touchJump && !jumpPressed) {
              jumpPressed = true;
              jump();
            }
            if (!touchJump) jumpPressed = false;

            distance += speed * dt * 0.02;
            score += speed * dt * 0.05;
            speed += dt * 8;
            updateHUD();

            player.vy += GRAVITY * dt;
            player.y += player.vy * dt;
            if (player.y >= GROUND_Y) {
              player.y = GROUND_Y;
              player.vy = 0;
              player.onGround = true;
              player.doubleJump = false;
            }

            spawnTimer -= dt;
            if (spawnTimer <= 0) {
              spawnObstacle();
              spawnTimer = Math.max(0.5, rand(0.9, 1.8) - speed / 2000);
            }

            coinTimer -= dt;
            if (coinTimer <= 0) {
              spawnCoin();
              coinTimer = rand(0.6, 1.5);
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
              const o = obstacles[i];
              o.x -= speed * dt;
              if (o.x + o.w < 0) { obstacles.splice(i, 1); continue; }

              if (!o.passed && o.x + o.w < player.x - 20) {
                o.passed = true;
                score += 50;
              }

              if (player.x + 15 > o.x && player.x - 15 < o.x + o.w) {
                if (player.y + 30 > o.y && player.y - 30 < o.y + o.h) {
                  endGame();
                  return;
                }
              }
            }

            for (let i = coins.length - 1; i >= 0; i--) {
              const co = coins[i];
              co.x -= speed * dt;
              co.phase += dt * 4;
              if (co.x < -30) { coins.splice(i, 1); continue; }
              if (dist(player.x, player.y, co.x, co.y) < 32) {
                score += 25;
                AudioEngine.coin();
                for (let k = 0; k < 6; k++) {
                  particles.push({
                    x: co.x, y: co.y,
                    vx: rand(-100, 100), vy: rand(-100, 100),
                    life: 0.4, maxLife: 0.4,
                    color: '#ffcc00', size: 3
                  });
                }
                coins.splice(i, 1);
              }
            }

            for (const cl of clouds) {
              cl.x -= cl.v * dt;
              if (cl.x < -150) { cl.x = W + 100; cl.y = rand(40, 200); }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
              const p = particles[i];
              p.x += p.vx * dt;
              p.y += p.vy * dt;
              p.vy += 400 * dt;
              p.life -= dt;
              if (p.life <= 0) particles.splice(i, 1);
            }
          },

          render(c, dt) {
            const grad = c.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, '#0a0520');
            grad.addColorStop(0.5, '#1a0a2e');
            grad.addColorStop(1, '#2a1040');
            c.fillStyle = grad;
            c.fillRect(0, 0, W, H);

            c.fillStyle = 'rgba(255, 200, 100, 0.15)';
            c.beginPath();
            c.arc(W * 0.8, H * 0.25, 60, 0, Math.PI * 2);
            c.fill();

            for (const cl of clouds) {
              c.fillStyle = 'rgba(100, 150, 255, 0.08)';
              c.beginPath();
              c.ellipse(cl.x, cl.y, 80 * cl.s, 25 * cl.s, 0, 0, Math.PI * 2);
              c.fill();
            }

            c.fillStyle = '#1a0a2e';
            c.fillRect(0, GROUND_Y + 30, W, H - GROUND_Y - 30);
            c.fillStyle = '#00f0ff';
            c.fillRect(0, GROUND_Y + 28, W, 4);
            c.fillStyle = 'rgba(0, 240, 255, 0.15)';
            for (let i = 0; i < W; i += 40) {
              c.fillRect(i - (distance * 10) % 40, GROUND_Y + 40, 20, 3);
            }

            for (const o of obstacles) {
              c.save();
              c.shadowColor = '#ff4060';
              c.shadowBlur = 14;
              c.fillStyle = '#cc2244';
              c.fillRect(o.x, o.y, o.w, o.h);
              c.strokeStyle = '#ff88aa';
              c.lineWidth = 2;
              c.strokeRect(o.x, o.y, o.w, o.h);
              c.restore();
            }

            for (const co of coins) {
              const scale = 1 + Math.sin(co.phase) * 0.15;
              c.save();
              c.translate(co.x, co.y);
              c.scale(scale, scale);
              c.shadowColor = '#ffcc00';
              c.shadowBlur = 16;
              c.beginPath();
              c.arc(0, 0, co.r, 0, Math.PI * 2);
              const g2 = c.createRadialGradient(-3, -3, 1, 0, 0, co.r);
              g2.addColorStop(0, '#ffff88');
              g2.addColorStop(1, '#ffaa00');
              c.fillStyle = g2;
              c.fill();
              c.strokeStyle = '#ffee88';
              c.lineWidth = 2;
              c.stroke();
              c.restore();
            }

            for (const p of particles) {
              const alpha = p.life / p.maxLife;
              c.globalAlpha = alpha;
              c.fillStyle = p.color;
              c.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
            }
            c.globalAlpha = 1;

            if (!gameOver) {
              c.save();
              c.translate(player.x, player.y);
              c.shadowColor = '#00f0ff';
              c.shadowBlur = 20;
              c.fillStyle = '#00ccff';
              c.beginPath();
              c.arc(0, 0, 18, 0, Math.PI * 2);
              c.fill();
              c.strokeStyle = '#ffffff';
              c.lineWidth = 2;
              c.stroke();
              c.fillStyle = '#ffffff';
              c.beginPath();
              c.arc(-5, -4, 4, 0, Math.PI * 2);
              c.fill();
              c.beginPath();
              c.arc(5, -4, 4, 0, Math.PI * 2);
              c.fill();
              c.fillStyle = '#003344';
              c.beginPath();
              c.arc(-5, -4, 2, 0, Math.PI * 2);
              c.fill();
              c.beginPath();
              c.arc(5, -4, 2, 0, Math.PI * 2);
              c.fill();
              c.restore();
            }

            c.fillStyle = '#00f0ff';
            c.font = 'bold 18px "Segoe UI", sans-serif';
            c.textAlign = 'right';
            c.fillText('Швидкість: ' + Math.floor(speed / 10), W - 14, 30);
            c.fillText('Дистанція: ' + Math.floor(distance) + ' м', W - 14, 54);
          },

          destroy() {
            if (this._keyHandler) {
              document.removeEventListener('keydown', this._keyHandler);
              document.removeEventListener('keyup', this._keyUpHandler);
              this._keyHandler = null;
              this._keyUpHandler = null;
            }
            if (this._tapHandler) {
              canvas.removeEventListener('touchstart', this._tapHandler);
              canvas.removeEventListener('mousedown', this._tapHandler);
              this._tapHandler = null;
            }
          }
        };
      };

      /* ======================================================================
         GAME 5: LASER BOUNCE (Physics Puzzle)
         ====================================================================== */
      GameFactory.laser_bounce = function(canvas, ctx) {
        const W = canvas.width;
        const H = canvas.height;

        let lasers = [];
        let mirrors = [];
        let targets = [];
        let blocks = [];
        let selectedMirror = null;
        let dragging = false;
        let dragOffsetX = 0, dragOffsetY = 0;
        let level = 0;
        let solved = false;
        let score = 0;
        let mouseX = 0, mouseY = 0;

        const LEVELS = [
          {
            lasers: [{ x: 60, y: 300, dx: 1, dy: 0 }],
            mirrors: [{ x: 400, y: 300, angle: 0 }],
            targets: [{ x: 700, y: 300, r: 20 }],
            blocks: []
          },
          {
            lasers: [{ x: 60, y: 150, dx: 1, dy: 0 }],
            mirrors: [
              { x: 400, y: 150, angle: 0 },
              { x: 400, y: 400, angle: 0 }
            ],
            targets: [{ x: 700, y: 400, r: 20 }],
            blocks: [{ x: 550, y: 200, w: 20, h: 200 }]
          },
          {
            lasers: [{ x: 60, y: 500, dx: 1, dy: 0 }],
            mirrors: [
              { x: 300, y: 500, angle: 0 },
              { x: 300, y: 200, angle: 0 },
              { x: 600, y: 200, angle: 0 }
            ],
            targets: [{ x: 700, y: 500, r: 20 }],
            blocks: [{ x: 500, y: 300, w: 200, h: 20 }]
          }
        ];

        function reset() {
          const lvl = LEVELS[level % LEVELS.length];
          lasers = deepCopy(lvl.lasers);
          mirrors = deepCopy(lvl.mirrors);
          targets = deepCopy(lvl.targets);
          blocks = deepCopy(lvl.blocks || []);
          solved = false;
          selectedMirror = null;
          UI.hideGameOverlay();
          updateHUD();
        }

        function updateHUD() {
          UI.updateGameHUD('Laser Bounce', score, Storage.getHighScore('laser_bounce'));
        }

        function traceLaser(startX, startY, dx, dy) {
          const segments = [];
          let x = startX, y = startY;
          let vx = dx, vy = dy;
          let bounces = 0;
          const maxBounces = 30;

          while (bounces < maxBounces) {
            let closest = null;
            let closestT = Infinity;

            for (const m of mirrors) {
              const t = (m.x - x) / vx;
              if (t > 0.01) {
                const hitY = y + vy * t;
                if (Math.abs(hitY - m.y) < 20) {
                  if (t < closestT) {
                    closestT = t;
                    closest = { type: 'mirror', obj: m, t, hitX: m.x, hitY };
                  }
                }
              }
            }

            for (const b of blocks) {
              if (vx > 0) {
                const t = (b.x - x) / vx;
                if (t > 0.01 && t < closestT) {
                  const hitY = y + vy * t;
                  if (hitY >= b.y && hitY <= b.y + b.h) {
                    closestT = t;
                    closest = { type: 'block', obj: b, t, hitX: b.x, hitY };
                  }
                }
              } else if (vx < 0) {
                const t = (b.x + b.w - x) / vx;
                if (t > 0.01 && t < closestT) {
                  const hitY = y + vy * t;
                  if (hitY >= b.y && hitY <= b.y + b.h) {
                    closestT = t;
                    closest = { type: 'block', obj: b, t, hitX: b.x + b.w, hitY };
                  }
                }
              }
              if (vy > 0) {
                const t = (b.y - y) / vy;
                if (t > 0.01 && t < closestT) {
                  const hitX = x + vx * t;
                  if (hitX >= b.x && hitX <= b.x + b.w) {
                    closestT = t;
                    closest = { type: 'block', obj: b, t, hitX, hitY: b.y };
                  }
                }
              } else if (vy < 0) {
                const t = (b.y + b.h - y) / vy;
                if (t > 0.01 && t < closestT) {
                  const hitX = x + vx * t;
                  if (hitX >= b.x && hitX <= b.x + b.w) {
                    closestT = t;
                    closest = { type: 'block', obj: b, t, hitX, hitY: b.y + b.h };
                  }
                }
              }
            }

            let hitTarget = false;
            for (const tg of targets) {
              const t = (tg.x - x) / vx;
              if (t > 0.01 && t < closestT) {
                const hitY = y + vy * t;
                if (Math.abs(hitY - tg.y) < tg.r + 10) {
                  closestT = t;
                  closest = { type: 'target', obj: tg, t, hitX: tg.x, hitY };
                  hitTarget = true;
                }
              }
            }

            if (closest === null) {
              segments.push({ x1: x, y1: y, x2: x + vx * 2000, y2: y + vy * 2000 });
              break;
            }

            segments.push({ x1: x, y1: y, x2: closest.hitX, y2: closest.hitY });
            x = closest.hitX;
            y = closest.hitY;

            if (closest.type === 'mirror') {
              const m = closest.obj;
              if (m.angle === 0 || m.angle === 180) {
                vx = -vx;
              } else if (m.angle === 90 || m.angle === 270) {
                vy = -vy;
              } else if (m.angle === 45 || m.angle === 225) {
                const tmp = vx;
                vx = vy;
                vy = tmp;
              } else if (m.angle === 135 || m.angle === 315) {
                const tmp = vx;
                vx = -vy;
                vy = -tmp;
              }
              bounces++;
            } else if (closest.type === 'block') {
              if (Math.abs(vx) > Math.abs(vy)) vx = -vx;
              else vy = -vy;
              bounces++;
            } else if (closest.type === 'target') {
              hitTarget = true;
              break;
            }
          }

          return { segments, hitTarget };
        }

        function checkSolved() {
          for (const l of lasers) {
            const result = traceLaser(l.x, l.y, l.dx, l.dy);
            if (result.hitTarget) return true;
          }
          return false;
        }

        function getMirrorAt(mx, my) {
          for (const m of mirrors) {
            if (dist(mx, my, m.x, m.y) < 28) return m;
          }
          return null;
        }

        function getMousePos(e) {
          const rect = canvas.getBoundingClientRect();
          const scaleX = canvas.width / rect.width;
          const scaleY = canvas.height / rect.height;
          const t = e.touches ? e.touches[0] : e;
          return {
            x: (t.clientX - rect.left) * scaleX,
            y: (t.clientY - rect.top) * scaleY
          };
        }

        return {
          init() { reset(); },

          setupControls(container) {
            container.innerHTML = '';
            const bar = document.createElement('div');
            bar.style.cssText = 'display:flex;gap:10px;flex-wrap:wrap;justify-content:center;';

            const rotBtn = document.createElement('button');
            rotBtn.className = 'action-btn';
            rotBtn.style.cssText = 'width:auto;padding:10px 20px;border-radius:14px;font-size:13px;height:auto;min-height:54px;';
            rotBtn.textContent = '🔄 ОБЕРТАТИ';
            rotBtn.addEventListener('click', (e) => {
              e.preventDefault();
              if (selectedMirror) {
                selectedMirror.angle = (selectedMirror.angle + 45) % 360;
                AudioEngine.click();
                checkSolvedState();
              }
            });
            bar.appendChild(rotBtn);

            const resetBtn = document.createElement('button');
            resetBtn.className = 'action-btn';
            resetBtn.style.cssText = 'width:auto;padding:10px 20px;border-radius:14px;font-size:13px;height:auto;min-height:54px;border-color:#ffcc00;color:#ffcc00;';
            resetBtn.textContent = '↻ СКИНУТИ';
            resetBtn.addEventListener('click', (e) => {
              e.preventDefault();
              reset();
              AudioEngine.click();
            });
            bar.appendChild(resetBtn);

            const nextBtn = document.createElement('button');
            nextBtn.className = 'action-btn';
            nextBtn.style.cssText = 'width:auto;padding:10px 20px;border-radius:14px;font-size:13px;height:auto;min-height:54px;border-color:#40ff80;color:#40ff80;';
            nextBtn.textContent = '▶ ДАЛІ';
            nextBtn.addEventListener('click', (e) => {
              e.preventDefault();
              level++;
              reset();
              AudioEngine.click();
            });
            bar.appendChild(nextBtn);

            container.appendChild(bar);

            if (!this._touchHandlers) {
              const onStart = (e) => {
                e.preventDefault();
                const pos = getMousePos(e);
                mouseX = pos.x; mouseY = pos.y;
                const m = getMirrorAt(pos.x, pos.y);
                if (m) {
                  selectedMirror = m;
                  dragging = true;
                  dragOffsetX = pos.x - m.x;
                  dragOffsetY = pos.y - m.y;
                  AudioEngine.click();
                }
              };
              const onMove = (e) => {
                e.preventDefault();
                const pos = getMousePos(e);
                mouseX = pos.x; mouseY = pos.y;
                if (dragging && selectedMirror) {
                  selectedMirror.x = clamp(pos.x - dragOffsetX, 30, W - 30);
                  selectedMirror.y = clamp(pos.y - dragOffsetY, 30, H - 30);
                }
              };
              const onEnd = (e) => {
                dragging = false;
                checkSolvedState();
              };
              canvas.addEventListener('touchstart', onStart, { passive: false });
              canvas.addEventListener('touchmove', onMove, { passive: false });
              canvas.addEventListener('touchend', onEnd);
              canvas.addEventListener('mousedown', onStart);
              canvas.addEventListener('mousemove', onMove);
              canvas.addEventListener('mouseup', onEnd);
              this._touchHandlers = { onStart, onMove, onEnd };
            }

            function checkSolvedState() {
              if (checkSolved() && !solved) {
                solved = true;
                score += 200 + level * 50;
                Storage.setHighScore('laser_bounce', score);
                updateHUD();
                UI.showGameOverlay(
                  'РОЗВ\'ЯЗАНО!',
                  'Ти спрямував лазер на ціль!',
                  'НАСТУПНИЙ РІВЕНЬ',
                  'Очки: <span>' + formatNumber(score) + '</span>'
                );
                AudioEngine.success();
              }
            }
          },

          onOverlayAction() {
            level++;
            reset();
          },

          update(dt) {
            if (!solved) {
              const result = checkSolved();
              if (result) {
                solved = true;
                score += 200 + level * 50;
                Storage.setHighScore('laser_bounce', score);
                updateHUD();
                UI.showGameOverlay(
                  'РОЗВ\'ЯЗАНО!',
                  'Ти спрямував лазер на ціль!',
                  'НАСТУПНИЙ РІВЕНЬ',
                  'Очки: <span>' + formatNumber(score) + '</span>'
                );
                AudioEngine.success();
              }
            }
          },

          render(c, dt) {
            const grad = c.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, '#0a0518');
            grad.addColorStop(1, '#050210');
            c.fillStyle = grad;
            c.fillRect(0, 0, W, H);

            c.strokeStyle = 'rgba(0, 200, 255, 0.04)';
            c.lineWidth = 1;
            for (let x = 0; x < W; x += 40) {
              c.beginPath(); c.moveTo(x, 0); c.lineTo(x, H); c.stroke();
            }
            for (let y = 0; y < H; y += 40) {
              c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke();
            }

            for (const b of blocks) {
              c.fillStyle = 'rgba(60, 80, 120, 0.5)';
              c.fillRect(b.x, b.y, b.w, b.h);
              c.strokeStyle = 'rgba(100, 150, 200, 0.4)';
              c.lineWidth = 2;
              c.strokeRect(b.x, b.y, b.w, b.h);
            }

            for (const tg of targets) {
              c.save();
              c.shadowColor = '#40ff80';
              c.shadowBlur = 25;
              c.beginPath();
              c.arc(tg.x, tg.y, tg.r, 0, Math.PI * 2);
              c.fillStyle = 'rgba(64, 255, 128, 0.15)';
              c.fill();
              c.strokeStyle = '#40ff80';
              c.lineWidth = 3;
              c.stroke();
              c.beginPath();
              c.arc(tg.x, tg.y, tg.r * 0.5, 0, Math.PI * 2);
              c.fillStyle = '#40ff80';
              c.fill();
              c.restore();
            }

            for (const l of lasers) {
              c.save();
              c.shadowColor = '#ff4060';
              c.shadowBlur = 20;
              c.fillStyle = '#ff4060';
              c.beginPath();
              c.arc(l.x, l.y, 14, 0, Math.PI * 2);
              c.fill();
              c.strokeStyle = '#ff88aa';
              c.lineWidth = 2;
              c.stroke();
              c.fillStyle = '#ffffff';
              c.font = 'bold 12px "Segoe UI", sans-serif';
              c.textAlign = 'center';
              c.textBaseline = 'middle';
              c.fillText('L', l.x, l.y);
              c.restore();
            }

            for (const m of mirrors) {
              c.save();
              c.translate(m.x, m.y);
              c.rotate(m.angle * Math.PI / 180);
              c.shadowColor = m === selectedMirror ? '#00f0ff' : '#80a0c0';
              c.shadowBlur = m === selectedMirror ? 25 : 10;
              c.fillStyle = m === selectedMirror ? '#00f0ff' : '#a0c0e0';
              c.fillRect(-25, -4, 50, 8);
              c.strokeStyle = '#ffffff';
              c.lineWidth = 1.5;
              c.strokeRect(-25, -4, 50, 8);
              c.restore();
            }

            for (const l of lasers) {
              const result = traceLaser(l.x, l.y, l.dx, l.dy);
              c.save();
              c.shadowColor = '#ff4060';
              c.shadowBlur = 15;
              c.strokeStyle = '#ff4060';
              c.lineWidth = 3;
              for (const seg of result.segments) {
                c.beginPath();
                c.moveTo(seg.x1, seg.y1);
                c.lineTo(seg.x2, seg.y2);
                c.stroke();
              }
              c.restore();
            }

            if (solved) {
              c.fillStyle = 'rgba(64, 255, 128, 0.15)';
              c.fillRect(0, 0, W, H);
              c.fillStyle = '#40ff80';
              c.font = 'bold 28px "Segoe UI", sans-serif';
              c.textAlign = 'center';
              c.shadowColor = '#40ff80';
              c.shadowBlur = 30;
              c.fillText('РОЗВ\'ЯЗАНО!', W / 2, 50);
              c.shadowBlur = 0;
            }
          },

          destroy() {
            if (this._touchHandlers) {
              canvas.removeEventListener('touchstart', this._touchHandlers.onStart);
              canvas.removeEventListener('touchmove', this._touchHandlers.onMove);
              canvas.removeEventListener('touchend', this._touchHandlers.onEnd);
              canvas.removeEventListener('mousedown', this._touchHandlers.onStart);
              canvas.removeEventListener('mousemove', this._touchHandlers.onMove);
              canvas.removeEventListener('mouseup', this._touchHandlers.onEnd);
              this._touchHandlers = null;
            }
          }
        };
      };

      /* ======================================================================
         GAME 6: FLAPPY BIRD
         ====================================================================== */
      GameFactory.flappy_bird = function(canvas, ctx) {
        const W = canvas.width;
        const H = canvas.height;

        let bird = { x: W * 0.3, y: H / 2, vy: 0, w: 34, h: 26, rot: 0 };
        let pipes = [];
        let particles = [];
        let score = 0;
        let spawnTimer = 0;
        let gameOver = false;
        let started = false;
        let keys = {};
        let touchJump = false;
        let jumpPressed = false;

        const GRAVITY = 1500;
        const FLAP = -420;
        const PIPE_W = 70;
        const GAP = 170;

        function reset() {
          bird = { x: W * 0.3, y: H / 2, vy: 0, w: 34, h: 26, rot: 0 };
          pipes = [];
          particles = [];
          score = 0;
          spawnTimer = 0;
          gameOver = false;
          started = false;
          jumpPressed = false;
          UI.hideGameOverlay();
          updateHUD();
        }

        function updateHUD() {
          UI.updateGameHUD('Flappy Bird', score, Storage.getHighScore('flappy_bird'));
        }

        function flap() {
          if (gameOver) return;
          if (!started) started = true;
          bird.vy = FLAP;
          AudioEngine.tone(600, 0.08, 'square', 0.06);
          for (let i = 0; i < 5; i++) {
            particles.push({
              x: bird.x - 10, y: bird.y + 10,
              vx: rand(-80, -20), vy: rand(-30, 30),
              life: 0.4, maxLife: 0.4,
              color: '#ffffff', size: 2
            });
          }
        }

        function endGame() {
          if (gameOver) return;
          gameOver = true;
          Storage.setHighScore('flappy_bird', score);
          UI.updateGameHUD('Flappy Bird', score, Storage.getHighScore('flappy_bird'));
          UI.showGameOverlay(
            'ГРУ ЗАВЕРШЕНО',
            'Ти пролетів ' + score + ' перешкод',
            'СПРОБУВАТИ ЗНОВУ',
            'Очки: <span>' + formatNumber(score) + '</span>'
          );
          AudioEngine.fail();
        }

        return {
          init() { reset(); },

          setupControls(container) {
            container.innerHTML = '';
            const actions = document.createElement('div');
            actions.className = 'action-buttons';
            const jumpBtn = document.createElement('div');
            jumpBtn.className = 'action-btn';
            jumpBtn.textContent = '⬆';
            jumpBtn.style.width = '90px';
            jumpBtn.style.height = '90px';
            jumpBtn.style.fontSize = '28px';
            jumpBtn.addEventListener('touchstart', (e) => {
              e.preventDefault();
              touchJump = true;
              jumpBtn.classList.add('active');
            }, { passive: false });
            jumpBtn.addEventListener('touchend', (e) => {
              e.preventDefault();
              touchJump = false;
              jumpBtn.classList.remove('active');
            }, { passive: false });
            jumpBtn.addEventListener('mousedown', (e) => {
              e.preventDefault();
              touchJump = true;
              jumpBtn.classList.add('active');
            });
            jumpBtn.addEventListener('mouseup', () => {
              touchJump = false;
              jumpBtn.classList.remove('active');
            });
            jumpBtn.addEventListener('mouseleave', () => {
              touchJump = false;
              jumpBtn.classList.remove('active');
            });
            actions.appendChild(jumpBtn);
            container.appendChild(actions);

            if (!this._keyHandler) {
              this._keyHandler = (e) => {
                if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) {
                  e.preventDefault();
                  if (!jumpPressed) {
                    jumpPressed = true;
                    flap();
                  }
                }
              };
              this._keyUpHandler = (e) => {
                if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) jumpPressed = false;
              };
              document.addEventListener('keydown', this._keyHandler);
              document.addEventListener('keyup', this._keyUpHandler);

              this._tapHandler = (e) => {
                e.preventDefault();
                flap();
              };
              canvas.addEventListener('touchstart', this._tapHandler, { passive: false });
              canvas.addEventListener('mousedown', this._tapHandler);
            }
          },

          onOverlayAction() { reset(); },

          update(dt) {
            if (gameOver) return;

            if (touchJump && !jumpPressed) {
              jumpPressed = true;
              flap();
            }
            if (!touchJump) jumpPressed = false;

            if (!started) return;

            bird.vy += GRAVITY * dt;
            bird.y += bird.vy * dt;
            bird.rot = clamp(bird.vy / 600, -0.6, 1.2);

            if (bird.y < -50 || bird.y > H + 50) {
              endGame();
              return;
            }

            spawnTimer -= dt;
            if (spawnTimer <= 0) {
              const gapY = rand(120, H - 120 - GAP);
              pipes.push({
                x: W + 20,
                gapY,
                gapH: GAP,
                passed: false
              });
              spawnTimer = rand(1.5, 2.2);
            }

            for (let i = pipes.length - 1; i >= 0; i--) {
              const p = pipes[i];
              p.x -= 220 * dt;
              if (p.x + PIPE_W < 0) { pipes.splice(i, 1); continue; }

              if (!p.passed && p.x + PIPE_W < bird.x - bird.w / 2) {
                p.passed = true;
                score++;
                updateHUD();
                AudioEngine.coin();
              }

              if (bird.x + bird.w / 2 > p.x && bird.x - bird.w / 2 < p.x + PIPE_W) {
                if (bird.y - bird.h / 2 < p.gapY || bird.y + bird.h / 2 > p.gapY + p.gapH) {
                  endGame();
                  return;
                }
              }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
              const p = particles[i];
              p.x += p.vx * dt;
              p.y += p.vy * dt;
              p.life -= dt;
              if (p.life <= 0) particles.splice(i, 1);
            }
          },

          render(c, dt) {
            const grad = c.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, '#0a1a2e');
            grad.addColorStop(0.6, '#1a3a5e');
            grad.addColorStop(1, '#0a2a4e');
            c.fillStyle = grad;
            c.fillRect(0, 0, W, H);

            c.fillStyle = 'rgba(255, 255, 255, 0.05)';
            for (let i = 0; i < 5; i++) {
              const cx = ((i * 200 + Date.now() * 0.02) % (W + 200)) - 100;
              c.beginPath();
              c.ellipse(cx, 80 + i * 60, 60, 20, 0, 0, Math.PI * 2);
              c.fill();
            }

            c.fillStyle = '#1a2a3e';
            c.fillRect(0, H - 40, W, 40);
            c.fillStyle = 'rgba(0, 240, 255, 0.1)';
            for (let i = 0; i < W; i += 30) {
              c.fillRect(i - (Date.now() * 0.1) % 30, H - 38, 15, 3);
            }

            for (const p of pipes) {
              c.save();
              c.shadowColor = '#40ff80';
              c.shadowBlur = 15;
              c.fillStyle = '#2a8a4a';
              c.fillRect(p.x, 0, PIPE_W, p.gapY);
              c.fillRect(p.x, p.gapY + p.gapH, PIPE_W, H - p.gapY - p.gapH);
              c.strokeStyle = '#60ffa0';
              c.lineWidth = 2;
              c.strokeRect(p.x, 0, PIPE_W, p.gapY);
              c.strokeRect(p.x, p.gapY + p.gapH, PIPE_W, H - p.gapY - p.gapH);
              c.restore();
            }

            for (const p of particles) {
              const alpha = p.life / p.maxLife;
              c.globalAlpha = alpha;
              c.fillStyle = p.color;
              c.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
            }
            c.globalAlpha = 1;

            if (!gameOver) {
              c.save();
              c.translate(bird.x, bird.y);
              c.rotate(bird.rot);
              c.shadowColor = '#ffcc00';
              c.shadowBlur = 18;
              c.fillStyle = '#ffcc00';
              c.beginPath();
              c.ellipse(0, 0, bird.w / 2, bird.h / 2, 0, 0, Math.PI * 2);
              c.fill();
              c.strokeStyle = '#ffee88';
              c.lineWidth = 2;
              c.stroke();
              c.fillStyle = '#ffffff';
              c.beginPath();
              c.arc(8, -5, 5, 0, Math.PI * 2);
              c.fill();
              c.fillStyle = '#000000';
              c.beginPath();
              c.arc(9, -5, 2.5, 0, Math.PI * 2);
              c.fill();
              c.fillStyle = '#ff8040';
              c.beginPath();
              c.moveTo(bird.w / 2 - 2, 0);
              c.lineTo(bird.w / 2 + 8, 2);
              c.lineTo(bird.w / 2 - 2, 6);
              c.closePath();
              c.fill();
              c.restore();
            }

            if (!started && !gameOver) {
              c.fillStyle = '#ffffff';
              c.font = 'bold 24px "Segoe UI", sans-serif';
              c.textAlign = 'center';
              c.shadowColor = '#00f0ff';
              c.shadowBlur = 20;
              c.fillText('Натисни, щоб летіти!', W / 2, H / 2 - 80);
              c.shadowBlur = 0;
            }
          },

          destroy() {
            if (this._keyHandler) {
              document.removeEventListener('keydown', this._keyHandler);
              document.removeEventListener('keyup', this._keyUpHandler);
              this._keyHandler = null;
              this._keyUpHandler = null;
            }
            if (this._tapHandler) {
              canvas.removeEventListener('touchstart', this._tapHandler);
              canvas.removeEventListener('mousedown', this._tapHandler);
              this._tapHandler = null;
            }
          }
        };
      };

      /* ======================================================================
         GAME 7: SNAKE DELUXE
         ====================================================================== */
      GameFactory.snake_deluxe = function(canvas, ctx) {
        const COLS = 20;
        const ROWS = 15;
        const TILE = Math.min(canvas.width / COLS, (canvas.height - 60) / ROWS);
        const OFFX = (canvas.width - COLS * TILE) / 2;
        const OFFY = 60 + (canvas.height - 60 - ROWS * TILE) / 2;

        let snake = [];
        let dir = { x: 1, y: 0 };
        let nextDir = { x: 1, y: 0 };
        let food = [];
        let portals = [];
        let obstacles = [];
        let score = 0;
        let moveTimer = 0;
        let moveDelay = 0.14;
        let gameOver = false;
        let particles = [];
        let keys = {};
        let touchDir = null;

        function reset() {
          snake = [
            { x: 5, y: 7 },
            { x: 4, y: 7 },
            { x: 3, y: 7 }
          ];
          dir = { x: 1, y: 0 };
          nextDir = { x: 1, y: 0 };
          food = [];
          portals = [];
          obstacles = [];
          score = 0;
          moveTimer = 0;
          moveDelay = 0.14;
          gameOver = false;
          particles = [];
          touchDir = null;
          spawnFood();
          spawnFood();
          spawnPortals();
          UI.hideGameOverlay();
          updateHUD();
        }

        function updateHUD() {
          UI.updateGameHUD('Snake Deluxe', score, Storage.getHighScore('snake_deluxe'));
        }

        function spawnFood() {
          let attempts = 0;
          while (attempts < 100) {
            const x = randInt(0, COLS - 1);
            const y = randInt(0, ROWS - 1);
            if (!snake.some(s => s.x === x && s.y === y) &&
                !food.some(f => f.x === x && f.y === y) &&
                !obstacles.some(o => o.x === x && o.y === y)) {
              const type = Math.random() < 0.15 ? 'gold' : 'normal';
              food.push({ x, y, type, phase: Math.random() * Math.PI * 2 });
              return;
            }
            attempts++;
          }
        }

        function spawnPortals() {
          if (Math.random() < 0.5) {
            const pairs = [
              [{ x: 0, y: 0 }, { x: COLS - 1, y: ROWS - 1 }],
              [{ x: 0, y: ROWS - 1 }, { x: COLS - 1, y: 0 }],
              [{ x: Math.floor(COLS / 2), y: 0 }, { x: Math.floor(COLS / 2), y: ROWS - 1 }]
            ];
            const p = pairs[randInt(0, pairs.length - 1)];
            portals = [
              { x: p[0].x, y: p[0].y, pair: 1, color: '#00f0ff' },
              { x: p[1].x, y: p[1].y, pair: 0, color: '#ff40a0' }
            ];
          }
        }

        function endGame() {
          if (gameOver) return;
          gameOver = true;
          Storage.setHighScore('snake_deluxe', score);
          UI.updateGameHUD('Snake Deluxe', score, Storage.getHighScore('snake_deluxe'));
          UI.showGameOverlay(
            'ГРУ ЗАВЕРШЕНО',
            'Довжина змійки: ' + snake.length,
            'СПРОБУВАТИ ЗНОВУ',
            'Очки: <span>' + formatNumber(score) + '</span>'
          );
          AudioEngine.fail();
        }

        function step() {
          dir = { ...nextDir };
          let head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

          let teleported = false;
          for (const p of portals) {
            if (head.x === p.x && head.y === p.y) {
              const target = portals.find(pp => pp.pair === p.pair);
              if (target) {
                head = { x: target.x + dir.x, y: target.y + dir.y };
                head.x = clamp(head.x, 0, COLS - 1);
                head.y = clamp(head.y, 0, ROWS - 1);
                teleported = true;
                AudioEngine.portal();
                for (let i = 0; i < 10; i++) {
                  particles.push({
                    x: (p.x + 0.5) * TILE + OFFX,
                    y: (p.y + 0.5) * TILE + OFFY,
                    vx: rand(-150, 150), vy: rand(-150, 150),
                    life: 0.5, maxLife: 0.5,
                    color: p.color, size: 3
                  });
                }
              }
              break;
            }
          }

          if (!teleported) {
            if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
              endGame();
              return;
            }
          }

          if (snake.some(s => s.x === head.x && s.y === head.y)) {
            endGame();
            return;
          }
          if (obstacles.some(o => o.x === head.x && o.y === head.y)) {
            endGame();
            return;
          }

          snake.unshift(head);

          let ate = false;
          for (let i = food.length - 1; i >= 0; i--) {
            if (food[i].x === head.x && food[i].y === head.y) {
              const f = food[i];
              score += f.type === 'gold' ? 50 : 10;
              if (f.type === 'gold') {
                moveDelay = Math.max(0.06, moveDelay - 0.005);
              }
              ate = true;
              AudioEngine.coin();
              for (let k = 0; k < 10; k++) {
                particles.push({
                  x: (f.x + 0.5) * TILE + OFFX,
                  y: (f.y + 0.5) * TILE + OFFY,
                  vx: rand(-120, 120), vy: rand(-120, 120),
                  life: 0.5, maxLife: 0.5,
                  color: f.type === 'gold' ? '#ffcc00' : '#ff4060', size: 3
                });
              }
              food.splice(i, 1);
              updateHUD();
              break;
            }
          }

          if (!ate) snake.pop();

          if (food.length < 2) spawnFood();
          if (Math.random() < 0.08) {
            let attempts = 0;
            while (attempts < 50) {
              const x = randInt(0, COLS - 1);
              const y = randInt(0, ROWS - 1);
              if (!snake.some(s => s.x === x && s.y === y) &&
                  !food.some(f => f.x === x && f.y === y) &&
                  !obstacles.some(o => o.x === x && o.y === y) &&
                  !portals.some(p => p.x === x && p.y === y)) {
                obstacles.push({ x, y });
                break;
              }
              attempts++;
            }
          }
        }

        return {
          init() { reset(); },

          setupControls(container) {
            container.innerHTML = '';
            const dpad = document.createElement('div');
            dpad.className = 'dpad';
            const dirs = [null, 'up', null, 'left', null, 'right', null, 'down', null];
            for (const d of dirs) {
              const btn = document.createElement('div');
              if (d === null) { btn.className = 'dpad-btn empty'; }
              else {
                btn.className = 'dpad-btn';
                const arrows = { up: '▲', down: '▼', left: '◀', right: '▶' };
                btn.textContent = arrows[d];
                const setDir = () => {
                  if (d === 'up' && dir.y !== 1) nextDir = { x: 0, y: -1 };
                  else if (d === 'down' && dir.y !== -1) nextDir = { x: 0, y: 1 };
                  else if (d === 'left' && dir.x !== 1) nextDir = { x: -1, y: 0 };
                  else if (d === 'right' && dir.x !== -1) nextDir = { x: 1, y: 0 };
                  touchDir = d;
                };
                btn.addEventListener('touchstart', (e) => { e.preventDefault(); setDir(); btn.classList.add('active'); }, { passive: false });
                btn.addEventListener('touchend', (e) => { e.preventDefault(); btn.classList.remove('active'); }, { passive: false });
                btn.addEventListener('mousedown', (e) => { e.preventDefault(); setDir(); btn.classList.add('active'); });
                btn.addEventListener('mouseup', () => btn.classList.remove('active'));
              }
              dpad.appendChild(btn);
            }
            container.appendChild(dpad);

            if (!this._keyHandler) {
              this._keyHandler = (e) => {
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyW', 'KeyA', 'KeyS', 'KeyD'].includes(e.code)) {
                  e.preventDefault();
                  if ((e.code === 'ArrowUp' || e.code === 'KeyW') && dir.y !== 1) nextDir = { x: 0, y: -1 };
                  else if ((e.code === 'ArrowDown' || e.code === 'KeyS') && dir.y !== -1) nextDir = { x: 0, y: 1 };
                  else if ((e.code === 'ArrowLeft' || e.code === 'KeyA') && dir.x !== 1) nextDir = { x: -1, y: 0 };
                  else if ((e.code === 'ArrowRight' || e.code === 'KeyD') && dir.x !== -1) nextDir = { x: 1, y: 0 };
                }
              };
              document.addEventListener('keydown', this._keyHandler);

              let sx = 0, sy = 0;
              this._swipe = {
                start: (e) => {
                  if (e.touches.length === 1) {
                    sx = e.touches[0].clientX;
                    sy = e.touches[0].clientY;
                  }
                },
                move: (e) => {
                  e.preventDefault();
                  if (e.touches.length === 1) {
                    const dx = e.touches[0].clientX - sx;
                    const dy = e.touches[0].clientY - sy;
                    const th = 25;
                    if (Math.abs(dx) > th || Math.abs(dy) > th) {
                      if (Math.abs(dx) > Math.abs(dy)) {
                        if (dx > 0 && dir.x !== -1) nextDir = { x: 1, y: 0 };
                        else if (dx < 0 && dir.x !== 1) nextDir = { x: -1, y: 0 };
                      } else {
                        if (dy > 0 && dir.y !== -1) nextDir = { x: 0, y: 1 };
                        else if (dy < 0 && dir.y !== 1) nextDir = { x: 0, y: -1 };
                      }
                    }
                  }
                },
                end: () => {}
              };
              canvas.addEventListener('touchstart', this._swipe.start, { passive: true });
              canvas.addEventListener('touchmove', this._swipe.move, { passive: false });
              canvas.addEventListener('touchend', this._swipe.end);
            }
          },

          onOverlayAction() { reset(); },

          update(dt) {
            if (gameOver) return;

            for (let i = particles.length - 1; i >= 0; i--) {
              const p = particles[i];
              p.x += p.vx * dt;
              p.y += p.vy * dt;
              p.vx *= 0.95;
              p.vy *= 0.95;
              p.life -= dt;
              if (p.life <= 0) particles.splice(i, 1);
            }

            moveTimer -= dt;
            if (moveTimer <= 0) {
              step();
              moveTimer = moveDelay;
            }
          },

          render(c, dt) {
            const grad = c.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, '#0a1a10');
            grad.addColorStop(1, '#050a08');
            c.fillStyle = grad;
            c.fillRect(0, 0, canvas.width, canvas.height);

            c.fillStyle = 'rgba(0, 200, 100, 0.04)';
            for (let y = 0; y < ROWS; y++) {
              for (let x = 0; x < COLS; x++) {
                c.fillRect(OFFX + x * TILE, OFFY + y * TILE, TILE - 1, TILE - 1);
              }
            }

            for (const o of obstacles) {
              c.save();
              c.shadowColor = '#606060';
              c.shadowBlur = 8;
              c.fillStyle = '#404850';
              c.fillRect(OFFX + o.x * TILE + 2, OFFY + o.y * TILE + 2, TILE - 4, TILE - 4);
              c.restore();
            }

            for (const p of portals) {
              c.save();
              c.shadowColor = p.color;
              c.shadowBlur = 20;
              c.strokeStyle = p.color;
              c.lineWidth = 3;
              const px = OFFX + p.x * TILE + TILE / 2;
              const py = OFFY + p.y * TILE + TILE / 2;
              const r = TILE * 0.35 + Math.sin(Date.now() * 0.005) * 2;
              c.beginPath();
              c.arc(px, py, r, 0, Math.PI * 2);
              c.stroke();
              c.beginPath();
              c.arc(px, py, r * 0.6, 0, Math.PI * 2);
              c.stroke();
              c.restore();
            }

            for (const f of food) {
              f.phase += 0.05;
              const scale = 1 + Math.sin(f.phase) * 0.15;
              const px = OFFX + f.x * TILE + TILE / 2;
              const py = OFFY + f.y * TILE + TILE / 2;
              c.save();
              c.translate(px, py);
              c.scale(scale, scale);
              c.shadowColor = f.type === 'gold' ? '#ffcc00' : '#ff4060';
              c.shadowBlur = 18;
              c.beginPath();
              c.arc(0, 0, TILE * 0.3, 0, Math.PI * 2);
              const g2 = c.createRadialGradient(-3, -3, 1, 0, 0, TILE * 0.35);
              if (f.type === 'gold') {
                g2.addColorStop(0, '#ffff88');
                g2.addColorStop(1, '#ffaa00');
              } else {
                g2.addColorStop(0, '#ff88aa');
                g2.addColorStop(1, '#cc2244');
              }
              c.fillStyle = g2;
              c.fill();
              c.restore();
            }

            for (let i = snake.length - 1; i >= 0; i--) {
              const s = snake[i];
              const px = OFFX + s.x * TILE;
              const py = OFFY + s.y * TILE;
              const t = i / Math.max(1, snake.length - 1);
              c.save();
              c.shadowColor = '#40ff80';
              c.shadowBlur = i === 0 ? 20 : 10;
              const r = i === 0 ? TILE * 0.42 : TILE * 0.36 * (1 - t * 0.2);
              const g2 = c.createRadialGradient(px + TILE / 2 - 3, py + TILE / 2 - 3, 2, px + TILE / 2, py + TILE / 2, r);
              if (i === 0) {
                g2.addColorStop(0, '#aaffcc');
                g2.addColorStop(1, '#00cc66');
              } else {
                g2.addColorStop(0, '#60ffa0');
                g2.addColorStop(1, '#008844');
              }
              c.fillStyle = g2;
              c.beginPath();
              c.arc(px + TILE / 2, py + TILE / 2, r, 0, Math.PI * 2);
              c.fill();
              c.restore();
            }

            if (snake.length > 0) {
              const h = snake[0];
              const px = OFFX + h.x * TILE + TILE / 2;
              const py = OFFY + h.y * TILE + TILE / 2;
              c.fillStyle = '#ffffff';
              c.beginPath();
              c.arc(px - 5, py - 5, 3, 0, Math.PI * 2);
              c.fill();
              c.beginPath();
              c.arc(px + 5, py - 5, 3, 0, Math.PI * 2);
              c.fill();
              c.fillStyle = '#003320';
              c.beginPath();
              c.arc(px - 5, py - 5, 1.5, 0, Math.PI * 2);
              c.fill();
              c.beginPath();
              c.arc(px + 5, py - 5, 1.5, 0, Math.PI * 2);
              c.fill();
            }

            for (const p of particles) {
              const alpha = p.life / p.maxLife;
              c.globalAlpha = alpha;
              c.fillStyle = p.color;
              c.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
            }
            c.globalAlpha = 1;

            c.fillStyle = '#40ff80';
            c.font = 'bold 16px "Segoe UI", sans-serif';
            c.textAlign = 'left';
            c.fillText('Довжина: ' + snake.length, 14, 28);
            c.fillText('Швидкість: ' + Math.floor(1 / moveDelay), 14, 50);
          },

          destroy() {
            if (this._keyHandler) {
              document.removeEventListener('keydown', this._keyHandler);
              this._keyHandler = null;
            }
            if (this._swipe) {
              canvas.removeEventListener('touchstart', this._swipe.start);
              canvas.removeEventListener('touchmove', this._swipe.move);
              canvas.removeEventListener('touchend', this._swipe.end);
              this._swipe = null;
            }
          }
        };
      };

      /* ======================================================================
         GAME 8: MATCH-3 GEM CRUSH
         ====================================================================== */
      GameFactory.match3 = function(canvas, ctx) {
        const COLS = 8;
        const ROWS = 8;
        const TILE = Math.min(canvas.width / COLS, (canvas.height - 80) / ROWS);
        const OFFX = (canvas.width - COLS * TILE) / 2;
        const OFFY = 70 + (canvas.height - 80 - ROWS * TILE) / 2;

        const COLORS = [
          { name: 'red', color: '#ff4060' },
          { name: 'blue', color: '#4080ff' },
          { name: 'green', color: '#40ff80' },
          { name: 'yellow', color: '#ffcc00' },
          { name: 'purple', color: '#c040ff' },
          { name: 'cyan', color: '#00f0ff' }
        ];

        let grid = [];
        let score = 0;
        let selected = null;
        let swapAnim = null;
        let particles = [];
        let fallSpeed = 800;
        let moves = 30;
        let gameOver = false;
        let comboText = '';
        let comboTimer = 0;

        function createGem() {
          return { type: randInt(0, COLORS.length - 1), scale: 0, yOffset: 0 };
        }

        function fillGrid() {
          grid = [];
          for (let y = 0; y < ROWS; y++) {
            grid[y] = [];
            for (let x = 0; x < COLS; x++) {
              grid[y][x] = createGem();
            }
          }
          let safety = 0;
          while (findMatches().length > 0 && safety < 100) {
            for (const m of findMatches()) {
              for (const p of m) {
                grid[p.y][p.x] = createGem();
              }
            }
            safety++;
          }
        }

        function findMatches() {
          const matches = [];
          for (let y = 0; y < ROWS; y++) {
            let run = 1;
            for (let x = 1; x <= COLS; x++) {
              const same = x < COLS && grid[y][x] && grid[y][x - 1] && grid[y][x].type === grid[y][x - 1].type;
              if (same) {
                run++;
              } else {
                if (run >= 3) {
                  const group = [];
                  for (let k = x - run; k < x; k++) group.push({ x: k, y });
                  matches.push(group);
                }
                run = 1;
              }
            }
          }
          for (let x = 0; x < COLS; x++) {
            let run = 1;
            for (let y = 1; y <= ROWS; y++) {
              const same = y < ROWS && grid[y][x] && grid[y - 1][x] && grid[y][x].type === grid[y - 1][x].type;
              if (same) {
                run++;
              } else {
                if (run >= 3) {
                  const group = [];
                  for (let k = y - run; k < y; k++) group.push({ x, y: k });
                  matches.push(group);
                }
                run = 1;
              }
            }
          }
          const seen = new Set();
          const unique = [];
          for (const m of matches) {
            const key = m.map(p => p.x + ',' + p.y).sort().join('|');
            if (!seen.has(key)) {
              seen.add(key);
              unique.push(m);
            }
          }
          return unique;
        }

        function removeMatches() {
          const matches = findMatches();
          if (matches.length === 0) return false;

          let totalPoints = 0;
          for (const m of matches) {
            totalPoints += m.length * 10 * (m.length >= 4 ? 2 : 1);
            for (const p of m) {
              const gem = grid[p.y][p.x];
              const px = OFFX + p.x * TILE + TILE / 2;
              const py = OFFY + p.y * TILE + TILE / 2;
              for (let k = 0; k < 6; k++) {
                particles.push({
                  x: px, y: py,
                  vx: rand(-150, 150), vy: rand(-150, 150),
                  life: 0.5, maxLife: 0.5,
                  color: COLORS[gem.type].color, size: rand(3, 6)
                });
              }
              grid[p.y][p.x] = null;
            }
          }
          score += totalPoints;
          updateHUD();
          AudioEngine.coin();

          if (matches.length > 1) {
            comboText = 'КОМБО x' + matches.length + '!';
            comboTimer = 1.2;
          }

          return true;
        }

        function applyGravity() {
          for (let x = 0; x < COLS; x++) {
            let writeY = ROWS - 1;
            for (let y = ROWS - 1; y >= 0; y--) {
              if (grid[y][x] !== null) {
                if (writeY !== y) {
                  grid[writeY][x] = grid[y][x];
                  grid[writeY][x].yOffset = (writeY - y) * TILE;
                  grid[y][x] = null;
                }
                writeY--;
              }
            }
            for (let y = writeY; y >= 0; y--) {
              grid[y][x] = createGem();
              grid[y][x].yOffset = -(writeY - y + 1) * TILE - TILE;
            }
          }
        }

        function updateHUD() {
          UI.updateGameHUD('Match-3 Gems', score, Storage.getHighScore('match3'));
        }

        function endGame() {
          if (gameOver) return;
          gameOver = true;
          Storage.setHighScore('match3', score);
          UI.updateGameHUD('Match-3 Gems', score, Storage.getHighScore('match3'));
          UI.showGameOverlay(
            'ГРУ ЗАВЕРШЕНО',
            'Ходи закінчилися!',
            'СПРОБУВАТИ ЗНОВУ',
            'Очки: <span>' + formatNumber(score) + '</span>'
          );
          AudioEngine.fail();
        }

        function reset() {
          score = 0;
          moves = 30;
          selected = null;
          swapAnim = null;
          particles = [];
          gameOver = false;
          comboText = '';
          comboTimer = 0;
          fillGrid();
          UI.hideGameOverlay();
          updateHUD();
        }

        function getGemAt(mx, my) {
          const rect = canvas.getBoundingClientRect();
          const scaleX = canvas.width / rect.width;
          const scaleY = canvas.height / rect.height;
          const cx = (mx - rect.left) * scaleX;
          const cy = (my - rect.top) * scaleY;
          const gx = Math.floor((cx - OFFX) / TILE);
          const gy = Math.floor((cy - OFFY) / TILE);
          if (gx < 0 || gx >= COLS || gy < 0 || gy >= ROWS) return null;
          return { x: gx, y: gy };
        }

        function trySwap(a, b) {
          const gemA = grid[a.y][a.x];
          const gemB = grid[b.y][b.x];
          if (!gemA || !gemB) return;
          grid[a.y][a.x] = gemB;
          grid[b.y][b.x] = gemA;
          const matches = findMatches();
          if (matches.length === 0) {
            grid[a.y][a.x] = gemA;
            grid[b.y][b.x] = gemB;
            AudioEngine.fail();
            return false;
          }
          swapAnim = { a, b, t: 0 };
          moves--;
          updateHUD();
          AudioEngine.click();
          if (moves <= 0) {
            setTimeout(() => endGame(), 500);
          }
          return true;
        }

        return {
          init() { reset(); },

          setupControls(container) {
            container.innerHTML = '';
            const bar = document.createElement('div');
            bar.style.cssText = 'display:flex;gap:10px;flex-wrap:wrap;justify-content:center;';

            const resetBtn = document.createElement('button');
            resetBtn.className = 'action-btn';
            resetBtn.style.cssText = 'width:auto;padding:10px 20px;border-radius:14px;font-size:13px;height:auto;min-height:54px;border-color:#ffcc00;color:#ffcc00;';
            resetBtn.textContent = '↻ НОВА ГРА';
            resetBtn.addEventListener('click', (e) => {
              e.preventDefault();
              reset();
              AudioEngine.click();
            });
            bar.appendChild(resetBtn);
            container.appendChild(bar);

            if (!this._clickHandler) {
              this._clickHandler = (e) => {
                e.preventDefault();
                if (gameOver) return;
                const t = e.touches ? e.touches[0] : e;
                const g = getGemAt(t.clientX, t.clientY);
                if (!g) return;
                if (!selected) {
                  selected = g;
                  AudioEngine.tone(600, 0.05, 'square', 0.04);
                } else {
                  if (selected.x === g.x && selected.y === g.y) {
                    selected = null;
                  } else if (Math.abs(selected.x - g.x) + Math.abs(selected.y - g.y) === 1) {
                    trySwap(selected, g);
                    selected = null;
                  } else {
                    selected = g;
                  }
                }
              };
              canvas.addEventListener('touchstart', this._clickHandler, { passive: false });
              canvas.addEventListener('mousedown', this._clickHandler);
            }
          },

          onOverlayAction() { reset(); },

          update(dt) {
            if (gameOver) return;

            if (comboTimer > 0) comboTimer -= dt;

            for (const row of grid) {
              for (const gem of row) {
                if (gem) {
                  gem.scale = lerp(gem.scale, 1, dt * 10);
                  gem.yOffset = lerp(gem.yOffset, 0, dt * 12);
                }
              }
            }

            if (swapAnim) {
              swapAnim.t += dt * 5;
              if (swapAnim.t >= 1) swapAnim = null;
            }

            let changed = removeMatches();
            if (changed) {
              applyGravity();
            } else {
              let stillFalling = false;
              for (const row of grid) {
                for (const gem of row) {
                  if (gem && Math.abs(gem.yOffset) > 1) stillFalling = true;
                }
              }
              if (!stillFalling) {
                let hasMatch = false;
                for (let y = 0; y < ROWS; y++) {
                  for (let x = 0; x < COLS; x++) {
                    if (x < COLS - 2 && grid[y][x] && grid[y][x + 1] && grid[y][x + 2] &&
                        grid[y][x].type === grid[y][x + 1].type && grid[y][x].type === grid[y][x + 2].type) hasMatch = true;
                    if (y < ROWS - 2 && grid[y][x] && grid[y + 1][x] && grid[y + 2][x] &&
                        grid[y][x].type === grid[y + 1][x].type && grid[y][x].type === grid[y + 2][x].type) hasMatch = true;
                  }
                }
                if (hasMatch) {
                  removeMatches();
                  applyGravity();
                }
              }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
              const p = particles[i];
              p.x += p.vx * dt;
              p.y += p.vy * dt;
              p.vx *= 0.96;
              p.vy *= 0.96;
              p.life -= dt;
              if (p.life <= 0) particles.splice(i, 1);
            }
          },

          render(c, dt) {
            const grad = c.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, '#1a0a2e');
            grad.addColorStop(1, '#0a0518');
            c.fillStyle = grad;
            c.fillRect(0, 0, canvas.width, canvas.height);

            c.fillStyle = 'rgba(0, 200, 255, 0.04)';
            c.fillRect(OFFX - 4, OFFY - 4, COLS * TILE + 8, ROWS * TILE + 8);
            c.strokeStyle = 'rgba(0, 200, 255, 0.2)';
            c.lineWidth = 2;
            c.strokeRect(OFFX - 4, OFFY - 4, COLS * TILE + 8, ROWS * TILE + 8);

            for (let y = 0; y < ROWS; y++) {
              for (let x = 0; x < COLS; x++) {
                const gem = grid[y][x];
                if (!gem) continue;
                const px = OFFX + x * TILE + TILE / 2;
                const py = OFFY + y * TILE + TILE / 2 + (gem.yOffset || 0);
                const r = TILE * 0.38 * (gem.scale || 0);
                const color = COLORS[gem.type].color;

                c.save();
                c.shadowColor = color;
                c.shadowBlur = 12;
                c.beginPath();
                c.arc(px, py, r, 0, Math.PI * 2);
                const g2 = c.createRadialGradient(px - r * 0.3, py - r * 0.3, 1, px, py, r);
                g2.addColorStop(0, '#ffffff');
                g2.addColorStop(0.3, color);
                g2.addColorStop(1, color);
                c.fillStyle = g2;
                c.fill();
                c.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                c.lineWidth = 1.5;
                c.stroke();

                c.beginPath();
                c.arc(px - r * 0.3, py - r * 0.3, r * 0.25, 0, Math.PI * 2);
                c.fillStyle = 'rgba(255, 255, 255, 0.6)';
                c.fill();

                c.restore();

                if (selected && selected.x === x && selected.y === y) {
                  c.strokeStyle = '#ffffff';
                  c.lineWidth = 3;
                  c.shadowColor = '#ffffff';
                  c.shadowBlur = 20;
                  c.strokeRect(OFFX + x * TILE + 2, OFFY + y * TILE + 2, TILE - 4, TILE - 4);
                  c.shadowBlur = 0;
                }
              }
            }

            for (const p of particles) {
              const alpha = p.life / p.maxLife;
              c.globalAlpha = alpha;
              c.fillStyle = p.color;
              c.beginPath();
              c.arc(p.x, p.y, p.size / 2, 0, Math.PI * 2);
              c.fill();
            }
            c.globalAlpha = 1;

            c.fillStyle = '#c040ff';
            c.font = 'bold 16px "Segoe UI", sans-serif';
            c.textAlign = 'left';
            c.fillText('Ходи: ' + moves, 14, 28);
            c.fillText('Очки: ' + score, 14, 50);

            if (comboTimer > 0) {
              c.fillStyle = '#ffcc00';
              c.font = 'bold 28px "Segoe UI", sans-serif';
              c.textAlign = 'center';
              c.shadowColor = '#ffcc00';
              c.shadowBlur = 20;
              c.globalAlpha = Math.min(1, comboTimer);
              c.fillText(comboText, canvas.width / 2, canvas.height / 2 - 100);
              c.globalAlpha = 1;
              c.shadowBlur = 0;
            }
          },

          destroy() {
            if (this._clickHandler) {
              canvas.removeEventListener('touchstart', this._clickHandler);
              canvas.removeEventListener('mousedown', this._clickHandler);
              this._clickHandler = null;
            }
          }
        };
      };

      /* ======================================================================
         GAME 9: 2048 PUZZLE
         ====================================================================== */
      GameFactory['2048'] = function(canvas, ctx) {
        const SIZE = 4;
        const PADDING = 12;
