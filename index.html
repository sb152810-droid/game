<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#080b14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>NEON ARCADE HUB — 15 ігор</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080b14;
      font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
      color: #e0e8f0;
      touch-action: none;
      overscroll-behavior: none;
    }

    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 0%, #111a2e 0%, #080b14 60%, #04060c 100%);
    }

    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      transition: opacity 0.35s ease, transform 0.35s ease;
      will-change: opacity, transform;
    }

    .screen.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.98);
    }

    .screen.visible {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    /* ============ HUB MENU ============ */
    #hubScreen {
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: #1e3a5f #0a0e18;
    }

    #hubScreen::-webkit-scrollbar {
      width: 6px;
    }

    #hubScreen::-webkit-scrollbar-track {
      background: #0a0e18;
    }

    #hubScreen::-webkit-scrollbar-thumb {
      background: #1e3a5f;
      border-radius: 3px;
    }

    .hub-header {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 18px 20px 14px;
      background: linear-gradient(180deg, rgba(8, 11, 20, 0.98) 0%, rgba(8, 11, 20, 0.92) 70%, rgba(8, 11, 20, 0) 100%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .hub-title {
      font-size: clamp(22px, 5.5vw, 40px);
      font-weight: 900;
      letter-spacing: 4px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #00f0ff, #b040ff, #ff40a0, #00f0ff);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientShift 6s ease infinite;
      text-align: center;
      line-height: 1.15;
      filter: drop-shadow(0 0 24px rgba(0, 240, 255, 0.35));
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .hub-subtitle {
      font-size: clamp(10px, 2.5vw, 14px);
      color: #5a7a9a;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .hub-stats-bar {
      display: flex;
      gap: 14px;
      margin-top: 4px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .hub-stat {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: #7a9ab8;
      background: rgba(0, 200, 255, 0.06);
      border: 1px solid rgba(0, 200, 255, 0.12);
      border-radius: 20px;
      padding: 4px 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .hub-stat .val {
      color: #00f0ff;
      font-weight: 800;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
      padding: 8px 16px 40px;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }

    @media (min-width: 600px) {
      .games-grid {
        grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
        gap: 16px;
        padding: 8px 24px 60px;
      }
    }

    @media (min-width: 900px) {
      .games-grid {
        grid-template-columns: repeat(5, 1fr);
        gap: 18px;
        max-width: 1100px;
      }
    }

    .game-card {
      position: relative;
      background: linear-gradient(145deg, rgba(18, 26, 45, 0.9), rgba(10, 15, 28, 0.95));
      border: 1px solid rgba(0, 200, 255, 0.12);
      border-radius: 16px;
      padding: 18px 10px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.25s ease, box-shadow 0.3s ease;
      overflow: hidden;
      min-height: 130px;
      justify-content: center;
      text-align: center;
    }

    .game-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--accent, #00f0ff);
      opacity: 0.7;
      transition: opacity 0.3s ease, height 0.3s ease;
    }

    .game-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 0%, var(--accent, #00f0ff), transparent 70%);
      opacity: 0;
      transition: opacity 0.35s ease;
      pointer-events: none;
    }

    .game-card:hover, .game-card:active {
      transform: translateY(-5px) scale(1.03);
      border-color: var(--accent, #00f0ff);
      box-shadow: 0 10px 40px -8px var(--accent, #00f0ff), 0 0 20px -5px var(--accent, #00f0ff);
    }

    .game-card:hover::after, .game-card:active::after {
      opacity: 0.08;
    }

    .game-card:hover::before, .game-card:active::before {
      opacity: 1;
      height: 4px;
    }

    .game-card .icon {
      font-size: clamp(28px, 6vw, 38px);
      line-height: 1;
      filter: drop-shadow(0 0 10px var(--accent, #00f0ff));
      transition: transform 0.3s ease;
    }

    .game-card:hover .icon {
      transform: scale(1.15);
    }

    .game-card .name {
      font-size: clamp(10px, 2.4vw, 13px);
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #c0d8f0;
      line-height: 1.3;
    }

    .game-card .high-score {
      font-size: 9px;
      color: #5a7a9a;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .game-card .high-score span {
      color: var(--accent, #00f0ff);
      font-weight: 800;
    }

    /* ============ GAME CONTAINER ============ */
    #gameScreen {
      background: #080b14;
    }

    .game-topbar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 50;
      pointer-events: none;
      flex-wrap: wrap;
      gap: 6px;
    }

    .game-topbar > * {
      pointer-events: auto;
    }

    .game-topbar-left {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .game-topbar-right {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .top-badge {
      background: rgba(8, 14, 26, 0.85);
      border: 1px solid rgba(0, 200, 255, 0.25);
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 12px;
      font-weight: 700;
      color: #80d0ff;
      letter-spacing: 0.5px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .top-badge .label {
      color: #5a7a9a;
      font-weight: 600;
      font-size: 10px;
      text-transform: uppercase;
    }

    .top-badge .value {
      color: #00f0ff;
      font-weight: 800;
    }

    .top-btn {
      background: rgba(8, 14, 26, 0.85);
      border: 1px solid rgba(0, 200, 255, 0.3);
      border-radius: 12px;
      color: #80d0ff;
      font-size: 17px;
      font-weight: 700;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: all 0.18s ease;
      flex-shrink: 0;
    }

    .top-btn:active {
      transform: scale(0.9);
      background: rgba(0, 200, 255, 0.2);
    }

    .top-btn.back-btn {
      width: auto;
      padding: 0 14px;
      font-size: 13px;
      gap: 5px;
    }

    #gameCanvasWrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #gameCanvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
      touch-action: none;
    }

    #gameControls {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 10px 16px 20px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      pointer-events: none;
      z-index: 40;
    }

    #gameControls > * {
      pointer-events: auto;
    }

    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 7px;
      width: min(180px, 42vw);
      height: min(180px, 42vw);
      max-width: 200px;
      max-height: 200px;
    }

    .dpad-btn {
      background: rgba(12, 20, 38, 0.8);
      border: 1.5px solid rgba(0, 200, 255, 0.25);
      border-radius: 14px;
      color: #70c8ff;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: all 0.1s ease;
      touch-action: manipulation;
      box-shadow: 0 0 12px rgba(0, 200, 255, 0.06), inset 0 0 16px rgba(0, 200, 255, 0.03);
    }

    .dpad-btn:active, .dpad-btn.active {
      background: rgba(0, 200, 255, 0.22);
      border-color: rgba(0, 200, 255, 0.8);
      box-shadow: 0 0 20px rgba(0, 200, 255, 0.35), inset 0 0 24px rgba(0, 200, 255, 0.1);
      transform: scale(0.94);
      color: #ffffff;
    }

    .dpad-btn.empty {
      visibility: hidden;
      pointer-events: none;
    }

    .dpad-center {
      background: transparent;
      border: none;
      box-shadow: none;
      pointer-events: none;
    }

    .action-buttons {
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }

    .action-btn {
      background: rgba(12, 20, 38, 0.8);
      border: 1.5px solid rgba(0, 200, 255, 0.3);
      border-radius: 50%;
      color: #70c8ff;
      font-size: 16px;
      font-weight: 800;
      width: 62px;
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: all 0.1s ease;
      touch-action: manipulation;
      box-shadow: 0 0 16px rgba(0, 200, 255, 0.08);
      letter-spacing: 0.5px;
    }

    .action-btn:active, .action-btn.active {
      background: rgba(0, 200, 255, 0.25);
      border-color: rgba(0, 200, 255, 0.9);
      box-shadow: 0 0 28px rgba(0, 200, 255, 0.4);
      transform: scale(0.92);
      color: #ffffff;
    }

    /* ============ OVERLAY ============ */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(4, 7, 14, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 200;
      gap: 16px;
      padding: 24px;
      text-align: center;
      transition: opacity 0.3s ease;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .overlay-title {
      font-size: clamp(26px, 7vw, 48px);
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #00f0ff, #b040ff, #ff40a0);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 30px rgba(0, 240, 255, 0.4));
      line-height: 1.15;
    }

    .overlay-sub {
      font-size: clamp(13px, 3.2vw, 18px);
      color: #8aa8c8;
      max-width: 480px;
      line-height: 1.6;
    }

    .overlay-score {
      font-size: clamp(16px, 4vw, 22px);
      color: #c0d8f0;
      font-weight: 700;
    }

    .overlay-score span {
      color: #00f0ff;
      font-size: 1.3em;
    }

    .overlay-btn {
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.15), rgba(176, 64, 255, 0.15));
      border: 2px solid rgba(0, 240, 255, 0.5);
      border-radius: 50px;
      padding: 14px 44px;
      color: #ffffff;
      font-size: clamp(15px, 3.5vw, 20px);
      font-weight: 800;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.15);
      touch-action: manipulation;
      margin-top: 4px;
    }

    .overlay-btn:hover, .overlay-btn:active {
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.3), rgba(176, 64, 255, 0.3));
      box-shadow: 0 0 50px rgba(0, 240, 255, 0.45);
      transform: scale(1.05);
    }

    .overlay-btn.secondary {
      border-color: rgba(150, 150, 170, 0.4);
      background: rgba(30, 40, 60, 0.5);
      box-shadow: none;
      font-size: clamp(12px, 2.8vw, 15px);
      padding: 10px 30px;
    }

    .overlay-btn.secondary:hover {
      border-color: rgba(200, 200, 220, 0.6);
      background: rgba(40, 55, 80, 0.7);
      box-shadow: 0 0 20px rgba(150, 150, 200, 0.2);
    }

    .overlay-buttons-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* ============ LOADING ============ */
    #loadingScreen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #080b14;
      z-index: 9999;
      gap: 24px;
      transition: opacity 0.5s ease;
    }

    #loadingScreen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader-ring {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 4px solid rgba(0, 240, 255, 0.1);
      border-top-color: #00f0ff;
      border-right-color: #b040ff;
      animation: spin 1s linear infinite;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loader-text {
      font-size: 14px;
      color: #5a7a9a;
      letter-spacing: 4px;
      text-transform: uppercase;
      font-weight: 700;
      animation: pulseText 1.8s ease-in-out infinite;
    }

    @keyframes pulseText {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    /* ============ TOAST ============ */
    #toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(8, 14, 26, 0.95);
      border: 1px solid rgba(0, 200, 255, 0.4);
      border-radius: 30px;
      padding: 10px 24px;
      color: #00f0ff;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      z-index: 500;
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 0 30px rgba(0, 200, 255, 0.15);
      white-space: nowrap;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ============ RESPONSIVE ============ */
    @media (max-height: 500px) and (orientation: landscape) {
      .dpad {
        width: min(130px, 30vh);
        height: min(130px, 30vh);
      }
      .action-btn {
        width: 50px;
        height: 50px;
        font-size: 13px;
      }
      #gameControls {
        padding-bottom: 8px;
      }
      .game-topbar {
        padding: 5px 10px;
      }
      .top-badge {
        padding: 3px 10px;
        font-size: 10px;
      }
      .top-btn {
        width: 34px;
        height: 34px;
        font-size: 14px;
      }
      .top-btn.back-btn {
        font-size: 11px;
        padding: 0 10px;
      }
    }

    @media (min-width: 900px) and (orientation: landscape) {
      .dpad, .action-buttons {
        opacity: 0.35;
        transition: opacity 0.3s ease;
      }
      .dpad:hover, .action-buttons:hover {
        opacity: 0.85;
      }
    }

    @media (max-width: 380px) {
      .dpad {
        width: min(155px, 48vw);
        height: min(155px, 48vw);
      }
      .action-btn {
        width: 54px;
        height: 54px;
        font-size: 14px;
      }
      .games-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        padding: 6px 10px 30px;
      }
    }
  </style>
</head>
<body>
  <div id="loadingScreen">
    <div class="loader-ring"></div>
    <div class="loader-text">Завантаження...</div>
  </div>

  <div id="app">
    <!-- ============ HUB SCREEN ============ -->
    <div class="screen visible" id="hubScreen">
      <div class="hub-header">
        <div class="hub-title">Neon Arcade Hub</div>
        <div class="hub-subtitle">15 мініігор · Офлайн · PWA</div>
        <div class="hub-stats-bar">
          <div class="hub-stat">🎮 <span class="val" id="hubGamesPlayed">0</span> зіграно</div>
          <div class="hub-stat">🏆 <span class="val" id="hubTotalScore">0</span> очок</div>
          <div class="hub-stat">⭐ <span class="val" id="hubGamesUnlocked">15</span>/15</div>
        </div>
      </div>
      <div class="games-grid" id="gamesGrid"></div>
    </div>

    <!-- ============ GAME SCREEN ============ -->
    <div class="screen hidden" id="gameScreen">
      <div class="game-topbar">
        <div class="game-topbar-left">
          <button class="top-btn back-btn" id="backToHubBtn">◀ МЕНЮ</button>
          <div class="top-badge">
            <span class="label">Гра:</span>
            <span class="value" id="gameTitleBadge">—</span>
          </div>
          <div class="top-badge">
            <span class="label">Рекорд:</span>
            <span class="value" id="gameHighScoreBadge">0</span>
          </div>
          <div class="top-badge" id="gameScoreBadgeContainer">
            <span class="label">Очки:</span>
            <span class="value" id="gameScoreBadge">0</span>
          </div>
        </div>
        <div class="game-topbar-right">
          <button class="top-btn" id="gamePauseBtn">⏸</button>
          <button class="top-btn" id="gameRestartBtn">↻</button>
        </div>
      </div>
      <div id="gameCanvasWrapper">
        <canvas id="gameCanvas"></canvas>
      </div>
      <div id="gameControls"></div>

      <div class="overlay hidden" id="gameOverlay">
        <div class="overlay-title" id="gameOverlayTitle">—</div>
        <div class="overlay-sub" id="gameOverlaySub">—</div>
        <div class="overlay-score" id="gameOverlayScore" style="display:none;">—</div>
        <div class="overlay-buttons-row">
          <button class="overlay-btn" id="gameOverlayBtn">ГРАТИ</button>
          <button class="overlay-btn secondary" id="gameOverlayMenuBtn">МЕНЮ</button>
        </div>
      </div>
    </div>

    <div id="toast"></div>
  </div>

  <script>
    (function() {
      'use strict';

      /* ======================================================================
         UTILITIES
         ====================================================================== */
      const $ = (sel) => document.querySelector(sel);
      const $$ = (sel) => document.querySelectorAll(sel);

      function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }
      function lerp(a, b, t) { return a + (b - a) * t; }
      function rand(min, max) { return Math.random() * (max - min) + min; }
      function randInt(min, max) { return Math.floor(rand(min, max + 1)); }
      function dist(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); }
      function deepCopy(obj) { return JSON.parse(JSON.stringify(obj)); }

      function formatNumber(n) {
        if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
        if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
        return String(Math.floor(n));
      }

      /* ======================================================================
         AUDIO ENGINE (Web Audio API)
         ====================================================================== */
      const AudioEngine = {
        ctx: null,
        enabled: true,
        masterGain: null,

        init() {
          if (this.ctx) return;
          try {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) { this.enabled = false; return; }
            this.ctx = new AC();
            this.masterGain = this.ctx.createGain();
            this.masterGain.gain.value = 0.18;
            this.masterGain.connect(this.ctx.destination);
          } catch (e) {
            this.enabled = false;
          }
        },

        resume() {
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
          }
        },

        tone(freq, duration, type, volume, delay) {
          if (!this.enabled || !this.ctx) return;
          try {
            const t = this.ctx.currentTime + (delay || 0);
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type || 'sine';
            osc.frequency.setValueAtTime(freq, t);
            gain.gain.setValueAtTime(0, t);
            gain.gain.linearRampToValueAtTime(volume || 0.15, t + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
            osc.connect(gain);
            gain.connect(this.masterGain);
            osc.start(t);
            osc.stop(t + duration + 0.02);
          } catch (e) {}
        },

        sweep(freqStart, freqEnd, duration, type, volume) {
          if (!this.enabled || !this.ctx) return;
          try {
            const t = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type || 'sine';
            osc.frequency.setValueAtTime(freqStart, t);
            osc.frequency.exponentialRampToValueAtTime(Math.max(1, freqEnd), t + duration);
            gain.gain.setValueAtTime(volume || 0.12, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
            osc.connect(gain);
            gain.connect(this.masterGain);
            osc.start(t);
            osc.stop(t + duration + 0.02);
          } catch (e) {}
        },

        noise(duration, volume) {
          if (!this.enabled || !this.ctx) return;
          try {
            const t = this.ctx.currentTime;
            const bufferSize = Math.max(1, Math.floor(this.ctx.sampleRate * duration));
            const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
              data[i] = Math.random() * 2 - 1;
            }
            const src = this.ctx.createBufferSource();
            src.buffer = buffer;
            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(volume || 0.1, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
            src.connect(gain);
            gain.connect(this.masterGain);
            src.start(t);
            src.stop(t + duration + 0.02);
          } catch (e) {}
        },

        click() { this.tone(880, 0.06, 'square', 0.08); },
        success() {
          this.tone(523, 0.1, 'sine', 0.12, 0);
          this.tone(659, 0.1, 'sine', 0.12, 0.08);
          this.tone(784, 0.18, 'sine', 0.12, 0.16);
        },
        fail() {
          this.tone(300, 0.15, 'sawtooth', 0.1, 0);
          this.tone(200, 0.25, 'sawtooth', 0.1, 0.12);
        },
        coin() {
          this.tone(988, 0.06, 'square', 0.08, 0);
          this.tone(1319, 0.1, 'square', 0.08, 0.05);
        },
        jump() { this.sweep(300, 600, 0.12, 'sine', 0.1); },
        hit() { this.noise(0.1, 0.12); this.tone(150, 0.15, 'sawtooth', 0.1); },
        laser() { this.sweep(1200, 200, 0.15, 'sawtooth', 0.08); },

            return JSON.parse(raw);
          } catch (e) {
            return fallback;
          }
        },

          try {
            localStorage.setItem(this.PREFIX + key, JSON.stringify(value));
          } catch (e) {}
        },

          return this.get('hs_' + gameId, 0);

          const current = this.getHighScore(gameId);
          if (score > current) {
            this.set('hs_' + gameId, score);

          return false;
        },

        incrementGamesPlayed() { this.set('gamesPlayed', this.getGamesPlayed() + 1); },

        getTotalScore() {

          for (const g of GAMES) {

      /* ======================================================================
         GAME MANAGER (Base + lifecycle)
         ====================================================================== */
      const GameManager = {
        current: null,
        currentId: null,
        canvas: null,
        ctx: null,
        running: false,
        paused: false,
        lastTime: 0,
        rafId: null,
        W: 800,
        H: 600,

        start(gameId) {
          this.stop();
          this.currentId = gameId;
          this.canvas = $('#gameCanvas');
          this.ctx = this.canvas.getContext('2d');
          this.resize();
          this.paused = false;

          const factory = GameFactory[gameId];
          if (factory) {
            this.current = factory(this.canvas, this.ctx);
          } else {
            this.current = null;
          }

          if (!this.current) {
            UI.showToast('Гра не знайдена', 2000);
            return;
          }

          Storage.incrementGamesPlayed();
          UI.updateHubStats();

          this.running = true;
          this.lastTime = performance.now();

          if (this.current.init) this.current.init();

          this.loop = this.loop.bind(this);
          this.rafId = requestAnimationFrame(this.loop);

          this.setupControls();
        },

        stop() {
          this.running = false;
          if (this.rafId) {
            cancelAnimationFrame(this.rafId);
            this.rafId = null;
          }
          if (this.current && this.current.destroy) {
            try { this.current.destroy(); } catch (e) {}
          }
          this.current = null;
          this.currentId = null;
          this.clearControls();
          window.removeEventListener('resize', this._resizeHandler);
          window.removeEventListener('orientationchange', this._resizeHandler);
        },

        restart() {
          if (this.currentId) {
            const id = this.currentId;
            this.start(id);
          }
        },

        togglePause() {
          if (!this.current) return;
          this.paused = !this.paused;
          $('#gamePauseBtn').textContent = this.paused ? '▶' : '⏸';
          if (this.current.onPause) this.current.onPause(this.paused);
        },

        onOverlayAction() {
          if (!this.current) return;
          if (this.current.onOverlayAction) {
            this.current.onOverlayAction();
          } else {
            this.restart();
          }
        },

        resize() {
          if (!this.canvas) return;
          const wrapper = $('#gameCanvasWrapper');
          const rect = wrapper.getBoundingClientRect();
          const aspect = this.W / this.H;
          let w = rect.width;
          let h = rect.height;
          if (w / h > aspect) {
            w = h * aspect;
          } else {
            h = w / aspect;
          }
          this.canvas.style.width = Math.floor(w) + 'px';
          this.canvas.style.height = Math.floor(h) + 'px';
          this.canvas.width = this.W;
          this.canvas.height = this.H;
        },

        loop(timestamp) {
          if (!this.running) return;
          const dt = Math.min(50, timestamp - this.lastTime) / 1000;
          this.lastTime = timestamp;

          if (!this.paused && this.current && this.current.update) {
            try {
              this.current.update(dt);
            } catch (e) {
              console.error('Update error:', e);
            }
          }

          if (this.current && this.current.render) {
            try {
              this.ctx.clearRect(0, 0, this.W, this.H);
              this.current.render(this.ctx, dt);
            } catch (e) {
              console.error('Render error:', e);
            }
          }

          this.rafId = requestAnimationFrame(this.loop);
        },

        setupControls() {
          this.clearControls();
          window.addEventListener('resize', this._resizeHandler = () => this.resize());
          window.addEventListener('orientationchange', this._resizeHandler);
          this.resize();
          if (this.current && this.current.setupControls) {
            this.current.setupControls($('#gameControls'));
          }
        },

        clearControls() {
          const container = $('#gameControls');
          if (container) container.innerHTML = '';
        }
      };

            ]
          }
        ];

        let state = {
          levelIndex: 0,
          map: [],
          player: { x: 1, y: 1 },
          diamonds: [],
          collected: 0,
          total: 0,
          hasKey: false,
          key: { x: 0, y: 0 },
          portal: { x: 0, y: 0 },
          spikes: [],
          enemies: [],
          animFrame: 0,
          pulse: 0,
          gameState: 'playing',
          score: 0,
          moveCooldown: 0
        };

        let keys = {};
        let touchDir = null;
        let moveDelay = 8;

        function isWall(x, y) {
          if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return true;
          return state.map[y][x] === CELL.WALL;
        }

        function isSpikeAt(x, y) {
          return state.spikes.some(s => s.x === x && s.y === y);
        }

        function isEnemyAt(x, y) {
          return state.enemies.some(e => e.x === x && e.y === y);
        }

        function loadLevel(idx) {
          const level = LEVELS[idx % LEVELS.length];
          state.levelIndex = idx;
          state.map = deepCopy(level.map);
          state.player = { x: level.player.x, y: level.player.y };
          state.diamonds = deepCopy(level.diamonds);
          state.total = state.diamonds.length;
          state.collected = 0;
          state.hasKey = false;
          state.key = { x: level.key.x, y: level.key.y };
          state.portal = { x: level.portal.x, y: level.portal.y };
          state.spikes = deepCopy(level.spikes);
          state.enemies = deepCopy(level.enemies).map(e => ({
            x: e.x, y: e.y, dx: e.dx || 0, dy: e.dy || 0,
            minX: e.minX, maxX: e.maxX, minY: e.minY, maxY: e.maxY
          }));
          state.animFrame = 0;
          state.pulse = 0;
          state.gameState = 'playing';
          state.moveCooldown = 0;
          moveDelay = 8;
          keys = {};
          touchDir = null;
          updateHUD();
          UI.hideGameOverlay();
        }

        function updateHUD() {
          const totalScore = state.score + state.collected * 100 + state.levelIndex * 500;
          UI.updateGameHUD('Diamond Hunter', totalScore, Storage.getHighScore('diamond_hunter'));
        }

        function onDeath() {
          if (state.gameState !== 'playing') return;
          state.gameState = 'dead';
          const finalScore = state.score + state.collected * 100 + state.levelIndex * 500;
          Storage.setHighScore('diamond_hunter', finalScore);
          UI.updateGameHUD('Diamond Hunter', finalScore, Storage.getHighScore('diamond_hunter'));
          UI.showGameOverlay(
            'ГРУ ЗАВЕРШЕНО',
            'Ти натрапив на небезпеку! Рівень ' + (state.levelIndex + 1),
            'СПРОБУВАТИ ЗНОВУ',
            'Очки: <span>' + formatNumber(finalScore) + '</span>'
          );
          AudioEngine.fail();
        }

        function onLevelComplete() {
          state.gameState = 'won';
          state.score += 1000 + state.collected * 100;
          const finalScore = state.score + state.levelIndex * 500;
          Storage.setHighScore('diamond_hunter', finalScore);
          UI.updateGameHUD('Diamond Hunter', finalScore, Storage.getHighScore('diamond_hunter'));
          const isLast = state.levelIndex >= LEVELS.length - 1;
          UI.showGameOverlay(
            isLast ? 'ГРУ ПРОЙДЕНО!' : 'РІВЕНЬ ПРОЙДЕНО!',
            isLast ? 'Ти пройшов усі рівні Diamond Hunter!' : 'Портал відкрито! Рівень ' + (state.levelIndex + 1) + ' завершено.',
            isLast ? 'ГРАТИ ЗНОВУ' : 'НАСТУПНИЙ РІВЕНЬ',
            'Очки: <span>' + formatNumber(finalScore) + '</span>'
          );
          AudioEngine.success();
        }

        function tryMove(dx, dy) {
          if (state.gameState !== 'playing') return;
          const nx = state.player.x + dx;
          const ny = state.player.y + dy;
          if (isWall(nx, ny)) return;
          if (isEnemyAt(nx, ny) || isSpikeAt(nx, ny)) {
            onDeath();
            return;
          }
          state.player.x = nx;
          state.player.y = ny;

          const di = state.diamonds.findIndex(d => d.x === nx && d.y === ny);
          if (di !== -1) {
            state.diamonds.splice(di, 1);
            state.collected++;
            AudioEngine.coin();
            updateHUD();
          }

          if (state.key.x === nx && state.key.y === ny && !state.hasKey) {
            state.hasKey = true;
            AudioEngine.powerup();
            UI.showToast('🔑 Ключ знайдено!', 1500);
          }

          if (state.portal.x === nx && state.portal.y === ny && state.hasKey && state.diamonds.length === 0) {
            onLevelComplete();
          }
        }

        function moveEnemies() {
          for (const e of state.enemies) {
            if (e.dx !== 0) {
              const next = e.x + e.dx;
              if (next < e.minX || next > e.maxX || isWall(next, e.y)) {
                e.dx *= -1;
              } else {
                e.x = next;
              }
            } else if (e.dy !== 0) {
              const next = e.y + e.dy;
              if (next < e.minY || next > e.maxY || isWall(e.x, next)) {
                e.dy *= -1;
              } else {
                e.y = next;
              }
            }
          }
          if (state.gameState === 'playing') {
            if (isEnemyAt(state.player.x, state.player.y)) {
              onDeath();
            }
          }
        }

        function drawBackground(c) {
          const grad = c.createRadialGradient(canvas.width / 2, canvas.height / 2, 50, canvas.width / 2, canvas.height / 2, canvas.width * 0.7);
          grad.addColorStop(0, '#0f1525');
          grad.addColorStop(1, '#060a14');
          c.fillStyle = grad;
          c.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawTile(c, x, y, type) {
          const px = x * TILE;
          const py = y * TILE;
          if (type === CELL.WALL) {
            const grad = c.createLinearGradient(px, py, px + TILE, py + TILE);
            grad.addColorStop(0, '#1a2035');
            grad.addColorStop(1, '#0f1525');
            c.fillStyle = grad;
            c.fillRect(px, py, TILE, TILE);
            c.strokeStyle = 'rgba(0, 240, 255, 0.18)';
            c.lineWidth = 1;
            c.strokeRect(px + 0.5, py + 0.5, TILE - 1, TILE - 1);
          } else {
            c.fillStyle = '#0d1220';
            c.fillRect(px, py, TILE, TILE);
            c.strokeStyle = 'rgba(0, 240, 255, 0.04)';
            c.lineWidth = 1;
            c.strokeRect(px + 0.5, py + 0.5, TILE - 1, TILE - 1);
          }
        }

        function drawDiamond(c, x, y, time) {
          const cx = x * TILE + TILE / 2;
          const cy = y * TILE + TILE / 2;
          const size = TILE * 0.32;
          const pulse = 1 + Math.sin(time * 3 + x + y) * 0.12;
          c.save();
          c.translate(cx, cy);
          c.scale(pulse, pulse);
          c.shadowColor = '#00f0ff';
          c.shadowBlur = 18;
          c.beginPath();
          c.moveTo(0, -size);
          c.lineTo(size * 0.7, 0);
          c.lineTo(0, size);
          c.lineTo(-size * 0.7, 0);
          c.closePath();
          const grad = c.createLinearGradient(-size, -size, size, size);
          grad.addColorStop(0, '#00ffff');
          grad.addColorStop(0.5, '#00ccff');
          grad.addColorStop(1, '#0088ff');
          c.fillStyle = grad;
          c.fill();
          c.strokeStyle = '#ffffff';
          c.lineWidth = 1.5;
          c.stroke();
          c.shadowBlur = 0;
          c.restore();
        }

        function drawKey(c, x, y, time) {
          const cx = x * TILE + TILE / 2;
          const cy = y * TILE + TILE / 2;
          const pulse = 1 + Math.sin(time * 4) * 0.1;
          c.save();
          c.translate(cx, cy);
          c.scale(pulse, pulse);
          c.shadowColor = '#ffdd00';
          c.shadowBlur = 20;
          c.beginPath();
          c.arc(-4, 0, 6, 0, Math.PI * 2);
          c.strokeStyle = '#ffdd00';
          c.lineWidth = 3;
          c.stroke();
          c.beginPath();
          c.moveTo(2, 0);
          c.lineTo(12, 0);
          c.stroke();
          c.beginPath();
          c.moveTo(8, 0);
          c.lineTo(8, 5);
          c.stroke();
          c.beginPath();
          c.moveTo(11, 0);
          c.lineTo(11, 4);
          c.stroke();
          c.shadowBlur = 0;
          c.restore();
        }

        function drawPortal(c, x, y, time) {
          const cx = x * TILE + TILE / 2;
          const cy = y * TILE + TILE / 2;
          const active = state.hasKey && state.diamonds.length === 0;
          const pulse = 1 + Math.sin(time * 5) * 0.15;
          const rot = time * 2;
          c.save();
          c.translate(cx, cy);
          c.rotate(rot);
          const color1 = active ? '#00ff88' : '#ff4466';
          const color2 = active ? '#00ffff' : '#ff2244';
          c.shadowColor = color1;
          c.shadowBlur = active ? 30 : 15;
          for (let i = 0; i < 3; i++) {
            c.beginPath();
            c.arc(0, 0, (TILE * 0.3) * pulse + i * 3, 0, Math.PI * 2);
            c.strokeStyle = i % 2 === 0 ? color1 : color2;
            c.lineWidth = 2.5;
            c.stroke();
          }
          c.beginPath();
          c.arc(0, 0, TILE * 0.15 * pulse, 0, Math.PI * 2);
          c.fillStyle = active ? 'rgba(0, 255, 136, 0.7)' : 'rgba(255, 68, 102, 0.4)';
          c.fill();
          c.shadowBlur = 0;
          c.restore();
        }

        function drawSpike(c, x, y, time) {
          const px = x * TILE;
          const py = y * TILE;
          const cx = px + TILE / 2;
          const cy = py + TILE / 2;
          c.save();
          c.shadowColor = '#ff3366';
          c.shadowBlur = 12;
          for (let i = 0; i < 3; i++) {
            const offset = (i - 1) * (TILE * 0.3);
            c.beginPath();
            c.moveTo(cx + offset - 6, cy + 10);
            c.lineTo(cx + offset, cy - 12);
            c.lineTo(cx + offset + 6, cy + 10);
            c.closePath();
            c.fillStyle = 'rgba(255, 51, 102, 0.85)';
            c.fill();
            c.strokeStyle = '#ff6688';
            c.lineWidth = 1.5;
            c.stroke();
          }
          c.shadowBlur = 0;
          c.restore();
        }

        function drawEnemy(c, x, y, time) {
          const cx = x * TILE + TILE / 2;
          const cy = y * TILE + TILE / 2;
          const pulse = 1 + Math.sin(time * 6) * 0.1;
          c.save();
          c.shadowColor = '#ff00ff';
          c.shadowBlur = 20;
          c.beginPath();
          c.arc(cx, cy, TILE * 0.32 * pulse, 0, Math.PI * 2);
          const grad = c.createRadialGradient(cx - 4, cy - 4, 2, cx, cy, TILE * 0.35);
          grad.addColorStop(0, '#ff88ff');
          grad.addColorStop(1, '#cc00cc');
          c.fillStyle = grad;
          c.fill();
          c.strokeStyle = '#ff44ff';
          c.lineWidth = 2;
          c.stroke();
          c.beginPath();
          c.arc(cx - 4, cy - 3, 3, 0, Math.PI * 2);
          c.fillStyle = '#ffffff';
          c.fill();
          c.beginPath();
          c.arc(cx + 4, cy - 3, 3, 0, Math.PI * 2);
          c.fillStyle = '#ffffff';
          c.fill();
          c.beginPath();
          c.arc(cx - 4, cy - 3, 1.5, 0, Math.PI * 2);
          c.fillStyle = '#000000';
          c.fill();
          c.beginPath();
          c.arc(cx + 4, cy - 3, 1.5, 0, Math.PI * 2);
          c.fillStyle = '#000000';
          c.fill();
          c.shadowBlur = 0;
          c.restore();
        }

        function drawPlayer(c, x, y, time) {
          const cx = x * TILE + TILE / 2;
          const cy = y * TILE + TILE / 2;
          const pulse = 1 + Math.sin(state.pulse) * 0.06;
          c.save();
          c.shadowColor = '#00ffff';
          c.shadowBlur = 25;
          c.beginPath();
          c.arc(cx, cy, TILE * 0.35 * pulse, 0, Math.PI * 2);
          const grad = c.createRadialGradient(cx - 5, cy - 5, 3, cx, cy, TILE * 0.4);
          grad.addColorStop(0, '#66ffff');
          grad.addColorStop(0.6, '#00ccff');
          grad.addColorStop(1, '#0088cc');
          c.fillStyle = grad;
          c.fill();
          c.strokeStyle = '#ffffff';
          c.lineWidth = 2;
          c.stroke();
          c.beginPath();
          c.arc(cx - 4, cy - 3, 3.5, 0, Math.PI * 2);
          c.fillStyle = '#ffffff';
          c.fill();
          c.beginPath();
          c.arc(cx + 4, cy - 3, 3.5, 0, Math.PI * 2);
          c.fillStyle = '#ffffff';
          c.fill();
          c.beginPath();
          c.arc(cx - 4, cy - 3, 1.8, 0, Math.PI * 2);
          c.fillStyle = '#003344';
          c.fill();
          c.beginPath();
          c.arc(cx + 4, cy - 3, 1.8, 0, Math.PI * 2);
          c.fillStyle = '#003344';
          c.fill();
          if (state.hasKey) {
            c.beginPath();
            c.arc(cx, cy - TILE * 0.45, 3, 0, Math.PI * 2);
            c.fillStyle = '#ffdd00';
            c.shadowColor = '#ffdd00';
            c.shadowBlur = 15;
            c.fill();
          }
          c.shadowBlur = 0;
          c.restore();
        }

        return {
          init() {
            loadLevel(0);
          },

          setupControls(container) {
            container.innerHTML = '';
            const dpad = document.createElement('div');
            dpad.className = 'dpad';
            const dirs = [
              null, 'up', null,
              'left', null, 'right',
              null, 'down', null
            ];
            for (const d of dirs) {
              const btn = document.createElement('div');
              if (d === null) {
                btn.className = 'dpad-btn empty';
              } else if (d === 'center') {
                btn.className = 'dpad-btn dpad-center';
              } else {
                btn.className = 'dpad-btn';
                btn.dataset.dir = d;
                const arrows = { up: '▲', down: '▼', left: '◀', right: '▶' };
                btn.textContent = arrows[d];
                btn.addEventListener('touchstart', (e) => {
                  e.preventDefault();
                  touchDir = d;
                  btn.classList.add('active');
                }, { passive: false });
                btn.addEventListener('touchend', (e) => {
                  e.preventDefault();
                  touchDir = null;
                  btn.classList.remove('active');
                }, { passive: false });
                btn.addEventListener('touchcancel', () => {
                  touchDir = null;
                  btn.classList.remove('active');
                });
                btn.addEventListener('mousedown', (e) => {
                  e.preventDefault();
                  touchDir = d;
                  btn.classList.add('active');
                });
                btn.addEventListener('mouseup', () => {
                  touchDir = null;
                  btn.classList.remove('active');
                });
                btn.addEventListener('mouseleave', () => {
                  touchDir = null;
                  btn.classList.remove('active');
                });
              }
              dpad.appendChild(btn);
            }
            container.appendChild(dpad);

            if (!this._keyHandler) {
              this._keyHandler = (e) => {
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyW', 'KeyA', 'KeyS', 'KeyD', 'Space'].includes(e.code)) {
                  e.preventDefault();
                }
                keys[e.code] = true;
              };
              this._keyUpHandler = (e) => {
                keys[e.code] = false;
              };
              document.addEventListener('keydown', this._keyHandler);
              document.addEventListener('keyup', this._keyUpHandler);
            }

            if (!this._swipeHandler) {
              let sx = 0, sy = 0;
              this._swipeHandler = {
                start: (e) => {
                  if (e.touches.length === 1) {
                    sx = e.touches[0].clientX;
                    sy = e.touches[0].clientY;
                  }
                },
                move: (e) => {
                  e.preventDefault();
                  if (e.touches.length === 1) {
                    const dx = e.touches[0].clientX - sx;
                    const dy = e.touches[0].clientY - sy;
                    const th = 20;
                    if (Math.abs(dx) > th || Math.abs(dy) > th) {
                      if (Math.abs(dx) > Math.abs(dy)) {
                        touchDir = dx > 0 ? 'right' : 'left';
                      } else {
                        touchDir = dy > 0 ? 'down' : 'up';
                      }
                    }
                  }
                },
                end: () => { touchDir = null; }
              };
              canvas.addEventListener('touchstart', this._swipeHandler.start, { passive: true });
              canvas.addEventListener('touchmove', this._swipeHandler.move, { passive: false });
              canvas.addEventListener('touchend', this._swipeHandler.end, { passive: true });
            }
          },

          onOverlayAction() {
            if (state.gameState === 'won') {
              const next = state.levelIndex + 1;
              if (next >= LEVELS.length) {
                loadLevel(0);
              } else {
                loadLevel(next);
              }
            } else {
              loadLevel(state.levelIndex);
            }
          },

          onPause(paused) {
            if (paused) {
              ctx.fillStyle = 'rgba(4, 7, 14, 0.75)';
              ctx.fillRect(0, 0, canvas.width, canvas.height);
              ctx.fillStyle = '#00f0ff';
              ctx.font = 'bold 48px "Segoe UI", sans-serif';
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.shadowColor = '#00f0ff';
              ctx.shadowBlur = 30;
              ctx.fillText('ПАУЗА', canvas.width / 2, canvas.height / 2);
              ctx.shadowBlur = 0;
            }
          },

          update(dt) {
            if (state.gameState !== 'playing') return;
            state.animFrame++;
            state.pulse = (state.pulse + 0.08) % (Math.PI * 2);

            if (state.moveCooldown > 0) {
              state.moveCooldown--;
            } else {
              let dx = 0, dy = 0;
              if (keys['ArrowUp'] || keys['KeyW'] || touchDir === 'up') dy = -1;
              else if (keys['ArrowDown'] || keys['KeyS'] || touchDir === 'down') dy = 1;
              else if (keys['ArrowLeft'] || keys['KeyA'] || touchDir === 'left') dx = -1;
              else if (keys['ArrowRight'] || keys['KeyD'] || touchDir === 'right') dx = 1;
              if (dx !== 0 || dy !== 0) {
                tryMove(dx, dy);
                state.moveCooldown = moveDelay;
              }
            }

            if (state.animFrame % 6 === 0) {
              moveEnemies();
            }
          },

          render(c, dt) {
            const time = state.animFrame * 0.03;
            drawBackground(c);

            for (let y = 0; y < ROWS; y++) {
              for (let x = 0; x < COLS; x++) {
                drawTile(c, x, y, state.map[y][x]);
              }
            }

            for (const s of state.spikes) drawSpike(c, s.x, s.y, time);
            for (const d of state.diamonds) drawDiamond(c, d.x, d.y, time);
            if (!state.hasKey) drawKey(c, state.key.x, state.key.y, time);
            drawPortal(c, state.portal.x, state.portal.y, time);
            for (const e of state.enemies) drawEnemy(c, e.x, e.y, time);
            drawPlayer(c, state.player.x, state.player.y, time);

            if (state.hasKey && state.diamonds.length === 0) {
              c.fillStyle = 'rgba(0, 255, 136, 0.7)';
              c.font = 'bold 16px "Segoe UI", sans-serif';
              c.textAlign = 'center';
              c.fillText('Портал відкрито!', canvas.width / 2, 30);
            }
          },

          destroy() {
            if (this._keyHandler) {
              document.removeEventListener('keydown', this._keyHandler);
              document.removeEventListener('keyup', this._keyUpHandler);
              this._keyHandler = null;
              this._keyUpHandler = null;
            }
            if (this._swipeHandler) {
              canvas.removeEventListener('touchstart', this._swipeHandler.start);
              canvas.removeEventListener('touchmove', this._swipeHandler.move);
              canvas.removeEventListener('touchend', this._swipeHandler.end);
              this._swipeHandler = null;
            }
          }
        };
      };

      /* ======================================================================
         GAME 2: SPACE SHOOTER
         ====================================================================== */
      GameFactory.space_shooter = function(canvas, ctx) {
        const W = canvas.width;
        const H = canvas.height;

        let player = { x: W / 2, y: H - 70, w: 36, h: 40, cooldown: 0, invuln: 0 };
        let bullets = [];
        let enemies = [];
        let particles = [];
        let stars = [];
        let powerups = [];
        let boss = null;
        let wave = 1;
        let score = 0;
        let spawnTimer = 0;
        let bossTimer = 0;
        let gameOver = false;
        let win = false;
        let keys = {};
        let touchActive = false;
        let touchX = 0, touchY = 0;
        let moveX = 0, moveY = 0;
        let shootHeld = false;

        for (let i = 0; i < 120; i++) {
          stars.push({
            x: Math.random() * W,
            y: Math.random() * H,
            s: Math.random() * 2 + 0.5,
            v: Math.random() * 60 + 20
          });
        }

        function spawnEnemy() {
          const type = Math.random() < 0.15 ? 'tank' : (Math.random() < 0.4 ? 'zig' : 'basic');
          const x = rand(30, W - 30);
          const baseHp = type === 'tank' ? 5 : (type === 'zig' ? 2 : 1);
          const hp = baseHp + Math.floor(wave / 4);
          enemies.push({
            x, y: -40,
            w: type === 'tank' ? 44 : (type === 'zig' ? 30 : 28),
            h: type === 'tank' ? 40 : 28,
            hp, maxHp: hp,
            type,
            vx: type === 'zig' ? rand(-120, 120) : 0,
            vy: type === 'tank' ? 40 : (type === 'zig' ? 70 : 90 + wave * 4),
            shootTimer: rand(1, 3),
            phase: Math.random() * Math.PI * 2,
            baseX: x,
            score: type === 'tank' ? 30 : (type === 'zig' ? 15 : 10)
          });
        }

        function spawnBoss() {
          boss = {
            x: W / 2,
            y: -100,
            w: 120,
            h: 80,
            hp: 60 + wave * 20,
            maxHp: 60 + wave * 20,
            vx: 80,
            shootTimer: 1.5,
            phase: 0,
            entering: true,
            score: 500
          };
          UI.showToast('⚠ БОС З\'ЯВИВСЯ!', 2500);
          AudioEngine.explode();
        }

        function fireBullet(x, y, vx, vy, isEnemy) {
          bullets.push({
            x, y, vx, vy,
            w: isEnemy ? 6 : 4,
            h: isEnemy ? 14 : 14,
            isEnemy: !!isEnemy,
            life: 3
          });
        }

        function explode(x, y, color, count) {
          for (let i = 0; i < count; i++) {
            const a = Math.random() * Math.PI * 2;
            const sp = rand(30, 180);
            particles.push({
              x, y,
              vx: Math.cos(a) * sp,
              vy: Math.sin(a) * sp,
              life: rand(0.3, 0.8),
              maxLife: 0.8,
              color: color || '#ff8040',
              size: rand(2, 5)
            });
          }
        }

        function reset() {
          player = { x: W / 2, y: H - 70, w: 36, h: 40, cooldown: 0, invuln: 1.5 };
          bullets = [];
          enemies = [];
          particles = [];
          powerups = [];
          boss = null;
          wave = 1;
          score = 0;
          spawnTimer = 0;
          bossTimer = 0;
          gameOver = false;
          win = false;
          updateHUD();
          UI.hideGameOverlay();
        }

        function updateHUD() {
          UI.updateGameHUD('Space Shooter', score, Storage.getHighScore('space_shooter'));
        }

        function endGame(isWin) {
          if (gameOver || win) return;
          gameOver = !isWin;
          win = isWin;
          Storage.setHighScore('space_shooter', score);
          UI.updateGameHUD('Space Shooter', score, Storage.getHighScore('space_shooter'));
          UI.showGameOverlay(
            isWin ? 'ПЕРЕМОГА!' : 'ГРУ ЗАВЕРШЕНО',
            isWin ? 'Ти знищив усіх босів!' : 'Твій корабель знищено на хвилі ' + wave,
            isWin ? 'ГРАТИ ЗНОВУ' : 'СПРОБУВАТИ ЗНОВУ',
            'Очки: <span>' + formatNumber(score) + '</span>'
          );
          if (isWin) AudioEngine.success(); else AudioEngine.fail();
        }

        return {
          init() {
            reset();
          },

          setupControls(container) {
            container.innerHTML = '';
            const dpad = document.createElement('div');
            dpad.className = 'dpad';
            const dirs = [null, 'up', null, 'left', null, 'right', null, 'down', null];
            for (const d of dirs) {
              const btn = document.createElement('div');
              if (d === null) { btn.className = 'dpad-btn empty'; }
              else {
                btn.className = 'dpad-btn';
                const arrows = { up: '▲', down: '▼', left: '◀', right: '▶' };
                btn.textContent = arrows[d];
                const setDir = (val) => {
                  if (val === 'up') moveY = -1;
                  else if (val === 'down') moveY = 1;
                  else if (val === 'left') moveX = -1;
                  else if (val === 'right') moveX = 1;
                };
                const clearDir = () => {
                  if (d === 'up' || d === 'down') moveY = 0;
                  if (d === 'left' || d === 'right') moveX = 0;
                };
                btn.addEventListener('touchstart', (e) => { e.preventDefault(); setDir(d); btn.classList.add('active'); }, { passive: false });
                btn.addEventListener('touchend', (e) => { e.preventDefault(); clearDir(); btn.classList.remove('active'); }, { passive: false });
                btn.addEventListener('touchcancel', () => { clearDir(); btn.classList.remove('active'); });
                btn.addEventListener('mousedown', (e) => { e.preventDefault(); setDir(d); btn.classList.add('active'); });
                btn.addEventListener('mouseup', () => { clearDir(); btn.classList.remove('active'); });
                btn.addEventListener('mouseleave', () => { clearDir(); btn.classList.remove('active'); });
              }
              dpad.appendChild(btn);
            }
            container.appendChild(dpad);

            const actions = document.createElement('div');
            actions.className = 'action-buttons';
            const shootBtn = document.createElement('div');
            shootBtn.className = 'action-btn';
            shootBtn.textContent = '🔥';
            shootBtn.addEventListener('touchstart', (e) => { e.preventDefault(); shootHeld = true; shootBtn.classList.add('active'); }, { passive: false });
            shootBtn.addEventListener('touchend', (e) => { e.preventDefault(); shootHeld = false; shootBtn.classList.remove('active'); }, { passive: false });
            shootBtn.addEventListener('mousedown', (e) => { e.preventDefault(); shootHeld = true; shootBtn.classList.add('active'); });
            shootBtn.addEventListener('mouseup', () => { shootHeld = false; shootBtn.classList.remove('active'); });
            shootBtn.addEventListener('mouseleave', () => { shootHeld = false; shootBtn.classList.remove('active'); });
            actions.appendChild(shootBtn);
            container.appendChild(actions);

            if (!this._keyHandler) {
              this._keyHandler = (e) => {
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyW', 'KeyA', 'KeyS', 'KeyD', 'Space'].includes(e.code)) e.preventDefault();
                keys[e.code] = true;
              };
              this._keyUpHandler = (e) => { keys[e.code] = false; };
              document.addEventListener('keydown', this._keyHandler);
              document.addEventListener('keyup', this._keyUpHandler);
            }
          },

          onOverlayAction() {
            reset();
          },

          update(dt) {
            if (gameOver || win) return;

            let dx = moveX;
            let dy = moveY;
            if (keys['ArrowLeft'] || keys['KeyA']) dx = -1;
            else if (keys['ArrowRight'] || keys['KeyD']) dx = 1;
            if (keys['ArrowUp'] || keys['KeyW']) dy = -1;
            else if (keys['ArrowDown'] || keys['KeyS']) dy = 1;

            const speed = 360;
            player.x += dx * speed * dt;
            player.y += dy * speed * dt;
            player.x = clamp(player.x, player.w / 2, W - player.w / 2);
            player.y = clamp(player.y, player.h / 2 + 60, H - player.h / 2 - 10);

            if (player.invuln > 0) player.invuln -= dt;

            player.cooldown -= dt;
            const shoot = keys['Space'] || shootHeld;
            if (shoot && player.cooldown <= 0) {
              fireBullet(player.x, player.y - player.h / 2, 0, -700, false);
              player.cooldown = 0.16;
              AudioEngine.tone(900, 0.06, 'square', 0.04);
            }

            for (const s of stars) {
              s.y += s.v * dt;
              if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
            }

            spawnTimer -= dt;
            if (!boss && spawnTimer <= 0) {
              spawnEnemy();
              spawnTimer = Math.max(0.4, 1.6 - wave * 0.1);
            }

            if (!boss && wave > 0 && wave % 3 === 0 && enemies.length === 0) {
              bossTimer -= dt;
              if (bossTimer <= 0) {
                spawnBoss();
              }
            } else if (!boss) {
              bossTimer = 2.5;
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
              const b = bullets[i];
              b.x += b.vx * dt;
              b.y += b.vy * dt;
              b.life -= dt;
              if (b.life <= 0 || b.y < -20 || b.y > H + 20 || b.x < -20 || b.x > W + 20) {
                bullets.splice(i, 1);
                continue;
              }

              if (!b.isEnemy) {
                for (let j = enemies.length - 1; j >= 0; j--) {
                  const e = enemies[j];
                  if (Math.abs(b.x - e.x) < e.w / 2 && Math.abs(b.y - e.y) < e.h / 2) {
                    e.hp--;
                    explode(b.x, b.y, '#ffaa00', 4);
                    bullets.splice(i, 1);
                    if (e.hp <= 0) {
                      explode(e.x, e.y, '#ff4060', 14);
                      score += e.score;
                      updateHUD();
                      enemies.splice(j, 1);
                      AudioEngine.explode();
                    }
                    break;
                  }
                }
                if (boss && bullets[i] && !bullets[i].isEnemy) {
                  const b2 = bullets[i];
                  if (Math.abs(b2.x - boss.x) < boss.w / 2 && Math.abs(b2.y - boss.y) < boss.h / 2) {
                    boss.hp--;
                    explode(b2.x, b2.y, '#ffaa00', 4);
                    bullets.splice(i, 1);
                    if (boss.hp <= 0) {
                      explode(boss.x, boss.y, '#ff40ff', 40);
                      score += boss.score;
                      boss = null;
                      wave++;
                      UI.showToast('Хвиля ' + wave, 1500);
                      AudioEngine.success();
                      updateHUD();
                    }
                  }
                }
              } else {
                if (player.invuln <= 0 && Math.abs(b.x - player.x) < player.w / 2 && Math.abs(b.y - player.y) < player.h / 2) {
                  bullets.splice(i, 1);
                  player.invuln = 1.5;
                  explode(player.x, player.y, '#00ffff', 20);
                  AudioEngine.hit();
                  if (--playerLives <= 0) endGame(false);
                }
              }
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
              const e = enemies[i];
              if (e.type === 'zig') {
                e.phase += dt * 3;
                e.x = e.baseX + Math.sin(e.phase) * 100;
                e.x = clamp(e.x, e.w / 2, W - e.w / 2);
              }
              e.y += e.vy * dt;

              e.shootTimer -= dt;
              if (e.shootTimer <= 0 && e.y > 0) {
                fireBullet(e.x, e.y + e.h / 2, 0, 220, true);
                e.shootTimer = rand(1.2, 2.5);
              }

              if (e.y > H + 50) {
                enemies.splice(i, 1);
                continue;
              }

              if (player.invuln <= 0 && Math.abs(e.x - player.x) < (e.w + player.w) / 2 - 4 && Math.abs(e.y - player.y) < (e.h + player.h) / 2 - 4) {
                explode(player.x, player.y, '#00ffff', 20);
                explode(e.x, e.y, '#ff4060', 14);
                enemies.splice(i, 1);
                AudioEngine.hit();
                player.invuln = 1.5;
                if (--playerLives <= 0) endGame(false);
              }
            }

            if (boss) {
              if (boss.entering) {
                boss.y += 80 * dt;
                if (boss.y >= 100) { boss.entering = false; boss.y = 100; }
              } else {
                boss.phase += dt;
                boss.x += boss.vx * dt;
                if (boss.x < boss.w / 2 + 20 || boss.x > W - boss.w / 2 - 20) boss.vx *= -1;
                boss.y = 100 + Math.sin(boss.phase * 2) * 20;

                boss.shootTimer -= dt;
                if (boss.shootTimer <= 0) {
                  for (let k = -2; k <= 2; k++) {
                    fireBullet(boss.x + k * 25, boss.y + boss.h / 2, k * 40, 240, true);
                  }
                  boss.shootTimer = rand(0.8, 1.3);
                }

                if (player.invuln <= 0 && Math.abs(boss.x - player.x) < (boss.w + player.w) / 2 - 8 && Math.abs(boss.y - player.y) < (boss.h + player.h) / 2 - 8) {
                  explode(player.x, player.y, '#00ffff', 20);
                  AudioEngine.hit();
                  player.invuln = 1.5;
                  if (--playerLives <= 0) endGame(false);
                }
              }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
              const p = particles[i];
              p.x += p.vx * dt;
              p.y += p.vy * dt;
              p.vx *= 0.97;
              p.vy *= 0.97;
              p.life -= dt;
              if (p.life <= 0) particles.splice(i, 1);
            }

            if (wave >= 10 && !boss && enemies.length === 0 && !gameOver && !win) {
              endGame(true);
            }
          },

          render(c, dt) {
            const grad = c.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, '#060a1a');
            grad.addColorStop(1, '#0a0510');
            c.fillStyle = grad;
            c.fillRect(0, 0, W, H);

            for (const s of stars) {
              c.fillStyle = 'rgba(180, 220, 255, ' + (0.3 + s.s * 0.3) + ')';
              c.fillRect(s.x, s.y, s.s, s.s);
            }

            for (const p of particles) {
              const alpha = p.life / p.maxLife;
              c.globalAlpha = alpha;
              c.fillStyle = p.color;
              c.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
            }
            c.globalAlpha = 1;

            for (const b of bullets) {
              if (b.isEnemy) {
                c.fillStyle = '#ff4060';
                c.shadowColor = '#ff4060';
                c.shadowBlur = 12;
                c.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
              } else {
                c.fillStyle = '#00ffff';
                c.shadowColor = '#00ffff';
                c.shadowBlur = 14;
                c.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
              }
            }
            c.shadowBlur = 0;

            for (const e of enemies) {
              c.save();
              c.shadowColor = e.type === 'tank' ? '#ff4080' : (e.type === 'zig' ? '#ffcc00' : '#ff8040');
              c.shadowBlur = 12;
              if (e.type === 'tank') {
                c.fillStyle = '#cc2266';
                c.beginPath();
                c.moveTo(e.x, e.y - e.h / 2);
                c.lineTo(e.x + e.w / 2, e.y);
                c.lineTo(e.x, e.y + e.h / 2);
                c.lineTo(e.x - e.w / 2, e.y);
                c.closePath();
                c.fill();
                c.strokeStyle = '#ff88bb';
                c.lineWidth = 2;
                c.stroke();
              } else if (e.type === 'zig') {
                c.fillStyle = '#ccaa00';
                c.beginPath();
                c.arc(e.x, e.y, e.w / 2, 0, Math.PI * 2);
                c.fill();
                c.strokeStyle = '#ffee88';
                c.lineWidth = 2;
                c.stroke();
              } else {
                c.fillStyle = '#cc5522';
                c.beginPath();
                c.moveTo(e.x, e.y + e.h / 2);
                c.lineTo(e.x + e.w / 2, e.y - e.h / 2);
                c.lineTo(e.x - e.w / 2, e.y - e.h / 2);
                c.closePath();
                c.fill();
                c.strokeStyle = '#ffaa66';
                c.lineWidth = 2;
                c.stroke();
              }
              c.restore();

              const hpRatio = e.hp / e.maxHp;
              c.fillStyle = 'rgba(0,0,0,0.5)';
              c.fillRect(e.x - e.w / 2, e.y - e.h / 2 - 8, e.w, 4);
              c.fillStyle = '#ff4060';
              c.fillRect(e.x - e.w / 2, e.y - e.h / 2 - 8, e.w * hpRatio, 4);
            }

            if (boss) {
              c.save();
              c.shadowColor = '#ff40ff';
              c.shadowBlur = 25;
              const grad2 = c.createLinearGradient(boss.x - boss.w / 2, boss.y - boss.h / 2, boss.x + boss.w / 2, boss.y + boss.h / 2);
              grad2.addColorStop(0, '#ff40a0');
              grad2.addColorStop(1, '#a020ff');
              c.fillStyle = grad2;
              c.beginPath();
              c.moveTo(boss.x, boss.y - boss.h / 2);
              c.lineTo(boss.x + boss.w / 2, boss.y - boss.h / 6);
              c.lineTo(boss.x + boss.w / 3, boss.y + boss.h / 2);
              c.lineTo(boss.x - boss.w / 3, boss.y + boss.h / 2);
              c.lineTo(boss.x - boss.w / 2, boss.y - boss.h / 6);
              c.closePath();
              c.fill();
              c.strokeStyle = '#ff88ff';
              c.lineWidth = 3;
              c.stroke();
              c.beginPath();
              c.arc(boss.x - 20, boss.y, 8, 0, Math.PI * 2);
              c.fillStyle = '#00ffff';
              c.fill();
              c.beginPath();
              c.arc(boss.x + 20, boss.y, 8, 0, Math.PI * 2);
              c.fillStyle = '#00ffff';
              c.fill();
              c.restore();

              const hpRatio = boss.hp / boss.maxHp;
              c.fillStyle = 'rgba(0,0,0,0.6)';
              c.fillRect(W / 2 - 150, 15, 300, 14);
              c.fillStyle = '#ff40a0';
              c.fillRect(W / 2 - 150, 15, 300 * hpRatio, 14);
              c.strokeStyle = '#ff88ff';
              c.lineWidth = 2;
              c.strokeRect(W / 2 - 150, 15, 300, 14);
            }

            if (!gameOver && !win) {
              c.save();
              c.translate(player.x, player.y);
              if (player.invuln > 0 && Math.floor(player.invuln * 10) % 2 === 0) c.globalAlpha = 0.4;
              c.shadowColor = '#00ffff';
              c.shadowBlur = 20;
              c.fillStyle = '#00ccff';
              c.beginPath();
              c.moveTo(0, -player.h / 2);
              c.lineTo(player.w / 2, player.h / 2);
              c.lineTo(0, player.h / 4);
              c.lineTo(-player.w / 2, player.h / 2);
              c.closePath();
              c.fill();
              c.strokeStyle = '#ffffff';
              c.lineWidth = 2;
              c.stroke();
              c.beginPath();
              c.arc(0, -player.h / 4, 5, 0, Math.PI * 2);
              c.fillStyle = '#ffffff';
              c.fill();
              c.restore();
            }

            c.fillStyle = '#00f0ff';
            c.font = 'bold 16px "Segoe UI", sans-serif';
            c.textAlign = 'left';
            c.fillText('Хвиля: ' + wave, 14, 28);
            c.fillText('Життя: ' + Math.max(0, playerLives), 14, 50);
          },

          destroy() {
            if (this._keyHandler) {
              document.removeEventListener('keydown', this._keyHandler);
              document.removeEventListener('keyup', this._keyUpHandler);
              this._keyHandler = null;
              this._keyUpHandler = null;
            }
          }
        };

        let playerLives = 3;
      };

      /* ======================================================================
         GAME 3: TOWER DEFENSE
         ====================================================================== */
      GameFactory.tower_defense = function(canvas, ctx) {
        const W = canvas.width;
        const H = canvas.height;
        const COLS = 12;
        const ROWS = 8;
        const TILE = Math.min(W / COLS, (H - 80) / ROWS);
        const OFFY = 60;

        let grid = [];
        let towers = [];
        let enemies = [];
        let bullets = [];
        let particles = [];
        let wave = 0;
        let score = 0;
        let lives = 20;
        let gold = 100;
        let selectedTower = null;
        let placingTower = null;
        let spawnTimer = 0;
        let waveActive = false;
        let gameOver = false;
        let win = false;
        let mouseX = 0, mouseY = 0;
        let touchActive = false;

        const TOWER_TYPES = {
          basic: { cost: 30, range: 2.2, dmg: 8, rate: 0.7, color: '#40c0ff', name: 'Стрілець' },
          sniper: { cost: 60, range: 4.5, dmg: 25, rate: 1.6, color: '#c040ff', name: 'Снайпер' },
          rapid: { cost: 80, range: 2.0, dmg: 4, rate: 0.18, color: '#40ff80', name: 'Кулемет' }
        };

        const PATH = [
          { x: 0, y: 1 }, { x: 1, y: 1 }, { x: 2, y: 1 }, { x: 3, y: 1 },
          { x: 3, y: 2 }, { x: 3, y: 3 }, { x: 3, y: 4 }, { x: 3, y: 5 },
          { x: 4, y: 5 }, { x: 5, y: 5 }, { x: 6, y: 5 }, { x: 7, y: 5 },
          { x: 7, y: 4 }, { x: 7, y: 3 }, { x: 7, y: 2 }, { x: 7, y: 1 },
          { x: 8, y: 1 }, { x: 9, y: 1 }, { x: 10, y: 1 }, { x: 11, y: 1 },
          { x: 11, y: 2 }, { x: 11, y: 3 }, { x: 11, y: 4 }, { x: 11, y: 5 },
          { x: 11, y: 6 }, { x: 10, y: 6 }, { x: 9, y: 6 }, { x: 8, y: 6 },
          { x: 7, y: 6 }, { x: 6, y: 6 }, { x: 5, y: 6 }, { x: 4, y: 6 },
          { x: 3, y: 6 }, { x: 2, y: 6 }, { x: 1, y: 6 }, { x: 0, y: 6 }
        ];

        function buildGrid() {
          grid = [];
          for (let y = 0; y < ROWS; y++) {
            grid[y] = [];
            for (let x = 0; x < COLS; x++) {
              grid[y][x] = { path: false, tower: null, x, y };
            }
          }
          for (const p of PATH) {
            if (p.x >= 0 && p.x < COLS && p.y >= 0 && p.y < ROWS) {
              grid[p.y][p.x].path = true;
            }
          }
        }

        function reset() {
          buildGrid();
          towers = [];
          enemies = [];
          bullets = [];
          particles = [];
          wave = 0;
          score = 0;
          lives = 20;
          gold = 120;
          selectedTower = null;
          placingTower = null;
          spawnTimer = 0;
          waveActive = false;
          gameOver = false;
          win = false;
          UI.hideGameOverlay();
          updateHUD();
        }

        function updateHUD() {
          UI.updateGameHUD('Tower Defense', score, Storage.getHighScore('tower_defense'));
        }

        function endGame(isWin) {
          if (gameOver || win) return;
          gameOver = !isWin;
          win = isWin;
          Storage.setHighScore('tower_defense', score);
          UI.updateGameHUD('Tower Defense', score, Storage.getHighScore('tower_defense'));
          UI.showGameOverlay(
            isWin ? 'ПЕРЕМОГА!' : 'ГРУ ЗАВЕРШЕНО',
            isWin ? 'Ти витримав усі хвилі!' : 'Вороги прорвалися на хвилі ' + wave,
            isWin ? 'ГРАТИ ЗНОВУ' : 'СПРОБУВАТИ ЗНОВУ',
            'Очки: <span>' + formatNumber(score) + '</span>'
          );
          if (isWin) AudioEngine.success(); else AudioEngine.fail();
        }

        function spawnWave() {
          wave++;
          waveActive = true;
          spawnTimer = 0;
          UI.showToast('Хвиля ' + wave + ' почалася!', 1500);
          if (wave > 10) {
            endGame(true);
          }
        }

        function spawnEnemy() {
          const hp = 20 + wave * 8;
          const speed = 30 + wave * 3;
          enemies.push({
            pathIndex: 0,
            t: 0,
            x: PATH[0].x,
            y: PATH[0].y,
            hp,
            maxHp: hp,
            speed,
            reward: 5 + Math.floor(wave * 1.5),
            color: wave % 3 === 0 ? '#ff40a0' : '#ff8040'
          });
        }

        function moveEnemies(dt) {
          for (let i = enemies.length - 1; i >= 0; i--) {
            const e = enemies[i];
            e.t += e.speed * dt;
            while (e.t >= 1 && e.pathIndex < PATH.length - 1) {
              e.t -= 1;
              e.pathIndex++;
            }
            if (e.pathIndex >= PATH.length - 1) {
              lives--;
              enemies.splice(i, 1);
              AudioEngine.hit();
              if (lives <= 0) {
                endGame(false);
                return;
              }
              continue;
            }
            const a = PATH[e.pathIndex];
            const b = PATH[e.pathIndex + 1];
            e.x = lerp(a.x, b.x, e.t);
            e.y = lerp(a.y, b.y, e.t);
          }
        }

        function updateTowers(dt) {
          for (const t of towers) {
            t.cooldown -= dt;
            if (t.cooldown <= 0) {
              let target = null;
              let bestDist = Infinity;
              for (const e of enemies) {
                const d = dist(t.x, t.y, e.x, e.y);
                if (d <= t.range && d < bestDist) {
                  bestDist = d;
                  target = e;
                }
              }
              if (target) {
                t.cooldown = t.rate;
                const angle = Math.atan2(target.y - t.y, target.x - t.x);
                bullets.push({
                  x: t.x, y: t.y,
                  vx: Math.cos(angle) * 400,
                  vy: Math.sin(angle) * 400,
                  dmg: t.dmg,
                  life: 1.5,
                  color: t.color
                });
                AudioEngine.tone(700, 0.04, 'square', 0.03);
              }
            }
          }
        }

        function updateBullets(dt) {
          for (let i = bullets.length - 1; i >= 0; i--) {
            const b = bullets[i];
            b.x += b.vx * dt;
            b.y += b.vy * dt;
            b.life -= dt;
            if (b.life <= 0) { bullets.splice(i, 1); continue; }
            let hit = false;
            for (let j = enemies.length - 1; j >= 0; j--) {
              const e = enemies[j];
              if (dist(b.x, b.y, e.x + 0.5, e.y + 0.5) < 0.5) {
                e.hp -= b.dmg;
                hit = true;
                for (let k = 0; k < 3; k++) {
                  particles.push({
                    x: b.x, y: b.y,
                    vx: rand(-50, 50), vy: rand(-50, 50),
                    life: 0.3, maxLife: 0.3,
                    color: b.color, size: 2
                  });
                }
                if (e.hp <= 0) {
                  gold += e.reward;
                  score += e.reward * 10;
                  updateHUD();
                  for (let k = 0; k < 8; k++) {
                    particles.push({
                      x: e.x, y: e.y,
                      vx: rand(-100, 100), vy: rand(-100, 100),
                      life: 0.5, maxLife: 0.5,
                      color: e.color, size: 3
                    });
                  }
                  enemies.splice(j, 1);
                  AudioEngine.coin();
                }
                break;
              }
            }
            if (hit) bullets.splice(i, 1);
          }
        }

        function updateParticles(dt) {
          for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.vx *= 0.95;
            p.vy *= 0.95;
            p.life -= dt;
            if (p.life <= 0) particles.splice(i, 1);
          }
        }

        function screenToGrid(sx, sy) {
          const rect = canvas.getBoundingClientRect();
          const scaleX = canvas.width / rect.width;
          const scaleY = canvas.height / rect.height;
          const cx = (sx - rect.left) * scaleX;
          const cy = (sy - rect.top) * scaleY;
          const gx = Math.floor(cx / TILE);
          const gy = Math.floor((cy - OFFY) / TILE);
          return { x: gx, y: gy };
        }

        function handleTap(sx, sy) {
          const g = screenToGrid(sx, sy);
          if (g.x < 0 || g.x >= COLS || g.y < 0 || g.y >= ROWS) return;

          if (placingTower) {
            const type = TOWER_TYPES[placingTower];
            if (!grid[g.y][g.x].path && !grid[g.y][g.x].tower && gold >= type.cost) {
              gold -= type.cost;
              const tower = {
                x: g.x + 0.5,
                y: g.y + 0.5,
                range: type.range,
                dmg: type.dmg,
                rate: type.rate,
                color: type.color,
                cooldown: 0,
